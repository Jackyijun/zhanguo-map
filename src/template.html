<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战国列国形势图</title>
<style>
  :root {
    --ground:#E3E2D9; --ground-deep:#D6D5C9; --paper:#F2F1EA; --paper-2:#EAE9E0;
    --ink:#1D1E23; --ink-2:#55575E; --ink-3:#83858C; --rule:#C7C5B8; --rule-soft:#D8D6CA;
    --accent:#2B5F87;
    --sea:#D5DCDB; --land:#ECEBE3; --coast:#A9AFAE; --border:#ADAA9A;
    --water:#7F9FB2; --water-fill:#B4C8D2; --range:#9C8F78; --wall:#4A4038; --road:#8C5A3A; --jun:#3B2722;
    --c-battle:#A3473A; --c-pass:#3B3B40; --c-city:#55575E; --c-culture:#2F7470; --c-capital:#1D1E23;
    --s-op:.52; --s-op-hi:.64;
    /*__SLIGHT__*/
    --shadow: 0 1px 2px rgba(29,30,35,.07), 0 8px 24px -12px rgba(29,30,35,.22);
    --f-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --f-zh:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    color-scheme: light;
  }
  /* 英文界面：西文衬线体、系统无衬线体，中文字体垫后 */
  html:lang(en) {
    --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC","STSong","Noto Serif CJK SC",serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
      --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
      --accent:#78ADD8;
      --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
      --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
      --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
      --s-op:.34; --s-op-hi:.46;
      /*__SDARK__*/
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
    --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
    --accent:#78ADD8;
    --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
    --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
    --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
    --s-op:.34; --s-op-hi:.46;
    /*__SDARK__*/
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--ground-deep); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0,1fr); grid-template-columns: minmax(0,1fr); }

  /* masthead */
  .masthead { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding:12px 20px 11px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.14em; }
  .brand .src { font-size:11px; letter-spacing:.18em; color:var(--ink-3); border-left:1px solid var(--rule); padding-left:12px; }
  .masthead .count { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:.06em; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .repo { display:inline-flex; align-items:center; gap:3px; margin-left:4px; padding:3px 0 3px 12px; border-left:1px solid var(--rule); font-size:12px; letter-spacing:.06em; line-height:1.2; color:var(--ink-3); text-decoration:none; white-space:nowrap; }
  .repo:hover { color:var(--ink); }
  .legend .foot.src { margin-top:5px; padding-top:0; border-top:0; }
  .legend .foot a { color:var(--ink-2); text-decoration:underline; text-decoration-color:var(--rule); text-underline-offset:2px; overflow-wrap:anywhere; }
  .legend .foot a:hover { color:var(--ink); text-decoration-color:currentColor; }
  .seg { display:flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; }
  .seg button { background:transparent; border:0; padding:5px 10px; cursor:pointer; font-size:12px; letter-spacing:.06em; color:var(--ink-2); border-right:1px solid var(--rule-soft); white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--paper-2); color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .maponly[hidden] { display:none; }
  .search { position:relative; }
  .search input { width:170px; padding:5px 10px 5px 26px; border:1px solid var(--rule); border-radius:3px; background:var(--ground); font-size:12.5px; }
  .search input::placeholder { color:var(--ink-3); }
  .search svg { position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.5; }

  /* timeline strip */
  .timebar { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:stretch; background:var(--paper); border-bottom:1px solid var(--rule); }
  .timebar[hidden] { display:none; }
  .playcol { width:44px; border-right:1px solid var(--rule-soft); display:grid; grid-template-rows:minmax(0,1fr) auto; }
  .play { border:0; background:none; cursor:pointer; color:var(--ink-2); display:grid; place-items:center; }
  .play:hover { background:var(--paper-2); color:var(--ink); }
  .speed { border:0; border-top:1px solid var(--rule-soft); background:none; cursor:pointer; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); padding:4px 0; letter-spacing:.02em; }
  .speed:hover { background:var(--paper-2); color:var(--ink); }
  .speed[aria-pressed="true"] { color:var(--ink); font-weight:600; }
  .tb-main { min-width:0; display:grid; grid-template-rows:auto auto; }
  .axiswrap { overflow-x:auto; scrollbar-width:thin; padding:0 22px; }
  .axis { position:relative; height:96px; min-width:860px; }
  .axis .ln { position:absolute; left:0; right:0; top:25px; height:2px; background:var(--rule); border-radius:1px; }
  .axis .fill { position:absolute; left:0; top:25px; height:2px; background:var(--ink-2); border-radius:1px; }
  .axis .dec { position:absolute; top:3px; transform:translateX(-50%); font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); letter-spacing:.02em; pointer-events:none; }
  .axis .dec::after { content:""; position:absolute; left:50%; top:16px; width:1px; height:5px; background:var(--ink-3); }
  .axis .sd { position:absolute; top:20px; width:18px; margin-left:-9px; height:74px; border:0; padding:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; color:var(--ink-2); }
  .axis .sd .d { width:9px; height:9px; margin-top:2px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-3); box-sizing:border-box; flex:none; transition:transform .12s; }
  .axis .sd .t { margin-top:5px; writing-mode:vertical-rl; text-orientation:upright; font-family:var(--f-display); font-size:11.5px; line-height:1; letter-spacing:1px; white-space:nowrap; }
  .axis .sd:hover { color:var(--ink); }
  .axis .sd:hover .d { border-color:var(--ink); transform:scale(1.25); }
  .axis .sd.past .d { background:var(--ink-3); }
  .axis .sd[aria-pressed="true"] { color:var(--ink); }
  .axis .sd[aria-pressed="true"] .d { background:var(--ink); border-color:var(--ink); transform:scale(1.5); }
  .axis .sd[aria-pressed="true"] .t { font-weight:700; }
  .bchips { display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:8px; vertical-align:1px; }
  .bchips .lb { font-size:11px; color:var(--c-battle); letter-spacing:.08em; align-self:center; margin-right:2px; }
  .bchips button { font-family:var(--f-display); font-size:12px; padding:0 7px; line-height:19px; border:1px solid color-mix(in srgb, var(--c-battle) 45%, transparent); background:color-mix(in srgb, var(--c-battle) 8%, transparent); color:var(--ink); border-radius:3px; cursor:pointer; }
  .bchips button:hover { background:color-mix(in srgb, var(--c-battle) 18%, transparent); }
  .step { background:none; border:1px solid var(--rule); border-radius:3px; width:22px; height:20px; line-height:1; cursor:pointer; color:var(--ink-2); margin-right:4px; font-size:14px; vertical-align:1px; padding:0; }
  .step:hover { background:var(--paper-2); color:var(--ink); }
  .step:disabled { opacity:.35; cursor:default; }
  .caption { padding:5px 16px 8px; font-size:12.5px; color:var(--ink-2); line-height:1.55; border-top:1px solid var(--rule-soft); }
  .caption b { font-family:var(--f-display); font-size:14px; color:var(--ink); letter-spacing:.08em; margin-right:8px; }
  .caption .y { margin-left:6px; }
  .caption .y { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); margin-right:8px; }

  /* stage */
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 348px; min-height:0; }
  .stage[data-view="table"], .stage[data-view="chron"] { grid-template-columns:minmax(0,1fr); }
  .stage[data-view="table"] .mapwrap, .stage[data-view="table"] .index,
  .stage[data-view="chron"] .mapwrap, .stage[data-view="chron"] .index { display:none; }
  .stage:not([data-view="table"]) .tablewrap { display:none; }
  .stage:not([data-view="chron"]) .chronwrap { display:none; }

  .mapwrap { position:relative; min-width:0; background:var(--sea); overflow:hidden; }
  #map { display:block; width:100%; height:100%; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #map.dragging { cursor:grabbing; }
  .map-text { font-family:var(--f-body); user-select:none; pointer-events:none; }
  .lbl-site { font-family:var(--f-display); font-weight:600; }
  .lbl-state { font-family:var(--f-display); font-weight:700; }
  .lbl-geo { letter-spacing:.2em; }
  .lbl-riv { font-family:var(--f-display); letter-spacing:.12em; font-style:italic; }
  .state-shape { cursor:pointer; }
  .hit { cursor:pointer; }

  .float { position:absolute; background:color-mix(in srgb, var(--paper) 93%, transparent); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .legend { left:14px; bottom:14px; padding:10px 12px 11px; width:232px; max-height:calc(100% - 80px); overflow-y:auto; }
  .legend h2 { margin:0 0 6px; font-size:10px; font-weight:500; letter-spacing:.2em; color:var(--ink-3); display:flex; align-items:center; }
  .legend h2 button { margin-left:auto; background:none; border:0; cursor:pointer; color:var(--ink-3); font-size:11px; padding:0 2px; letter-spacing:.1em; }
  .legend h2 button:hover { color:var(--ink); }
  .legend .body[hidden] { display:none; }
  .legend .states { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 6px; margin-bottom:9px; }
  .legend .states button { display:flex; align-items:center; gap:5px; background:none; border:0; padding:1px 2px; cursor:pointer; font-size:12px; color:var(--ink); text-align:left; border-radius:2px; font-family:var(--f-display); }
  .legend .states button:hover { background:var(--paper-2); }
  .legend .states button[data-gone="1"] { color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-3); }
  .legend .states button[data-gone="1"] .sq { opacity:.25; }
  .sq { width:11px; height:11px; border-radius:2px; flex:none; background:var(--k); opacity:.85; }
  .sq.tr { background:color-mix(in srgb, var(--k) 55%, transparent); outline:1px dashed color-mix(in srgb, var(--k) 70%, var(--ink)); outline-offset:-1px; }
  .legend .states { max-height:172px; overflow-y:auto; scrollbar-width:thin; }
  .legend ul { list-style:none; margin:0; padding:0; display:grid; gap:0; }
  .legend li button { display:flex; align-items:center; gap:8px; width:100%; padding:2px 4px; background:none; border:0; cursor:pointer; text-align:left; border-radius:2px; font-size:12px; color:var(--ink); }
  .legend li button:hover { background:var(--paper-2); }
  .legend li button[aria-pressed="false"] { color:var(--ink-3); }
  .legend li button[aria-pressed="false"] svg { opacity:.3; }
  .legend .n { margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .legend .foot { margin-top:8px; padding-top:7px; border-top:1px solid var(--rule-soft); font-size:10.5px; line-height:1.5; color:var(--ink-3); }

  .zoomers { right:14px; top:14px; padding:4px; display:grid; gap:3px; }
  .zoomers button { width:27px; height:27px; display:grid; place-items:center; cursor:pointer; background:none; border:0; border-radius:2px; color:var(--ink-2); font-size:15px; line-height:1; }
  .zoomers button:hover { background:var(--paper-2); color:var(--ink); }
  .zoomers button.reset { font-size:10px; letter-spacing:.04em; }
  .inset { right:14px; bottom:14px; padding:6px 7px 4px; }
  .inset svg { display:block; }
  .inset .cap { font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-align:center; margin-top:2px; }
  .scalebar { left:14px; top:14px; padding:6px 10px 5px; }
  .scalebar .bar { height:4px; border:1px solid var(--ink-2); border-top:0; }
  .scalebar .txt { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); text-align:center; letter-spacing:.04em; }

  .tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .12s; padding:9px 12px 10px; max-width:290px; z-index:5; }
  .tip[data-on="1"] { opacity:1; }
  .tip .old { font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:.06em; }
  .tip .arrow { color:var(--ink-3); margin:0 6px; }
  .tip .new { font-size:13px; }
  .tip .meta { margin-top:4px; font-size:11.5px; color:var(--ink-2); }
  .tip .meta .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .tip .note { margin-top:6px; font-size:11.5px; line-height:1.6; color:var(--ink-2); border-top:1px solid var(--rule-soft); padding-top:6px; }
  .tag { display:inline-block; font-size:10.5px; padding:0 5px; border-radius:2px; background:var(--paper-2); color:var(--ink-2); margin-right:4px; letter-spacing:.04em; }
  .tag.st { background:color-mix(in srgb, var(--k) 30%, transparent); color:var(--ink); }

  /* index panel */
  .index { border-left:1px solid var(--rule); background:var(--paper); overflow-y:auto; overscroll-behavior:contain; min-height:0; }
  .grp { border-bottom:1px solid var(--rule-soft); }
  .grp > h2 { position:sticky; top:0; z-index:2; margin:0; display:flex; align-items:center; gap:8px; padding:7px 14px; background:var(--paper-2); border-bottom:1px solid var(--rule-soft); font-size:11px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); cursor:pointer; user-select:none; }
  .grp > h2 .bar { width:3px; height:12px; background:var(--k); border-radius:1px; }
  .grp > h2 .sub { margin-left:auto; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-3); font-weight:400; }
  .grp > h2 .chev { font-size:9px; color:var(--ink-3); transition:transform .15s; }
  .grp[data-closed="1"] > h2 .chev { transform:rotate(-90deg); }
  .grp[data-closed="1"] ol { display:none; }
  .grp ol { list-style:none; margin:0; padding:3px 0 5px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; align-items:baseline; width:100%; padding:5px 14px; background:none; border:0; cursor:pointer; text-align:left; border-left:2px solid transparent; }
  .row:hover { background:var(--paper-2); }
  .row[data-sel="1"] { background:var(--paper-2); border-left-color:var(--k); }
  .row .o { font-family:var(--f-display); font-size:15.5px; font-weight:600; letter-spacing:.05em; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .row .o .sq { width:10px; height:10px; }
  .row .m { font-size:12px; color:var(--ink-2); }
  .row .mt { grid-column:1 / -1; font-size:11px; color:var(--ink-2); }
  .row .mt .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); margin-right:6px; }
  .row .n { grid-column:1 / -1; font-size:11.5px; color:var(--ink-3); line-height:1.55; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .row[data-sel="1"] .n { -webkit-line-clamp:unset; display:block; color:var(--ink-2); }
  .row[data-future="1"] .o { color:var(--ink-3); }
  .empty { padding:24px 16px; color:var(--ink-3); font-size:12.5px; }

  /* table + chronology */
  .tablewrap, .chronwrap { overflow:auto; background:var(--paper); min-height:0; padding:0 0 40px; }
  .intro { padding:18px 16px 14px; max-width:70ch; }
  .intro p { margin:0 0 8px; font-size:13px; color:var(--ink-2); line-height:1.7; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; background:var(--paper-2); text-align:left; padding:8px 14px; font-size:10.5px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); border-bottom:1px solid var(--rule); white-space:nowrap; z-index:1; }
  tbody td { padding:7px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
  tbody tr:hover { background:var(--paper-2); }
  tbody tr.click { cursor:pointer; }
  td.o { font-family:var(--f-display); font-size:15px; font-weight:600; letter-spacing:.05em; white-space:nowrap; }
  td.cat { white-space:nowrap; font-size:11.5px; color:var(--ink-2); }
  td.cat .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--k); margin-right:6px; vertical-align:middle; }
  td.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--ink-3); white-space:nowrap; }
  td.note { font-size:12px; color:var(--ink-2); line-height:1.6; min-width:22ch; max-width:72ch; }
  .chron { max-width:900px; padding:0 16px; }
  .ev { display:grid; grid-template-columns:96px 16px minmax(0,1fr); gap:0 10px; cursor:pointer; }
  .ev:hover .evb { background:var(--paper-2); }
  .ev .yr { font-family:var(--f-mono); font-size:12px; color:var(--ink-2); text-align:right; padding-top:9px; line-height:1.35; }
  .ev .ln { position:relative; }
  .ev .ln::before { content:""; position:absolute; left:7px; top:0; bottom:0; width:1px; background:var(--rule); }
  .ev .ln i { position:absolute; left:3px; top:13px; width:9px; height:9px; border-radius:50%; background:var(--k); border:2px solid var(--paper); }
  .ev .evb { padding:7px 10px 8px; border-radius:3px; }
  .ev .evb b { font-family:var(--f-display); font-size:15px; letter-spacing:.05em; margin-right:8px; }
  .ev .evb .k { font-size:10.5px; color:var(--ink-3); letter-spacing:.12em; }
  .ev .evb p { margin:2px 0 0; font-size:12px; color:var(--ink-2); line-height:1.6; }
  .ev.snap .evb { background:color-mix(in srgb, var(--ink) 6%, transparent); }
  .ev.snap .evb b { font-size:16px; }

  @media (max-width: 900px) {
    .stage { grid-template-columns:minmax(0,1fr); grid-template-rows:58vh minmax(0,1fr); }
    .stage[data-view="table"], .stage[data-view="chron"] { grid-template-rows:minmax(0,1fr); }
    .index { border-left:0; border-top:1px solid var(--rule); }
    .inset, .scalebar { display:none; }
    .brand h1 { font-size:17px; }
    .brand .src { display:none; }
    .masthead { padding:10px 12px; gap:8px; }
    .tools { margin-left:0; }
    .repo { margin-left:0; padding-left:0; border-left:0; }
    .search input { width:130px; }
    .legend { width:200px; left:10px; bottom:10px; }
    .stage[data-view="map"] .langsw { right:14px; }
    .tools { max-width:100%; }
    .seg { max-width:100%; min-width:0; overflow-x:auto; scrollbar-width:none; }
    .seg button { flex:none; }
    html:lang(en) .masthead .search input { width:170px; }

  const U = {
    zh: {
      title: "战国列国形势图", sub: "前475 — 前212 · 古今地名对照",
      views: "视野", fit_all: "全域", fit_zy: "中原", fit_gz: "关中三晋", fit_qy: "齐燕", fit_cy: "楚吴越", fit_bs: "巴蜀",

      playaxis: "播放时间轴", play: "播放", pause: "暂停", years: "年代", speed: "倍速（1× / 2×）",
      prev: "上一个节点", next: "下一个节点", prev_k: "上一个节点（←）", next_k: "下一个节点（→）",
      zin: "放大", zout: "缩小", reset: "复位", legend: "图例", hide: "收起", show: "展开", inset: "索引图", inset_cap: "索引",
      foot: "疆域据文献与谭其骧《中国历史地图集》战国图大意推定，边界为示意；战役只显示本期（上一节点之后至本节点）。秦郡依后晓荣五十四郡说，郡界由郡治就近推算，仅示意。点击国名、地名、河流、山脉均可查看说明。",

      thisPeriod: "本期战役", outside: "诸夏以外", alive: c => `存 · 都${c}`, gone: "已亡",

      search: "Search ancient or modern names", modes: "Display", m_map: "Map", m_chron: "Chronology", m_table: "Gazetteer", src: "Source", src_t: "View source on GitHub (opens in a new tab)",
      playaxis: "Play the timeline", play: "Play", pause: "Pause", years: "Years", speed: "Playback speed (1× / 2×)",
      prev: "Previous node", next: "Next node", prev_k: "Previous node (←)", next_k: "Next node (→)",
      zin: "Zoom in", zout: "Zoom out", reset: "Reset", legend: "Legend", hide: "Hide", show: "Show", inset: "Locator map", inset_cap: "Locator",
      foot: "Territories are reconstructed from the sources and the general outline of the Warring States maps in Tan Qixiang's Historical Atlas of China; boundaries are schematic. Battles are shown for the current period only (after the previous node, up to this one). Qin commanderies follow Hou Xiaorong's 54-commandery reconstruction; their boundaries are inferred from the seats and are schematic. Click any state, place, river or mountain range for notes.",
      count: (y, n, m) => `${y} · ${n} states · ${m} places in view`, tribe: "tribal people", notYet: "not yet founded",
      thisPeriod: "Battles this period", outside: "outside the Zhou states", alive: c => `extant · capital ${c}`, gone: "fallen",
      capOf: k => `${k} capital`, capNow: " · capital at this time", cmd: "Commanders", notBuilt: " (not yet built)", abandoned: y => ` (abandoned c. ${y})`,
      junSet: y => `est. ${y}`, junCore: "capital region", junSeat: z => ` · seat ${z}`, junNot: y => ` (not yet established in ${y}, or outside Qin)`, seatShort: z => "seat: " + z,
      heldBy: y => `${y}: held by`, wallGone: " (abandoned)",
      legClick: n => `${n}: click for details`, legGone: (n, y) => `${n}: fallen by ${y}`,
      bSub: (a, b) => `${a} this period · ${b} total`, empty: "No matching entries.",
      tIntro: "Every entry on the map, one name per row. Coordinates are those of today's site or town and can be found in any map app; linear features (mountains, rivers, walls) give their label point. Click a row to return to the map. Years are BC and given to the year only.",
      tHead: ["Ancient name", "Modern location / name", "Category", "Date", "Coordinates", "Note"],
      cIntro: "Battles, reforms, capital moves, building works and the fall of each state, in order of time. Grey rows are the nodes of the map's time axis; click any event to jump to the nearest node after it and locate it on the map. All years are BC and given to the year only.",
      cMove: "capital move", cFall: "fall of a state", cNode: "map node", capEv: (k, n) => `${k} capital: ${n}`, fallEv: n => `Fall of ${n}`,
    }
  };
  const t = k => U[LANG][k];
  // 条目取字：英文模式取 e 字段，缺译时退回中文
  const pick = (it, f) => (EN() && it["e" + f]) || it[f] || "";
  const N = it => pick(it, "old"), M = it => pick(it, "mod"), NT = it => pick(it, "note"), YT = it => pick(it, "yt");
  const ZH = it => EN() && it.eold ? `<span class="zh" lang="zh-CN">${esc(it.old)}</span>` : "";

  /* ---------------- 工具 ---------------- */
  const yr = y => EN() ? (y < 0 ? (-y) + " BC" : "AD " + y) : (y < 0 ? "前" + (-y) : "" + y);
  const sVar = k => `var(--s-${STATES.indexOf(k)})`;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const norm = s => String(s || "").normalize("NFD").replace(/\p{M}/gu, "").toLowerCase();
  const parseTL = s => s.split(";").map(p => { const [t, o] = p.split(":"); return [+t, o || null]; });
  for (const it of ITEMS) if (it.tl) it.tlp = parseTL(it.tl);
  const ownerAt = (it, y) => { let o = null; for (const [t, s] of it.tlp || []) if (y >= t) o = s; return o; };
  const stateItem = Object.fromEntries(ITEMS.filter(i => i.c === "state").map(i => [i.k, i]));
  const SN = k => EN() && stateItem[k]?.eold ? stateItem[k].eold.replace(/ \(.*\)$/, "") : k;   // 国名短称（标签用）
  const junItem = Object.fromEntries(ITEMS.filter(i => i.c === "jun").map(i => [i.k, i]));
  const junLive = (it, Y) => it.y0 <= Y && ["秦", "卫"].includes(ownerAt(it, Y));
  const wallGone = (it, Y) => it.y1 != null && it.y1 <= Y;

  const CATS = [
    { id:"state",   zh:["列国", "七雄与诸小国"],             en:["States", "the seven powers and lesser states"],     k:"var(--ink-2)" },
    { id:"capital", zh:["国都", "含历次迁都"],               en:["Capitals", "including relocations"],                k:"var(--c-capital)" },
    { id:"battle",  zh:["重要战役", ""],                     en:["Battles", ""],                                      k:"var(--c-battle)" },
    { id:"pass",    zh:["关隘津渡", "关 · 陉 · 津"],         en:["Passes and fords", "passes · fords"],               k:"var(--c-pass)" },
    { id:"city",    zh:["名城要邑", ""],                     en:["Major cities", ""],                                 k:"var(--c-city)" },
    { id:"town",    zh:["一般城邑", "放大后显示"],           en:["Towns", "shown when zoomed in"],                    k:"var(--ink-3)" },
    { id:"culture", zh:["事件 · 变法 · 工程", ""],           en:["Events · reforms · works", ""],                     k:"var(--c-culture)" },
    { id:"jun",     zh:["秦郡", "郡名 · 郡治"],              en:["Qin commanderies", "commandery · seat"],            k:"var(--jun)" },
    { id:"wall",    zh:["长城", "诸国所筑"],                 en:["Long walls", "built by the states"],                k:"var(--wall)" },
    { id:"road",    zh:["驰道 · 直道", "秦统一后"],           en:["Imperial highways · Straight Road", "after the Qin unification"], k:"var(--road)" },
    { id:"range",   zh:["山脉", ""],                         en:["Mountains", ""],                                    k:"var(--range)" },
    { id:"river",   zh:["水系 · 湖泽 · 运河", "古名（今名）"], en:["Rivers · lakes · canals", "ancient (modern)"],      k:"var(--water)" },
    { id:"people",  zh:["周边诸族", "戎狄蛮夷"],             en:["Neighbouring peoples", "Rong, Di, Man and Yi"],      k:"var(--ink-3)" },

  {
    const ys = ITEMS.filter(i => i.c === "battle").map(i => i.y);
    if (ys.length) { const a = Math.min(...ys), b = Math.max(...ys); CATS.find(c => c.id === "battle").zh[1] = `前${-a} — 前${-b}`; CATS.find(c => c.id === "battle").en[1] = `${-a}–${-b} BC`; }
  }
  const cName = c => c[LANG][0], cSub = c => c[LANG][1];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));
  const LAYERS = [
    { id:"territory", zh:"疆域", en:"Territories" }, { id:"capital", zh:"国都", en:"Capitals" }, { id:"battle", zh:"战役", en:"Battles" },
    { id:"pass", zh:"关隘津渡", en:"Passes and fords" }, { id:"city", zh:"名城要邑", en:"Major cities" }, { id:"town", zh:"一般城邑", en:"Towns" }, { id:"culture", zh:"事件·变法·工程", en:"Events · reforms · works" },
    { id:"jun", zh:"秦郡", en:"Qin commanderies" }, { id:"wall", zh:"长城", en:"Long walls" }, { id:"road", zh:"驰道·直道", en:"Highways" }, { id:"range", zh:"山脉", en:"Mountains" }, { id:"river", zh:"水系", en:"Rivers and lakes" },
    { id:"people", zh:"周边诸族", en:"Neighbouring peoples" }, { id:"prov", zh:"今省界", en:"Modern provinces" }
  ];
  for (let j = LAYERS.length - 1; j >= 0; j--) if (!["territory", "prov"].includes(LAYERS[j].id) && !ITEMS.some(i => i.c === LAYERS[j].id)) LAYERS.splice(j, 1);
  const layerOn = Object.fromEntries(LAYERS.map(l => [l.id, true]));

  /* ---------------- 投影 ---------------- */
  const RAD = Math.PI / 180;
  const p1 = 25 * RAD, p2 = 47 * RAD, p0 = 33 * RAD, l0 = 112 * RAD;
  const nn = (Math.sin(p1) + Math.sin(p2)) / 2;
  const CC = Math.cos(p1) ** 2 + 2 * nn * Math.sin(p1);
  const rho0 = Math.sqrt(CC - 2 * nn * Math.sin(p0)) / nn;
  const SCL = 1000;
  function proj(lon, lat) {
    const r = Math.sqrt(Math.max(CC - 2 * nn * Math.sin(lat * RAD), 1e-9)) / nn;
    const th = nn * (lon * RAD - l0);
    return [r * Math.sin(th) * SCL, -(rho0 - r * Math.cos(th)) * SCL];
  }
  function decode(flat) {
    const out = []; let x = 0, y = 0;
    for (let i = 0; i < flat.length; i += 2) { x += flat[i]; y += flat[i + 1]; out.push(proj(x / 100, y / 100)); }
    return out;
  }
  const P = (pts, close) => "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join("L") + (close ? "Z" : "");
  const densify = pts => { const o = []; for (let i = 0; i < pts.length - 1; i++) { const [a, b] = pts[i], [c, d] = pts[i + 1]; const n = Math.max(1, Math.ceil(Math.hypot(c - a, d - b) / .15)); for (let j = 0; j < n; j++) o.push([a + (c - a) * j / n, b + (d - b) * j / n]); } o.push(pts[pts.length - 1]); return o; };
  const lineLL = pts => densify(pts).map(p => proj(p[0], p[1]));
  function bboxPath(lo0, lo1, la0, la1) {
    const pts = [], N = 20;
    for (let i = 0; i <= N; i++) pts.push([lo0 + (lo1 - lo0) * i / N, la1]);
    for (let i = 0; i <= N; i++) pts.push([lo1, la1 + (la0 - la1) * i / N]);
    for (let i = 0; i <= N; i++) pts.push([lo1 + (lo0 - lo1) * i / N, la0]);
    for (let i = 0; i <= N; i++) pts.push([lo0, la0 + (la1 - la0) * i / N]);
    return pts.map(p => proj(p[0], p[1]));
  }
  function bboxOf(pts) { let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity; for (const p of pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); } return [x0, y0, x1, y1]; }
  const FITS = {
    all: [101.5, 125.5, 24.8, 43], zy: [110.8, 118.2, 32.6, 37.6], gz: [105.5, 115.5, 33.2, 41.2],
    qy: [113.5, 125, 34.6, 42.6], cy: [108.5, 122.2, 25.5, 34.2], bs: [102.3, 111.2, 27.6, 34.6]

      items.push({ kind: "site", it, x, y, r, size, twoLine, on, act: actCap,

        pri: (on ? -1000 : 0) + base + it.i * 0.001 });

        const txt = L.k === "周" ? SN(L.k) : (SNAPS[si].labe?.[L.k] || N(L.it));
        const fit = lines => { const w1 = Math.max(...lines.map(l => textW(l, 1))); return Math.min(wpx * 0.62 / w1, hpx * 0.8 / (lines.length > 1 ? 2.1 : 1), 34); };

        items.push({ kind: "state", L, x, y, size, text: txt, lines, w: Math.max(...lines.map(l => textW(l, size))), h: size * (lines.length > 1 ? 2.15 : 1), pri: (on ? -900 : 0) - Math.min(size, 40) });

    const lineCats = ["range", "river", "wall", "road"];

  /* ---------------- 比例尺 ---------------- */
  function inv(px, py) {

  }

  /* ---------------- 索引图 ---------------- */

    const g = el("g", { transform: `translate(${IW / 2} ${IH / 2}) scale(${k}) translate(${-insetFit.cx} ${-insetFit.cy})` });
    g.append(el("path", { d: landD, fill: "var(--paper-2)", stroke: "var(--rule)", "stroke-width": .6, "vector-effect": "non-scaling-stroke" }));

  }

  /* ---------------- 交互 ---------------- */

  const ptrs = new Map();

  function markRows() { document.querySelectorAll(".row").forEach(r => r.dataset.sel = (+r.dataset.i === selected) ? "1" : "0"); }

  /* ---------------- 时间轴 ---------------- */
  const axis = document.getElementById("axis"), axiswrap = document.getElementById("axiswrap");
  // 轴的两端：首节点前 3 年至末节点后 5 年；轴宽随节点数放宽，每个节点至少约 26px
  const TY0 = SNAPS[0].y - 3, TY1 = SNAPS[SNAPS.length - 1].y + 5;
  const TSTEP = TY1 - TY0 > 220 ? 20 : 10;
  axis.style.minWidth = Math.max(860, SNAPS.length * 26) + "px";
  // 时间轴刻度：一半按真实年份，一半按节点序号均分，使末年密集的节点也有足够间距
  const SY = SNAPS.map(s => s.y), NS_ = SY.length;
  function idxPos(y) {
    if (y <= SY[0]) return (0.5 / NS_) * (y - TY0) / (SY[0] - TY0);
    if (y >= SY[NS_ - 1]) return 1 - (0.5 / NS_) * (TY1 - y) / (TY1 - SY[NS_ - 1]);
    let k = 0; while (SY[k + 1] < y) k++;
    return (k + 0.5 + (y - SY[k]) / (SY[k + 1] - SY[k])) / NS_;
  }
  const pct = y => ((0.5 * (y - TY0) / (TY1 - TY0) + 0.5 * idxPos(y)) * 100).toFixed(3) + "%";
  const ST = sn => (EN() && sn.te) || sn.t, SD_ = sn => (EN() && sn.de) || sn.d, SS = sn => (EN() && sn.she) || sn.sh;
  function buildAxis() {
    axis.innerHTML = '<div class="ln"></div><div class="fill" id="axfill"></div>';
    const y0 = Math.ceil(SNAPS[0].y / TSTEP) * TSTEP;
    for (let y = y0; y <= TY1 - 4; y += TSTEP) {
      const d = document.createElement("div"); d.className = "dec"; d.style.left = pct(y); d.textContent = EN() && y !== y0 ? String(Math.abs(y)) : yr(y); axis.append(d);
    }
    SNAPS.forEach((s, j) => {
      const b = document.createElement("button");
      b.className = "sd"; b.dataset.j = j; b.style.left = pct(s.y);
      b.title = `${yr(s.y)} ${ST(s)}`;
      b.setAttribute("aria-label", `${yr(s.y)} ${ST(s)}`); b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="d"></span><span class="t">${esc(SS(s))}</span>`;
      b.addEventListener("click", () => { stopPlay(); setSnap(j, true); });
      axis.append(b);
    });
  }
  buildAxis();
  function placeLbl(node, x) {
    const w = node.offsetWidth, W2 = axis.offsetWidth;
    node.style.left = Math.max(0, Math.min(W2 - w, x - w / 2)) + "px";
  }
  function setSnap(j, rebuild = true) {
    si = j;
    const s = SNAPS[j];
    axis.querySelectorAll(".sd").forEach(b => { const k = +b.dataset.j; b.setAttribute("aria-pressed", k === j ? "true" : "false"); b.classList.toggle("past", k < j); });
    document.getElementById("axfill").style.width = pct(s.y);
    const btn = axis.querySelector(`.sd[data-j="${j}"]`);
    requestAnimationFrame(() => {
      if (axiswrap.scrollWidth > axiswrap.clientWidth) axiswrap.scrollTo({ left: btn.offsetLeft - axiswrap.clientWidth / 2, behavior: reduce() ? "auto" : "smooth" });
    });
    const cb = ITEMS.filter(it => it.c === "battle" && inPeriod(it)).sort((a, b) => a.y - b.y);
    document.getElementById("caption").innerHTML = `<span class="y">${yr(s.y)}</span><b>${esc(ST(s))}</b>${esc(SD_(s))}` +
      (cb.length ? `<span class="bchips"><span class="lb">${t("thisPeriod")}</span>${cb.map(b => `<button data-i="${b.i}">${esc(N(b))}</button>`).join("")}</span>` : "");
    document.getElementById("prev").disabled = j === 0;
    document.getElementById("next").disabled = j === SNAPS.length - 1;
    buildLegendStates();
    if (rebuild) { buildStates(); render(); buildIndex(); }
  }
  document.getElementById("caption").addEventListener("click", e => {
    const b = e.target.closest(".bchips button"); if (!b) return;
    if (stage.dataset.view !== "map") setMode("map");
    select(+b.dataset.i, false);
  });
  document.getElementById("prev").addEventListener("click", () => { stopPlay(); if (si > 0) setSnap(si - 1); });
  document.getElementById("next").addEventListener("click", () => { stopPlay(); if (si < SNAPS.length - 1) setSnap(si + 1); });
  let playT = null, speed = 1;
  const playBtn = document.getElementById("play"), speedBtn = document.getElementById("speed");
  const PLAY_MS = DATA.playms || 1700;
  function stopPlay() { if (playT) { clearTimeout(playT); playT = null; document.getElementById("playicon").innerHTML = '<path d="M3 2 12 7 3 12Z" fill="currentColor"/>'; playBtn.title = t("play"); } }
  playBtn.addEventListener("click", () => {
    if (playT) { stopPlay(); return; }
    if (si === SNAPS.length - 1) setSnap(0);
    document.getElementById("playicon").innerHTML = '<rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/>';
    playBtn.title = t("pause");
    const tick = () => { if (si >= SNAPS.length - 1) { stopPlay(); return; } setSnap(si + 1); playT = setTimeout(tick, PLAY_MS / speed); };
    playT = setTimeout(tick, PLAY_MS / speed);
  });
  speedBtn.addEventListener("click", () => {
    speed = speed === 1 ? 2 : 1;
    speedBtn.textContent = speed + "×"; speedBtn.setAttribute("aria-pressed", speed === 2 ? "true" : "false");
  });

  /* ---------------- 图例 ---------------- */
  const legStates = document.getElementById("legstates");
  function buildLegendStates() {
    legStates.replaceChildren();
    // 只列本期尚存者与本期新亡者（划掉），部族排在最后
    const fellNow = new Set(FALLS.filter(f => f.y > prevY() && f.y <= snapY()).map(f => f.k));
    const keys = STATES.filter(k => SNAPS[si].s[k] || (fellNow.has(k) && si > 0 && SNAPS[si - 1].s[k]));
    keys.sort((a, b) => isTribe(a) - isTribe(b));
    for (const k of keys) {
      const b = document.createElement("button");
      const alive = !!SNAPS[si].s[k];
      b.dataset.gone = alive ? "0" : "1";
      const nm = EN() ? (SNAPS[si].labe?.[k] || SN(k)) : (SNAPS[si].lab?.[k] || stateItem[k].old.replace("（王畿）", ""));
      b.innerHTML = `<span class="sq${isTribe(k) ? " tr" : ""}" style="--k:${sVar(k)}"></span>${esc(nm)}`;
      b.title = alive ? t("legClick")(N(stateItem[k])) : t("legGone")(N(stateItem[k]), yr(snapY()));
      b.addEventListener("click", () => select(stateItem[k].i, false));
      b.addEventListener("mouseenter", () => { hovered = stateItem[k].i; buildStates(); render(); });
      b.addEventListener("mouseleave", () => { hovered = null; buildStates(); render(); });
      legStates.append(b);
    }
  }
  const SYM = {
    territory: '<rect x="1" y="2" width="12" height="10" rx="1.5" fill="var(--s-0)" opacity=".6"/>',
    capital: '<rect x="2" y="2" width="10" height="10" fill="var(--paper)" stroke="var(--c-capital)" stroke-width="1.4"/><rect x="4.6" y="4.6" width="4.8" height="4.8" fill="var(--c-capital)"/>',
    battle: '<circle cx="7" cy="7" r="5.6" fill="var(--paper)" stroke="var(--c-battle)" stroke-width="1.2"/><path d="M4.6 4.6 9.4 9.4M9.4 4.6 4.6 9.4" stroke="var(--c-battle)" stroke-width="1.7" stroke-linecap="round"/>',
    pass: '<rect x="3.5" y="3.5" width="7" height="7" transform="rotate(45 7 7)" fill="var(--c-pass)"/>',
    city: '<circle cx="7" cy="7" r="3.6" fill="var(--paper)" stroke="var(--c-city)" stroke-width="1.6"/>',
    town: '<circle cx="7" cy="7" r="2.4" fill="var(--ink-3)"/>',
    culture: '<path d="M7 1.8 12 10.6H2Z" fill="var(--c-culture)"/>',
    jun: '<circle cx="7" cy="7" r="5.2" fill="none" stroke="var(--jun)" stroke-width="1.3"/><circle cx="7" cy="7" r="1.8" fill="var(--jun)"/>',
    road: '<path d="M1 9 C5 5, 9 9, 13 5" stroke="var(--road)" stroke-width="1.7" stroke-dasharray="4 2" fill="none"/>',
    wall: '<path d="M1 7H13" stroke="var(--wall)" stroke-width="1.4"/><path d="M1 7H13" stroke="var(--wall)" stroke-width="5" stroke-dasharray="1.6 2.4"/>',
    range: '<path d="M1 9 C4 5, 9 5, 13 8" stroke="var(--range)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/>',
    river: '<path d="M1 9 C4 4, 8 11, 13 5" stroke="var(--water)" stroke-width="1.8" fill="none"/>',
    people: '<text x="7" y="11" text-anchor="middle" font-size="10" font-style="italic" fill="var(--ink-3)">夷</text>',
    prov: '<path d="M1 7H13" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 2"/>'
  };
  const legend = document.getElementById("legend");
  function buildLegendLayers() {
    legend.replaceChildren();
    for (const L of LAYERS) {
      const n = L.id === "territory" || L.id === "prov" ? "" : ITEMS.filter(i => i.c === L.id).length;
      const li = document.createElement("li");
      li.innerHTML = `<button aria-pressed="${layerOn[L.id]}" data-l="${L.id}"><svg width="14" height="14" viewBox="0 0 14 14">${SYM[L.id]}</svg><span>${L[LANG]}</span><span class="n">${n}</span></button>`;
      legend.append(li);
    }
  }
  buildLegendLayers();
  legend.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.l; layerOn[id] = !layerOn[id];
    b.setAttribute("aria-pressed", layerOn[id] ? "true" : "false");
    if (id === "territory") buildStates();
    render(); buildIndex();
  });
  const legBody = document.getElementById("legbody"), legT = document.getElementById("legtoggle");
  function setLeg(open) { legBody.hidden = !open; legT.textContent = open ? t("hide") : t("show"); legT.setAttribute("aria-expanded", open); }
  legT.addEventListener("click", () => setLeg(legBody.hidden));
  if (matchMedia("(max-width: 900px)").matches) setLeg(false);

  /* ---------------- 索引 ---------------- */
  const index = document.getElementById("index");
  const closedGroups = new Set(["people", "town"]);
  function buildIndex() {
    index.replaceChildren();
    const Y = snapY();
    let total = 0;
    for (const c of CATS) {
      let list = ITEMS.filter(i => i.c === c.id && matches(i));
      if (!list.length) continue;
      if (c.id === "culture" || c.id === "wall" || c.id === "road") list.sort((a, b) => a.y - b.y);
      if (c.id === "jun") list.sort((a, b) => a.y0 - b.y0);
      if (c.id === "battle") list.sort((a, b) => (inPeriod(b) - inPeriod(a)) || a.y - b.y);
      const sub = c.id === "battle" ? t("bSub")(list.filter(inPeriod).length, list.length) : `${list.length}` + (cSub(c) ? ` · ${cSub(c)}` : "");
      if (c.id === "capital") list.sort((a, b) => STATES.indexOf(a.st) - STATES.indexOf(b.st) || a.y0 - b.y0);
      total += list.length;
      const sec = document.createElement("section");
      sec.className = "grp"; sec.style.setProperty("--k", c.k);
      sec.dataset.closed = closedGroups.has(c.id) && !query ? "1" : "0";
      sec.innerHTML = `<h2><span class="chev">▼</span><span class="bar"></span>${cName(c)}<span class="sub">${sub}</span></h2>`;
      sec.querySelector("h2").addEventListener("click", () => {
        const cl = sec.dataset.closed === "1"; sec.dataset.closed = cl ? "0" : "1";
        if (cl) closedGroups.delete(c.id); else closedGroups.add(c.id);
      });
      const ol = document.createElement("ol");
      for (const it of list) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = "row"; b.dataset.i = it.i; b.dataset.sel = selected === it.i ? "1" : "0";
        const kcol = it.c === "state" ? sVar(it.k) : it.c === "capital" ? sVar(it.st) : c.k;
        b.style.setProperty("--k", kcol);
        if ((it.c === "culture" || it.c === "wall" || it.c === "road" || it.sub === "canal") && it.y > Y) b.dataset.future = "1";
        if (it.c === "jun" && !junLive(it, Y)) b.dataset.future = "1";
        if (it.c === "battle" && !inPeriod(it)) b.dataset.future = "1";
        if (it.c === "state" && !SNAPS[si].s[it.k]) b.dataset.future = "1";
        const sw = it.c === "state" ? `<span class="sq" style="--k:${sVar(it.k)}"></span>` : "";
        const meta = metaHTML(it, Y, false);
        const note = it.c === "state" ? esc(NT(it)).replace(/\n/g, "<br>") : esc(NT(it));
        b.innerHTML = `<span class="o">${sw}${esc(N(it))}${ZH(it)}</span><span class="m">${esc(M(it))}</span>` +
          (meta ? `<span class="mt">${meta}</span>` : "") + (note ? `<span class="n">${note}</span>` : "");
        b.addEventListener("click", () => { if (stage.dataset.view !== "map") setMode("map"); select(it.i, false); });
        b.addEventListener("mouseenter", () => { hovered = it.i; if (it.c === "state") buildStates(); render(); });
        b.addEventListener("mouseleave", () => { hovered = null; if (it.c === "state") buildStates(); render(); });
        li.append(b); ol.append(li);
      }
      sec.append(ol); index.append(sec);
    }
    if (!total) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t("empty"); index.append(d); }
  }

  /* ---------------- 对照表 ---------------- */
  function buildTable() {
    const wrap = document.getElementById("tablewrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>${t("tIntro")}</p>`;
    wrap.append(intro);
    const tbl = document.createElement("table");
    tbl.innerHTML = `<thead><tr>${t("tHead").map(h => `<th>${h}</th>`).join("")}</tr></thead>`;
    const tb = document.createElement("tbody");
    for (const c of CATS) {
      if (c.id === "state") continue;
      for (const it of ITEMS.filter(x => x.c === c.id && matches(x))) {
        const tr = document.createElement("tr"); tr.className = "click";
        const ll = it.lon != null ? [it.lon, it.lat] : it.anc;
        const when = it.c === "capital" ? `${yr(it.y0)}–${yr(it.y1)}` : it.c === "jun" ? (it.y0 > -9000 ? t("junSet")(yr(it.y0)) : "—") : YT(it);
        tr.innerHTML = `<td class="o">${esc(N(it))}${ZH(it)}</td><td>${esc(M(it))}</td>` +
          `<td class="cat" style="--k:${it.c === "capital" ? sVar(it.st) : c.k}"><span class="dot"></span>${cName(c)}${it.c === "capital" ? " · " + esc(SN(it.st)) : ""}</td>` +
          `<td class="num">${esc(when)}</td><td class="num">${ll ? ll[0].toFixed(2) + "°E&nbsp; " + ll[1].toFixed(2) + "°N" : ""}</td><td class="note">${esc(NT(it) || "—")}</td>`;
        tr.addEventListener("click", () => { setMode("map"); requestAnimationFrame(() => select(it.i, false)); });
        tb.append(tr);
      }
    }
    tbl.append(tb); wrap.append(tbl);
  }

  /* ---------------- 年表 ---------------- */
  function buildChron() {
    const wrap = document.getElementById("chronwrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>${t("cIntro")}</p>`;
    wrap.append(intro);
    const ev = [];
    for (const it of ITEMS) {
      if ((it.c === "battle" || it.c === "culture" || it.c === "wall" || it.c === "road") && it.y > DATA.p0 && matches(it)) ev.push({ y: it.y, yt: YT(it), t: N(it), zh: ZH(it), k: cName(CAT[it.c]), p: it.c === "battle" ? (EN() ? `${pick(it, "sides")}. ${NT(it)}` : `${it.sides}。${it.note}`) : NT(it), col: CAT[it.c].k, i: it.i });
      if (it.c === "capital" && it.y0 > DATA.p0 && matches(it)) ev.push({ y: it.y0, yt: yr(it.y0), t: t("capEv")(SN(it.st), N(it)), zh: EN() ? `<span class="zh" lang="zh-CN">${esc(it.st + "都" + it.old)}</span>` : "", k: t("cMove"), p: NT(it), col: sVar(it.st), i: it.i });
    }
    for (const f of FALLS) if (!query || norm(f.nm).includes(norm(query)) || norm(f.nme).includes(norm(query))) ev.push({ y: f.y, yt: yr(f.y), t: t("fallEv")((EN() && f.nme) || f.nm), zh: EN() ? `<span class="zh" lang="zh-CN">${esc(f.nm + "亡")}</span>` : "", k: t("cFall"), p: (EN() && f.pe) || f.p, col: sVar(f.k), i: stateItem[f.k].i, fall: true });
    for (const s of SNAPS) if (!query) ev.push({ y: s.y, yt: yr(s.y), t: ST(s), zh: EN() && s.te ? `<span class="zh" lang="zh-CN">${esc(s.t)}</span>` : "", k: t("cNode"), p: SD_(s), col: "var(--ink)", snap: true });
    ev.sort((a, b) => a.y - b.y || (a.snap ? 1 : 0) - (b.snap ? 1 : 0));
    const box = document.createElement("div"); box.className = "chron";
    for (const e of ev) {
      const d = document.createElement("div");
      d.className = "ev" + (e.snap ? " snap" : ""); d.style.setProperty("--k", e.col);
      d.innerHTML = `<div class="yr">${esc(e.yt)}</div><div class="ln"><i></i></div><div class="evb"><b>${esc(e.t)}</b>${e.zh ? e.zh + " " : ""}<span class="k">${esc(e.k)}</span><p>${esc(e.p)}</p></div>`;
      d.addEventListener("click", () => {
        let j = SNAPS.findIndex(s => s.y >= e.y); if (j < 0) j = SNAPS.length - 1;
        setMode("map"); setSnap(j);
        if (e.i != null) requestAnimationFrame(() => select(e.i, false));
      });
      box.append(d);
    }
    wrap.append(box);
  }

  /* ---------------- 控件 ---------------- */
  document.getElementById("views").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    activeFit = b.dataset.fit;
    document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    fitTo(activeFit, true);
  });
  document.getElementById("zin").addEventListener("click", () => setView(view.cx, view.cy, view.k * 1.6, true));
  document.getElementById("zout").addEventListener("click", () => setView(view.cx, view.cy, view.k / 1.6, true));
  document.getElementById("zreset").addEventListener("click", () => { selected = null; buildStates(); fitTo(activeFit, true); markRows(); });
  document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); buildIndex(); buildTable(); buildChron(); });
  function setMode(m) {
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === m ? "true" : "false"));
    stage.dataset.view = m;
    document.querySelectorAll(".maponly").forEach(x => x.hidden = (m !== "map"));
    document.getElementById("timebar").hidden = m !== "map";
    if (m === "map") requestAnimationFrame(() => { const keep = { ...view }; resize(); if (keep.k !== 1) { Object.assign(view, keep); render(); } });
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" && si < SNAPS.length - 1) { stopPlay(); setSnap(si + 1); }
    if (e.key === "ArrowLeft" && si > 0) { stopPlay(); setSnap(si - 1); }
    if (e.key === "Escape") { selected = null; buildStates(); render(); markRows(); tip.dataset.on = "0"; }
  });

  /* ---------------- 语言切换 ---------------- */
  function applyStatic() {
    document.documentElement.lang = EN() ? "en" : "zh-CN";
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
    document.querySelectorAll("[data-ta]").forEach(n => n.setAttribute("aria-label", t(n.dataset.ta)));
    document.querySelectorAll("[data-tt]").forEach(n => n.title = t(n.dataset.tt));
    document.querySelectorAll("[data-tp]").forEach(n => { n.placeholder = t(n.dataset.tp); n.setAttribute("aria-label", t(n.dataset.tp)); });
    document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
    playBtn.title = playT ? t("pause") : t("play");
    setLeg(!legBody.hidden);
    readFonts();
  }
  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("zhanguo-lang", l); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + (l === "en" ? "#en" : "")); } catch (e) {}
    applyStatic();
    buildAxis(); setSnap(si, false);
    buildLegendLayers();
    buildStates(); render(); buildIndex(); buildTable(); buildChron();
  }
  document.getElementById("langsw").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.lang); });

  /* ---------------- 启动 ---------------- */
  applyStatic();
  setSnap(Math.max(0, SNAPS.findIndex(s => s.y === GEO.first)), false);
  buildStates();
  buildIndex(); buildTable(); buildChron();
  resize();
})();
</script>
</body>
</html>
