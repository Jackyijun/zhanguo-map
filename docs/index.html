<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战国列国形势图</title>
<style>
  :root {
    --ground:#E3E2D9; --ground-deep:#D6D5C9; --paper:#F2F1EA; --paper-2:#EAE9E0;
    --ink:#1D1E23; --ink-2:#55575E; --ink-3:#83858C; --rule:#C7C5B8; --rule-soft:#D8D6CA;
    --accent:#2B5F87;
    --sea:#D5DCDB; --land:#ECEBE3; --coast:#A9AFAE; --border:#ADAA9A;
    --water:#7F9FB2; --water-fill:#B4C8D2; --range:#9C8F78; --wall:#4A4038; --road:#8C5A3A; --jun:#3B2722;
    --c-battle:#A3473A; --c-pass:#3B3B40; --c-city:#55575E; --c-culture:#2F7470; --c-capital:#1D1E23;
    --s-op:.52; --s-op-hi:.64;
    --s-0:#9A6A5C;--s-1:#7E9A6A;--s-2:#6B8DAA;--s-3:#978BB3;--s-4:#C09E62;--s-5:#B7868C;--s-6:#6FA39B;--s-7:#C7B271;--s-8:#9DAA6E;--s-9:#B09AC0;--s-10:#C9926F;--s-11:#83AB93;--s-12:#8FB0C4;--s-13:#B9A374;--s-14:#8AA2B8;--s-15:#A59A86;
    --shadow: 0 1px 2px rgba(29,30,35,.07), 0 8px 24px -12px rgba(29,30,35,.22);
    --f-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
      --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
      --accent:#78ADD8;
      --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
      --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
      --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
      --s-op:.34; --s-op-hi:.46;
      --s-0:#B98676;--s-1:#8FAE7B;--s-2:#7FA2C0;--s-3:#A99DC6;--s-4:#CDAE74;--s-5:#C9979D;--s-6:#82B7AE;--s-7:#D4C083;--s-8:#AEBB7F;--s-9:#C0ABD0;--s-10:#D6A382;--s-11:#95BDA5;--s-12:#A0C0D3;--s-13:#C8B386;--s-14:#9BB3C9;--s-15:#B5AA97;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
    --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
    --accent:#78ADD8;
    --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
    --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
    --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
    --s-op:.34; --s-op-hi:.46;
    --s-0:#B98676;--s-1:#8FAE7B;--s-2:#7FA2C0;--s-3:#A99DC6;--s-4:#CDAE74;--s-5:#C9979D;--s-6:#82B7AE;--s-7:#D4C083;--s-8:#AEBB7F;--s-9:#C0ABD0;--s-10:#D6A382;--s-11:#95BDA5;--s-12:#A0C0D3;--s-13:#C8B386;--s-14:#9BB3C9;--s-15:#B5AA97;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--ground-deep); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0,1fr); }

  /* masthead */
  .masthead { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding:12px 20px 11px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.14em; }
  .brand .src { font-size:11px; letter-spacing:.18em; color:var(--ink-3); border-left:1px solid var(--rule); padding-left:12px; }
  .masthead .count { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:.06em; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .seg { display:flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; }
  .seg button { background:transparent; border:0; padding:5px 10px; cursor:pointer; font-size:12px; letter-spacing:.06em; color:var(--ink-2); border-right:1px solid var(--rule-soft); white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--paper-2); color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .maponly[hidden] { display:none; }
  .search { position:relative; }
  .search input { width:170px; padding:5px 10px 5px 26px; border:1px solid var(--rule); border-radius:3px; background:var(--ground); font-size:12.5px; }
  .search input::placeholder { color:var(--ink-3); }
  .search svg { position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.5; }

  /* timeline strip */
  .timebar { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:stretch; background:var(--paper); border-bottom:1px solid var(--rule); }
  .timebar[hidden] { display:none; }
  .play { width:44px; border:0; border-right:1px solid var(--rule-soft); background:none; cursor:pointer; color:var(--ink-2); display:grid; place-items:center; }
  .play:hover { background:var(--paper-2); color:var(--ink); }
  .tb-main { min-width:0; display:grid; grid-template-rows:auto auto; }
  .axiswrap { overflow-x:auto; scrollbar-width:thin; padding:0 22px; }
  .axis { position:relative; height:96px; min-width:860px; }
  .axis .ln { position:absolute; left:0; right:0; top:25px; height:2px; background:var(--rule); border-radius:1px; }
  .axis .fill { position:absolute; left:0; top:25px; height:2px; background:var(--ink-2); border-radius:1px; }
  .axis .dec { position:absolute; top:3px; transform:translateX(-50%); font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); letter-spacing:.02em; pointer-events:none; }
  .axis .dec::after { content:""; position:absolute; left:50%; top:16px; width:1px; height:5px; background:var(--ink-3); }
  .axis .sd { position:absolute; top:20px; width:18px; margin-left:-9px; height:74px; border:0; padding:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; color:var(--ink-2); }
  .axis .sd .d { width:9px; height:9px; margin-top:2px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-3); box-sizing:border-box; flex:none; transition:transform .12s; }
  .axis .sd .t { margin-top:5px; writing-mode:vertical-rl; text-orientation:upright; font-family:var(--f-display); font-size:11.5px; line-height:1; letter-spacing:1px; white-space:nowrap; }
  .axis .sd:hover { color:var(--ink); }
  .axis .sd:hover .d { border-color:var(--ink); transform:scale(1.25); }
  .axis .sd.past .d { background:var(--ink-3); }
  .axis .sd[aria-pressed="true"] { color:var(--ink); }
  .axis .sd[aria-pressed="true"] .d { background:var(--ink); border-color:var(--ink); transform:scale(1.5); }
  .axis .sd[aria-pressed="true"] .t { font-weight:700; }
  .bchips { display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:8px; vertical-align:1px; }
  .bchips .lb { font-size:11px; color:var(--c-battle); letter-spacing:.08em; align-self:center; margin-right:2px; }
  .bchips button { font-family:var(--f-display); font-size:12px; padding:0 7px; line-height:19px; border:1px solid color-mix(in srgb, var(--c-battle) 45%, transparent); background:color-mix(in srgb, var(--c-battle) 8%, transparent); color:var(--ink); border-radius:3px; cursor:pointer; }
  .bchips button:hover { background:color-mix(in srgb, var(--c-battle) 18%, transparent); }
  .step { background:none; border:1px solid var(--rule); border-radius:3px; width:22px; height:20px; line-height:1; cursor:pointer; color:var(--ink-2); margin-right:4px; font-size:14px; vertical-align:1px; padding:0; }
  .step:hover { background:var(--paper-2); color:var(--ink); }
  .step:disabled { opacity:.35; cursor:default; }
  .caption { padding:5px 16px 8px; font-size:12.5px; color:var(--ink-2); line-height:1.55; border-top:1px solid var(--rule-soft); }
  .caption b { font-family:var(--f-display); font-size:14px; color:var(--ink); letter-spacing:.08em; margin-right:8px; }
  .caption .y { margin-left:6px; }
  .caption .y { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); margin-right:8px; }

  /* stage */
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 348px; min-height:0; }
  .stage[data-view="table"], .stage[data-view="chron"] { grid-template-columns:minmax(0,1fr); }
  .stage[data-view="table"] .mapwrap, .stage[data-view="table"] .index,
  .stage[data-view="chron"] .mapwrap, .stage[data-view="chron"] .index { display:none; }
  .stage:not([data-view="table"]) .tablewrap { display:none; }
  .stage:not([data-view="chron"]) .chronwrap { display:none; }

  .mapwrap { position:relative; min-width:0; background:var(--sea); overflow:hidden; }
  #map { display:block; width:100%; height:100%; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #map.dragging { cursor:grabbing; }
  .map-text { font-family:var(--f-body); user-select:none; pointer-events:none; }
  .lbl-site { font-family:var(--f-display); font-weight:600; }
  .lbl-state { font-family:var(--f-display); font-weight:700; }
  .lbl-geo { letter-spacing:.2em; }
  .lbl-riv { font-family:var(--f-display); letter-spacing:.12em; font-style:italic; }
  .state-shape { cursor:pointer; }
  .hit { cursor:pointer; }

  .float { position:absolute; background:color-mix(in srgb, var(--paper) 93%, transparent); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .legend { left:14px; bottom:14px; padding:10px 12px 11px; width:232px; max-height:calc(100% - 80px); overflow-y:auto; }
  .legend h2 { margin:0 0 6px; font-size:10px; font-weight:500; letter-spacing:.2em; color:var(--ink-3); display:flex; align-items:center; }
  .legend h2 button { margin-left:auto; background:none; border:0; cursor:pointer; color:var(--ink-3); font-size:11px; padding:0 2px; letter-spacing:.1em; }
  .legend h2 button:hover { color:var(--ink); }
  .legend .body[hidden] { display:none; }
  .legend .states { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 6px; margin-bottom:9px; }
  .legend .states button { display:flex; align-items:center; gap:5px; background:none; border:0; padding:1px 2px; cursor:pointer; font-size:12px; color:var(--ink); text-align:left; border-radius:2px; font-family:var(--f-display); }
  .legend .states button:hover { background:var(--paper-2); }
  .legend .states button[data-gone="1"] { color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-3); }
  .legend .states button[data-gone="1"] .sq { opacity:.25; }
  .sq { width:11px; height:11px; border-radius:2px; flex:none; background:var(--k); opacity:.85; }
  .legend ul { list-style:none; margin:0; padding:0; display:grid; gap:0; }
  .legend li button { display:flex; align-items:center; gap:8px; width:100%; padding:2px 4px; background:none; border:0; cursor:pointer; text-align:left; border-radius:2px; font-size:12px; color:var(--ink); }
  .legend li button:hover { background:var(--paper-2); }
  .legend li button[aria-pressed="false"] { color:var(--ink-3); }
  .legend li button[aria-pressed="false"] svg { opacity:.3; }
  .legend .n { margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .legend .foot { margin-top:8px; padding-top:7px; border-top:1px solid var(--rule-soft); font-size:10.5px; line-height:1.5; color:var(--ink-3); }

  .zoomers { right:14px; top:14px; padding:4px; display:grid; gap:3px; }
  .zoomers button { width:27px; height:27px; display:grid; place-items:center; cursor:pointer; background:none; border:0; border-radius:2px; color:var(--ink-2); font-size:15px; line-height:1; }
  .zoomers button:hover { background:var(--paper-2); color:var(--ink); }
  .zoomers button.reset { font-size:10px; letter-spacing:.04em; }
  .inset { right:14px; bottom:14px; padding:6px 7px 4px; }
  .inset svg { display:block; }
  .inset .cap { font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-align:center; margin-top:2px; }
  .scalebar { left:14px; top:14px; padding:6px 10px 5px; }
  .scalebar .bar { height:4px; border:1px solid var(--ink-2); border-top:0; }
  .scalebar .txt { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); text-align:center; letter-spacing:.04em; }

  .tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .12s; padding:9px 12px 10px; max-width:290px; z-index:5; }
  .tip[data-on="1"] { opacity:1; }
  .tip .old { font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:.06em; }
  .tip .arrow { color:var(--ink-3); margin:0 6px; }
  .tip .new { font-size:13px; }
  .tip .meta { margin-top:4px; font-size:11.5px; color:var(--ink-2); }
  .tip .meta .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .tip .note { margin-top:6px; font-size:11.5px; line-height:1.6; color:var(--ink-2); border-top:1px solid var(--rule-soft); padding-top:6px; }
  .tag { display:inline-block; font-size:10.5px; padding:0 5px; border-radius:2px; background:var(--paper-2); color:var(--ink-2); margin-right:4px; letter-spacing:.04em; }
  .tag.st { background:color-mix(in srgb, var(--k) 30%, transparent); color:var(--ink); }

  /* index panel */
  .index { border-left:1px solid var(--rule); background:var(--paper); overflow-y:auto; overscroll-behavior:contain; min-height:0; }
  .grp { border-bottom:1px solid var(--rule-soft); }
  .grp > h2 { position:sticky; top:0; z-index:2; margin:0; display:flex; align-items:center; gap:8px; padding:7px 14px; background:var(--paper-2); border-bottom:1px solid var(--rule-soft); font-size:11px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); cursor:pointer; user-select:none; }
  .grp > h2 .bar { width:3px; height:12px; background:var(--k); border-radius:1px; }
  .grp > h2 .sub { margin-left:auto; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-3); font-weight:400; }
  .grp > h2 .chev { font-size:9px; color:var(--ink-3); transition:transform .15s; }
  .grp[data-closed="1"] > h2 .chev { transform:rotate(-90deg); }
  .grp[data-closed="1"] ol { display:none; }
  .grp ol { list-style:none; margin:0; padding:3px 0 5px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; align-items:baseline; width:100%; padding:5px 14px; background:none; border:0; cursor:pointer; text-align:left; border-left:2px solid transparent; }
  .row:hover { background:var(--paper-2); }
  .row[data-sel="1"] { background:var(--paper-2); border-left-color:var(--k); }
  .row .o { font-family:var(--f-display); font-size:15.5px; font-weight:600; letter-spacing:.05em; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .row .o .sq { width:10px; height:10px; }
  .row .m { font-size:12px; color:var(--ink-2); }
  .row .mt { grid-column:1 / -1; font-size:11px; color:var(--ink-2); }
  .row .mt .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); margin-right:6px; }
  .row .n { grid-column:1 / -1; font-size:11.5px; color:var(--ink-3); line-height:1.55; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .row[data-sel="1"] .n { -webkit-line-clamp:unset; display:block; color:var(--ink-2); }
  .row[data-future="1"] .o { color:var(--ink-3); }
  .empty { padding:24px 16px; color:var(--ink-3); font-size:12.5px; }

  /* table + chronology */
  .tablewrap, .chronwrap { overflow:auto; background:var(--paper); min-height:0; padding:0 0 40px; }
  .intro { padding:18px 16px 14px; max-width:70ch; }
  .intro p { margin:0 0 8px; font-size:13px; color:var(--ink-2); line-height:1.7; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; background:var(--paper-2); text-align:left; padding:8px 14px; font-size:10.5px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); border-bottom:1px solid var(--rule); white-space:nowrap; z-index:1; }
  tbody td { padding:7px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
  tbody tr:hover { background:var(--paper-2); }
  tbody tr.click { cursor:pointer; }
  td.o { font-family:var(--f-display); font-size:15px; font-weight:600; letter-spacing:.05em; white-space:nowrap; }
  td.cat { white-space:nowrap; font-size:11.5px; color:var(--ink-2); }
  td.cat .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--k); margin-right:6px; vertical-align:middle; }
  td.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--ink-3); white-space:nowrap; }
  td.note { font-size:12px; color:var(--ink-2); line-height:1.6; min-width:22ch; max-width:72ch; }
  .chron { max-width:900px; padding:0 16px; }
  .ev { display:grid; grid-template-columns:96px 16px minmax(0,1fr); gap:0 10px; cursor:pointer; }
  .ev:hover .evb { background:var(--paper-2); }
  .ev .yr { font-family:var(--f-mono); font-size:12px; color:var(--ink-2); text-align:right; padding-top:9px; line-height:1.35; }
  .ev .ln { position:relative; }
  .ev .ln::before { content:""; position:absolute; left:7px; top:0; bottom:0; width:1px; background:var(--rule); }
  .ev .ln i { position:absolute; left:3px; top:13px; width:9px; height:9px; border-radius:50%; background:var(--k); border:2px solid var(--paper); }
  .ev .evb { padding:7px 10px 8px; border-radius:3px; }
  .ev .evb b { font-family:var(--f-display); font-size:15px; letter-spacing:.05em; margin-right:8px; }
  .ev .evb .k { font-size:10.5px; color:var(--ink-3); letter-spacing:.12em; }
  .ev .evb p { margin:2px 0 0; font-size:12px; color:var(--ink-2); line-height:1.6; }
  .ev.snap .evb { background:color-mix(in srgb, var(--ink) 6%, transparent); }
  .ev.snap .evb b { font-size:16px; }

  @media (max-width: 900px) {
    .stage { grid-template-columns:minmax(0,1fr); grid-template-rows:58vh minmax(0,1fr); }
    .stage[data-view="table"], .stage[data-view="chron"] { grid-template-rows:minmax(0,1fr); }
    .index { border-left:0; border-top:1px solid var(--rule); }
    .inset, .scalebar { display:none; }
    .brand h1 { font-size:17px; }
    .brand .src { display:none; }
    .masthead { padding:10px 12px; gap:8px; }
    .tools { margin-left:0; }
    .search input { width:130px; }
    .legend { width:200px; left:10px; bottom:10px; }
    .caption { font-size:12px; padding:3px 12px 7px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="brand">
      <h1>战国列国形势图</h1>
      <span class="src">前475 — 前212 · 古今地名对照</span>
    </div>
    <span class="count" id="count"></span>
    <div class="tools">
      <div class="seg maponly" id="views" role="group" aria-label="视野">
        <button data-fit="all" aria-pressed="true">全域</button>
        <button data-fit="zy" aria-pressed="false">中原</button>
        <button data-fit="gz" aria-pressed="false">关中三晋</button>

  const DATA = {"items":[{"c":"state","k":"秦","old":"秦","mod":"嬴姓赵氏","note":"都城：雍 → 栎阳（前383）→ 咸阳（前350）。\n变法：秦孝公用商鞅两次变法（前356、前350）——废井田、开阡陌，行县制，奖励耕战，立二十等军功爵。\n名君：孝公、惠文王（前324 称王）、武王、昭襄王、秦王政。\n将相：商鞅、张仪、司马错、魏冉、范雎（远交近攻）、白起、吕不韦、王翦、王贲、李斯。\n扩张：前330–328 得魏河西、上郡；前316 灭巴蜀；前312 取汉中；前278 拔郢置南郡；前272 灭义渠；前260 长平之战；前256、前249 灭二周；前230–前221 十年间尽灭六国。\n前221 统一天下，王政称始皇帝，分天下为三十六郡。\n统一后继续扩张：前215 蒙恬北逐匈奴、取河南地，前214 置九原郡并连接秦赵燕旧长城为“万里长城”；同年平定岭南，置南海、桂林、象郡。又修驰道、直道，凿灵渠。前210 始皇死于沙丘，前209 陈胜吴广起事，前207 秦亡。","i":0},{"c":"state","k":"楚","old":"楚","mod":"芈姓熊氏","note":"都城：郢（纪南城）→ 陈（前278）→ 巨阳（前253）→ 寿春（前241）。\n战国疆域最广的国家：据江汉、江淮，南抵五岭，东灭越后尽有吴越故地。\n变法：楚悼王任吴起变法（约前386–前381），悼王死后吴起被旧贵族射杀，变法中辍。\n名君：悼王、威王（前333 败越，北破齐于徐州）、怀王（约前306 灭越、置江东郡；后受欺于张仪，客死于秦）、顷襄王、考烈王。\n人物：吴起、屈原、召滑（入越行间）、春申君黄歇、庄蹻（入滇）、项燕。\n前223 王翦、蒙武破楚于蕲南，虏楚王负刍；前222 秦定楚江南地。","i":1},{"c":"state","k":"齐","old":"齐","mod":"妫姓田氏（田齐）","note":"都城：临淄。前386 田和列为诸侯，田氏代姜齐。\n齐威王任邹忌改革，设稷下学宫，诸子百家云集。\n桂陵（前353）、马陵（前341）两败魏军，与秦东西并峙；前288 齐湣王与秦昭王并称东、西帝。\n前286 灭宋，前284 遭燕将乐毅率五国联军攻破，仅余莒、即墨；前279 田单火牛阵复国，然国力大衰。\n人物：邹忌、田忌、孙膑、孟尝君田文、田单、鲁仲连。\n前221 王贲自燕南攻齐，齐王建不战而降，六国尽灭。","i":2},{"c":"state","k":"燕","old":"燕","mod":"姬姓","note":"都城：蓟（上都）；武阳（下都，今易县）。\n前314 燕王哙让国于子之致大乱，齐宣王乘机破燕。燕昭王筑黄金台招贤，乐毅、郭隗、邹衍、剧辛皆至。\n约前300 燕将秦开袭破东胡，东胡却千余里，燕置上谷、渔阳、右北平、辽西、辽东五郡，筑长城自造阳至襄平。\n前284 乐毅破齐，几亡齐国。前227 太子丹遣荆轲刺秦王。\n前226 秦拔蓟，燕王喜走辽东；前222 王贲攻辽东，虏燕王喜。","i":3},{"c":"state","k":"赵","old":"赵","mod":"嬴姓赵氏","note":"都城：晋阳 → 中牟（前425）→ 邯郸（前386）。前403 与韩、魏同列为诸侯（三家分晋）。\n赵武灵王推行胡服骑射（前307），灭中山（前296），北破林胡、楼烦，置云中、雁门、代郡，筑长城至高阙。\n蔺相如完璧归赵、将相和；赵奢阏与之胜；前260 长平之战惨败，此后元气大伤。\n李牧北破匈奴、南却强秦（肥、番吾），前229 秦行反间，赵王迁杀李牧。\n前228 秦破邯郸，虏赵王迁；公子嘉奔代称代王，前222 亡。","i":4},{"c":"state","k":"魏","old":"魏","mod":"姬姓魏氏","note":"都城：安邑 → 大梁（前361，一说前364），故魏又称“梁”。\n魏文侯任李悝变法、吴起取河西、西门豹治邺、乐羊灭中山，魏为战国初期第一强国。\n魏惠王（梁惠王）称霸中原，但桂陵、马陵两败于齐，又失河西、上郡于秦，由盛转衰。\n开鸿沟，连通河、淮。战国后期信陵君窃符救赵、合纵破秦于河外。\n前225 王贲引河沟之水灌大梁，魏王假降。","i":5},{"c":"state","k":"韩","old":"韩","mod":"姬姓韩氏","note":"都城：平阳 → 宜阳 → 阳翟 → 新郑（前375 灭郑后迁都）。\n七雄中最弱，地处“四战之地”，西有强秦，东、北、南为魏、赵、楚所环。\n韩昭侯任申不害为相（前355–前337），以“术”治国，“国治兵强，无侵韩者”。\n前262 秦断上党与本土联系，上党守冯亭以地降赵，引发长平之战。韩派水工郑国入秦修渠以“疲秦”，反助秦富强。\n韩非为韩国公子。前230 内史腾攻韩，虏韩王安，置颍川郡——六国中最先灭亡。","i":6},{"c":"state","k":"周","old":"周（王畿）","mod":"姬姓","note":"天下共主，但战国时只剩洛阳附近一隅之地。\n前367 周分裂为西周（都河南王城）与东周（都巩）两个小国。\n前256 秦灭西周，周赧王卒，九鼎入秦；前249 秦相吕不韦灭东周。延续约八百年的周朝终结。","i":7},{"c":"state","k":"宋","old":"宋","mod":"子姓（商王后裔）","note":"都城：商丘（睢阳）。地处中原东部，富庶而四面受敌。\n宋君偃（康王）称王，“射天笞地”，诸侯称为“桀宋”。\n前286 齐湣王灭宋，其地后为魏、楚所分；灭宋直接引发五国伐齐。\n庄子为宋国蒙人；墨子一说亦为宋人。","i":8},{"c":"state","k":"卫","old":"卫","mod":"姬姓","note":"都城：帝丘（濮阳）。战国时降为小国，先后依附魏、秦。\n商鞅、吴起、吕不韦、荆轲皆出自卫国。\n前241 秦拔濮阳置东郡，徙卫君角于野王，卫作为秦的附庸延续至前209，被秦二世废为庶人——周代封国中最后灭亡者。","i":9},{"c":"state","k":"鲁","old":"鲁","mod":"姬姓","note":"都城：曲阜。周公之后，礼乐之邦，孔子故国，儒学中心。战国时国势衰微。\n前256 楚考烈王灭鲁（一说前249 迁鲁顷公于莒/下邑）。","i":10},{"c":"state","k":"中山","old":"中山","mod":"姬姓（白狄鲜虞）","note":"都城：顾 → 灵寿。“千乘之国”，夹于燕、赵之间。\n前406 魏将乐羊灭中山，约前380 复国；前323 与魏、韩、赵、燕“五国相王”。\n中山王厝墓出土错金银铜器、“中山三器”等，工艺冠绝一时。\n前296 赵武灵王灭中山。","i":11},{"c":"state","k":"越","old":"越","mod":"姒姓","note":"都城：会稽 → 琅琊（前468）→ 吴（前379，《竹书纪年》：“于粤子翳三十三年，迁于吴”）。勾践灭吴（前473）后称霸东南。\n战国时内乱频仍，《庄子》称“越人三世弑其君”：前375 太子诸咎弑越王翳，前365 前后寺区之弟思弑越王莽安。\n前312 越王仍遣使向魏献乘舟、舟三百、箭五百万及犀角象齿（《竹书纪年》），可见此时越尚为有实力的王国。\n灭亡年代有两说：① 传统说据《史记·越世家》《资治通鉴》，前334/前333 楚威王大败越，杀越王无疆；② 杨宽等据《史记·甘茂列传》《战国策·楚策》范环语、《楚世家》昭雎语及《韩非子》“昭滑……五年而能亡越”，考定楚怀王遣召滑入越制造内乱，约前306 乘乱灭越，杀无疆，尽取故吴地至浙江，置江东郡。本图采用前306 说，前333 一役视为楚越战争的前段。\n此后越人散居浙江以南沿海，“或为王，或为君，滨于江南海上，服朝于楚”；前222 王翦“降越君，置会稽郡”。东瓯、闽越皆其后裔。","i":12},{"c":"state","k":"巴","old":"巴","mod":"姬姓（一说廪君之后）","note":"都城：江州（今重庆），后期亦都阆中。巴人勇锐善战，以“巴渝舞”著称。\n与蜀世为仇雠。前316 秦司马错、张仪乘巴蜀相攻，灭蜀后又灭巴，置巴郡。","i":13},{"c":"state","k":"蜀","old":"蜀","mod":"开明氏","note":"都城：成都。沃野千里，秦取之后成为统一战争的粮仓。\n前316 秦惠文王从司马错之议，经金牛道（石牛道）伐蜀，灭之，置蜀郡。\n约前256–前251 秦蜀守李冰修都江堰，成都平原“水旱从人，不知饥馑”。","i":14},{"c":"state","k":"义渠","old":"义渠","mod":"西戎","note":"西戎之一，筑城郭而居，在今甘肃庆阳、宁夏南部一带，与秦长期攻战。\n前272 秦宣太后诱杀义渠王于甘泉宫，秦发兵灭义渠，置陇西、北地、上郡，并筑长城以拒胡。","i":15},{"c":"capital","old":"雍","mod":"陕西宝鸡凤翔区","lon":107.39,"lat":34.52,"st":"秦","y0":-677,"y1":-383,"note":"秦都近三百年（前677–前383），秦公一号大墓所在；迁都后仍为宗庙与祭祀中心。","tl":"-9999:秦","i":16},{"c":"capita "mod":"大别山","note":"江淮之间的屏障；冥阸等“义阳三关”在其西端。","geo":[[114.1,31.75],[114.8,31.4],[115.5,31.15],[116.2,30.85]],"anc":[115.139,31.279],"i":386},{"c":"range","old":"大巴山","mod":"大巴山","note":"汉中与巴蜀之间的屏障；秦伐蜀取道金牛道（石牛道）。","geo":[[106.3,32.5],[107.3,32.2],[108.3,32.0],[109.3,31.75],[110.2,31.5]],"anc":[108.257,32.009],"i":387},{"c":"range","old":"巫山","mod":"巫山","note":"长江三峡所在；楚置巫郡，扼巴蜀东出之路。","geo":[[109.7,31.2],[110.2,31.0],[110.6,30.8]],"anc":[110.16,31.016],"i":388},{"c":"range","old":"武陵山","mod":"武陵山","note":"楚黔中郡所在的山地。","geo":[[108.4,28.0],[109.1,28.8],[109.8,29.4],[110.4,29.8]],"anc":[109.306,28.977],"i":389},{"c":"range","old":"五岭","mod":"南岭","note":"楚国南境大致止于五岭北麓；岭南为百越之地，秦统一后（前214）方开岭南三郡。","geo":[[109.8,25.9],[110.8,25.4],[111.8,25.2],[112.8,25.15],[113.8,25.2],[114.8,25.2],[115.6,25.0]],"anc":[112.635,25.158],"i":390},{"c":"range","old":"陇山","mod":"六盘山","note":"关中与陇西的分界，“陇坂九回”，萧关在其北口。","geo":[[106.25,34.85],[106.35,35.4],[106.3,36.0],[106.2,36.5]],"anc":[106.327,35.675],"i":391},{"c":"range","old":"泰山·沂山","mod":"泰沂山地","note":"泰山古称岱宗，东岳；齐长城沿其北麓修筑，为齐与鲁、楚之界。","geo":[[116.6,36.28],[117.2,36.25],[117.7,36.1],[118.2,35.9],[118.6,35.75]],"anc":[117.638,36.119],"i":392},{"c":"range","old":"贺兰山","mod":"贺兰山","note":"北方游牧诸部活动之地。","geo":[[105.8,38.2],[106.0,38.7],[106.3,39.2]],"anc":[106.008,38.713],"i":393},{"c":"range","old":"岷山","mod":"岷山","note":"古人以岷山为江源，《禹贡》：“岷山导江”。","geo":[[103.4,33.2],[103.7,32.6],[103.5,31.8]],"anc":[103.68,32.518],"i":394},{"c":"range","old":"武夷山","mod":"武夷山","note":"闽越与内地之间的屏障。","geo":[[116.6,27.0],[117.4,27.7],[118.1,28.1]],"anc":[117.295,27.608],"i":395},{"c":"range","old":"会稽山","mod":"会稽山","note":"越国发祥之地，相传大禹葬于会稽。","geo":[[120.3,29.72],[120.75,29.62]],"anc":[120.525,29.67],"i":396},{"c":"range","old":"医巫闾山","mod":"医巫闾山","note":"古幽州镇山，燕辽西郡境内。","geo":[[121.55,41.4],[121.8,42.0]],"anc":[121.675,41.7],"i":397},{"c":"river","sub":"river","old":"汾水","mod":"汾河","note":"晋中、河东的中轴；晋阳、平阳皆临汾水。","anc":[111.996,37.142],"i":398},{"c":"river","sub":"river","old":"沂水","mod":"沂河","note":"齐、楚、鲁之间。","anc":[118.649,35.262],"i":399},{"c":"river","sub":"river","old":"江","mod":"长江","note":"战国时“江”专指长江。当时江口约在今扬州、镇江一带，以下为宽阔的河口湾。","anc":[114.6,30.45],"i":400},{"c":"river","sub":"river","old":"辽水","mod":"辽河","note":"燕辽东郡西界。","anc":[123.061,42.105],"i":401},{"c":"river","sub":"river","old":"沅水","mod":"沅江","note":"楚黔中郡的主要河谷。","anc":[110.082,27.267],"i":402},{"c":"river","sub":"river","old":"汉水","mod":"汉江","note":"上游称沔水。汉中、上庸在其流域；楚“以汉水为池”。","anc":[111.8,32.4],"i":403},{"c":"river","sub":"river","old":"豫章水","mod":"赣江","note":"楚国东南境。","anc":[114.919,26.788],"i":404},{"c":"river","sub":"river","old":"饶乐水","mod":"西拉木伦河","note":"东胡活动地区。","anc":[118.624,43.242],"i":405},{"c":"river","sub":"river","old":"浙江","mod":"钱塘江·富春江","note":"浙江之名本指此水；楚灭越后“尽取故吴地至浙江”。","anc":[119.696,29.824],"i":406},{"c":"river","sub":"river","old":"治水","mod":"桑干河·永定河","note":"又称㶟水，流经代地与燕都蓟南。","anc":[113.982,40.006],"i":407},{"c":"river","sub":"river","old":"延江","mod":"乌江","note":"又称涪陵水；枳（涪陵）为巴楚交界。","anc":[108.234,28.282],"i":408},{"c":"river","sub":"river","old":"湘水","mod":"湘江","note":"楚国南境开发的主轴。","anc":[112.609,26.816],"i":409},{"c":"river","sub":"river","old":"淮水","mod":"淮河","note":"“江淮河济”四渎之一。战国时淮河下游经淮阴独流入海，尚无洪泽湖；楚国东进的主轴。","anc":[116.1,32.45],"i":410},{"c":"river","sub":"river","old":"西汉水","mod":"嘉陵江","note":"上游称西汉水，下游又称渝水，巴国腹地。","anc":[105.996,31.596],"i":411},{"c":"river","sub":"river","old":"河","mod":"黄河（下游为战国故道）","note":"“四渎”之首，战国时单称“河”。下游与今迥异：大致经今浚县宿胥口北流，过内黄、馆陶、临清、德州、沧州，在今黄骅一带入渤海（据谭其骧考订，示意），是齐、赵、燕之间的界河。今河道（虚线）系后世多次改道形成。","anc":[115.65,36.85],"i":412},{"c":"river","sub":"river","old":"马訾水","mod":"鸭绿江","note":"燕辽东与朝鲜之间。","anc":[126.866,41.758],"i":413},{"c":"river","sub":"river","old":"白狼水","mod":"大凌河","note":"燕辽西郡境内。","anc":[120.631,41.616],"i":414},{"c":"river","sub":"river","old":"渭水","mod":"渭河","note":"关中命脉，秦都咸阳临渭。","anc":[107.127,34.367],"i":415},{"c":"river","sub":"river","old":"泾水","mod":"泾河","note":"“泾渭分明”；郑国渠引泾水东注洛水。","anc":[107.95,35.245],"i":416},{"c":"river","s     lWater.append(el("path", { d, fill: "var(--water-fill)", opacity: .65, stroke: "var(--water)", "stroke-width": .8, "stroke-dasharray": "3 2", "vector-effect": "non-scaling-stroke" }));
    (lineItems[it.i] ||= []).push(d);
  }
  const RSTY = {
    major:  { stroke: "var(--water)", "stroke-width": 1.9, opacity: 1 },
    minor:  { stroke: "var(--water)", "stroke-width": 1.1, opacity: .95 },
    faint:  { stroke: "var(--water)", "stroke-width": .8, opacity: .55 },
    modern: { stroke: "var(--water)", "stroke-width": 1.1, opacity: .6, "stroke-dasharray": "3 3" }
  };
  for (const r of GEO.rivers) {
    const d = P(decode(r.p), false);
    const st = RSTY[r.k] || RSTY.minor;
    lRiver.append(el("path", { d, fill: "none", "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke", ...st, ...(r.k === "modern" ? { "data-modern": 1 } : {}) }));
    if (r.it != null) (lineItems[r.it] ||= []).push(d);
  }
  for (const c of GEO.canals) {
    const d = P(lineLL(decodeLL(c.p)), false);
    lRiver.append(el("path", { d, fill: "none", stroke: "var(--water)", "stroke-width": 1.3, "stroke-dasharray": "5 2 1 2", "vector-effect": "non-scaling-stroke" }));
    (lineItems[c.it] ||= []).push(d);
  }
  function decodeLL(flat) { const out = []; let x = 0, y = 0; for (let i = 0; i < flat.length; i += 2) { x += flat[i]; y += flat[i + 1]; out.push([x / 100, y / 100]); } return out; }
  // 长城
  const wallEls = {};
  for (const it of ITEMS.filter(i => i.c === "wall")) {
    const d = P(lineLL(it.geo), false);
    const g = el("g");
    g.append(el("path", { d, fill: "none", stroke: "var(--wall)", "stroke-width": 1.5, "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
    g.append(el("path", { d, fill: "none", stroke: "var(--wall)", "stroke-width": 5, "stroke-dasharray": "1.6 4.4", "vector-effect": "non-scaling-stroke" }));
    lWall.append(g); wallEls[it.i] = g;
    (lineItems[it.i] ||= []).push(d);
  }
  // 驰道、直道
  const roadEls = {};
  for (const it of ITEMS.filter(i => i.c === "road")) {
    const g = el("g");
    for (const sg of it.geo) {
      const d = P(lineLL(sg), false);
      g.append(el("path", { d, fill: "none", stroke: "var(--land)", "stroke-width": 3.4, opacity: .6, "stroke-linecap": "round", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
      g.append(el("path", { d, fill: "none", stroke: "var(--road)", "stroke-width": 1.7, "stroke-dasharray": "6 3", "stroke-linecap": "round", "stroke-linejoin": "round", "vector-effect": "non-scaling-stroke" }));
      (lineItems[it.i] ||= []).push(d);
    }
    lRoad.append(g); roadEls[it.i] = g;
  }
  // 线要素点击热区
  for (const [i, ds] of Object.entries(lineItems)) {
    const it = ITEMS[i];
    for (const d of ds) {
      const closed = it.sub === "lake" || it.sub === "marsh";
      lHit.append(el("path", { d, class: "hit", "data-i": i, fill: closed ? "transparent" : "none", stroke: "transparent", "stroke-width": 12, "vector-effect": "non-scaling-stroke", "pointer-events": closed ? "all" : "stroke", "data-cat": it.c }));
    }
  }
  // 线要素注记锚点
  for (const it of ITEMS) if (it.anc) it.axy = proj(it.anc[0], it.anc[1]);

  /* ---------------- 状态 ---------------- */
  let W = 800, H = 600;
  const view = { cx: 0, cy: 0, k: 1 };
  let hovered = null, selected = null, activeFit = "all", query = "";
  let si = 0;                      // 当前时间节点
  const snapY = () => SNAPS[si].y;
  const prevY = () => si > 0 ? SNAPS[si - 1].y : -480;
  // 本期 = 上一个节点之后（不含）到本节点（含）；第一个节点从前480 算起
  const inPeriod = it => it.y > prevY() && it.y <= snapY();
  const periodOf = y => { let j = SNAPS.findIndex(s => s.y >= y); return j < 0 ? SNAPS.length - 1 : j; };

  /* ---------------- 疆域 ---------------- */
  let stateLabels = [];
  function buildStates() {
    lState.replaceChildren();
    const sn = SNAPS[si];
    stateLabels = [];
    for (const k of STATES) {
      const rings = sn.s[k]; if (!rings) continue;
      const d = rings.map(r => P(decode(r), true)).join(" ");
      const it = stateItem[k];
      const on = selected === it.i || hovered === it.i;
      lState.append(el("path", {
        d, class: "state-shape", "data-i": it.i, "fill-rule": "evenodd",
        style: `fill:${sVar(k)};fill-opacity:${on ? "var(--s-op-hi)" : "var(--s-op)"};stroke:color-mix(in srgb, ${sVar(k)} 72%, var(--ink));stroke-width:${on ? 2.4 : 1.1}px;stroke-opacity:.9`,
        "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round"
      }));
      for (const [lo, la, n, r] of (sn.l[k] || [])) stateLabels.push({ k, it, xy: proj(lo, la), n, r });
    }
    lState.setAttribute("display", layerOn.territory ? "inline" : "none");
    // 秦郡界
    lJun.replaceChildren();
    for (const [k, rings] of Object.entries(sn.j || {})) {
      const it = junItem[k]; if (!it) continue;
      const on = selected === it.i || hovered === it.i;
      const d = rings.map(r => P(decode(r), true)).join(" ");
      lJun.append(el("path", { d, "fill-rule": "evenodd", fill: on ? "var(--jun)" : "none", "fill-opacity": on ? .14 : 0,
        stroke: "var(--land)", "stroke-width": on ? 4 : 2.6, opacity: .75, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round", "pointer-events": "none" }));
      lJun.append(el("path", { d, fill: "none", stroke: "var(--jun)", "stroke-width": on ? 1.8 : 1.15, "stroke-dasharray": on ? "none" : "5 3",
        opacity: on ? 1 : .9, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round", "pointer-events": "none" }));
    }
    lJun.setAttribute("display", layerOn.jun ? "inline" : "none");
  }

  /* ---------------- 视图 ---------------- */
  function fitTo(key, animate) {
    const b = FITS[key] || FITS.all;
    const bb = bboxOf(bboxPath(b[0], b[1], b[2], b[3]));
    const padL = (!legBody.hidden && W > 760) ? 250 : 0;
    const k = Math.min((W - padL) / (bb[2] - bb[0]), H / (bb[3] - bb[1])) * 0.94;
    setView((bb[0] + bb[2]) / 2 - padL / 2 / k, (bb[1] + bb[3]) / 2, k, animate);
  }
  const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
  function setView(cx, cy, k, animate) {
    const target = { cx, cy, k: Math.max(0.6, Math.min(60, k)) };
    if (!animate || reduce()) { Object.assign(view, target); render(); return; }
    const from = { ...view }, t0 = performance.now(), dur = 480;
    (function step(t) {
      const u = Math.min(1, (t - t0) / dur), e = u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
      view.cx = from.cx + (target.cx - from.cx) * e; view.cy = from.cy + (target.cy - from.cy) * e;
      view.k = Math.exp(Math.log(from.k) + (Math.log(target.k) - Math.log(from.k)) * e);
      render(); if (u < 1) requestAnimationFrame(step);
    })(t0);
  }
  const sx = p => (p[0] - view.cx) * view.k + W / 2;
  const sy = p => (p[1] - view.cy) * view.k + H / 2;

  function textW(str, size) { let w = 0; for (const ch of str) w += ch.charCodeAt(0) > 0x2e80 ? size : size * 0.56; return w; }
  const overlap = (a, b) => a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h;

  function matches(it) {
    if (!query) return true;
    return (it.old || "").includes(query) || (it.mod || "").includes(query) || (it.alias || "").includes(query);
  }
  function pointVisible(it) {
    if (!layerOn[it.c]) return false;
    return matches(it);
  }

  /* ---------------- 标记符号 ---------------- */
  function drawMarker(g, it, x, y, on) {
    const Y = snapY();
    if (it.c === "capital") {
      const act = it.y0 <= Y && Y < it.y1;
      if (act) {
        if (on) g.append(el("circle", { cx: x, cy: y, r: 12, fill: sVar(it.st), opacity: .3 }));
        g.append(el("rect", { x: x - 6, y: y - 6, width: 12, height: 12, fill: "var(--paper)", stroke: "var(--c-capital)", "stroke-width": 1.5 }));
        g.append(el("rect", { x: x - 3.4, y: y - 3.4, width: 6.8, height: 6.8, style: `fill:color-mix(in srgb, ${sVar(it.st)} 75%, var(--ink))` }));
        return 7;
      }
      g.append(el("rect", { x: x - 4, y: y - 4, width: 8, height: 8, fill: "var(--land)", stroke: "var(--ink-3)", "stroke-width": 1.2, "stroke-dasharray": on ? "none" : "2 1.4" }));
      return 5;
    }
    if (it.c === "battle") {
      const cur = inPeriod(it);
      const s = on ? 6.5 : 5;
      const op = cur ? 1 : .45;
      if (cur || on) g.append(el("circle", { cx: x, cy: y, r: s + 5, fill: "var(--c-battle)", opacity: on ? .25 : .16 }));
      g.append(el("circle", { cx: x, cy: y, r: s + 1.8, fill: "var(--paper)", stroke: "var(--c-battle)", "stroke-width": 1.3, opacity: op }));
      g.append(el("path", { d: `M${x - s * .62} ${y - s * .62}L${x + s * .62} ${y + s * .62}M${x + s * .62} ${y - s * .62}L${x - s * .62} ${y + s * .62}`, stroke: "var(--c-battle)", "stroke-width": 1.9, "stroke-linecap": "round", opacity: op }));
      return s + 2;
    }
    if (it.c === "pass") {
      const d = on ? 6 : 4.6;
      g.append(el("rect", { x: -d, y: -d, width: d * 2, height: d * 2, transform: `translate(${x} ${y}) rotate(45)`, fill: "var(--c-pass)", stroke: "var(--paper)", "stroke-width": 1.4 }));
      return d + 1;
    }
    if (it.c === "culture") {
      const fut = it.y > Y, s = on ? 7 : 5.6;
      g.append(el("path", { d: `M${x} ${y - s}L${x + s * .9} ${y + s * .62}L${x - s * .9} ${y + s * .62}Z`, fill: "var(--c-culture)", stroke: "var(--paper)", "stroke-width": 1.3, opacity: fut ? .4 : 1 }));
      return s;
    }
    if (it.c === "jun") {
      const r = on ? 10 : 8.5;
      g.append(el("circle", { cx: x, cy: y, r, fill: "none", stroke: "var(--jun)", "stroke-width": on ? 2 : 1.3, opacity: .9 }));
      g.append(el("circle", { cx: x, cy: y, r: 2.2, fill: "var(--jun)" }));
      return r;
    }
    if (it.c === "town") {
      const r = on ? 4.4 : 2.5;
      g.append(el("circle", { cx: x, cy: y, r, fill: on ? "var(--ink-2)" : "var(--ink-3)", stroke: "var(--land)", "stroke-width": 1 }));
      return r + .5;
    }
    // city
    const r = on ? 5 : 3.6;
    g.append(el("circle", { cx: x, cy: y, r, fill: "var(--paper)", stroke: "var(--c-city)", "stroke-width": 1.6 }));
    return r + 1;
  }

  /* ---------------- 渲染 ---------------- */
  const tip = document.getElementById("tip");
  function render() {
    gGeo.setAttribute("transform", `translate(${W / 2} ${H / 2}) scale(${view.k}) translate(${-view.cx} ${-view.cy})`);
    gMark.replaceChildren();
    const Y = snapY();
    const obstacles = [], items = [];
    const K = view.k;
    const zoomedIn = K > 5.2;

    // 点
    let nShown = 0;
    const pts = ITEMS.filter(it => it.lon != null && ["capital", "battle", "pass", "city", "culture", "town", "jun"].includes(it.c) && pointVisible(it));
    // 绘制次序：城邑 → 文化 → 关隘 → 旧都 → 战役 → 今都
    const ord = it => it.c === "jun" ? -2 : it.c === "town" ? -1 : it.c === "city" ? 0 : it.c === "culture" ? 1 : it.c === "pass" ? 2 : it.c === "capital" ? (it.y0 <= Y && Y < it.y1 ? 5 : 3) : 4;
    pts.sort((a, b) => ord(a) - ord(b));
    for (const it of pts) {
      const onNow = hovered === it.i || selected === it.i;
      const future = it.c === "culture" && it.y > Y;
      if (future) continue;                                   // 尚未发生的变法、工程不显示
      if (it.c === "battle" && !inPeriod(it) && !onNow) continue;   // 战役只显示本期；他期仅在列表里悬停时淡显
      if (it.c === "capital" && it.y0 > Y) continue;          // 尚未成为国都的城不显示
      if ((it.c === "city" || it.c === "culture") && K < 1.8 && !onNow && !query) continue;
      if (it.c === "town" && K < 2.6 && !onNow && !query) continue;
      if (it.c === "jun" && (!junLive(it, Y) || (K < 1.6 && !onNow && !query))) continue;
      const p = proj(it.lon, it.lat), x = sx(p), y = sy(p);
      if (x < -40 || x > W + 40 || y < -30 || y > H + 30) continue;
      nShown++;
      const on = hovered === it.i || selected === it.i;
      const g = el("g", { class: "marker", "data-i": it.i, style: "cursor:pointer" });
      const r = drawMarker(g, it, x, y, on);
      g.append(el("circle", { cx: x, cy: y, r: 12, fill: "transparent" }));
      gMark.append(g);
      obstacles.push({ x: x - r - 1, y: y - r - 1, w: (r + 1) * 2, h: (r + 1) * 2 });
      const actCap = it.c === "capital" && it.y0 <= Y && Y < it.y1;
      const minor = it.c === "city" || it.c === "culture" || (it.c === "capital" && !actCap);
      if (minor && K < 3.4 && !on) continue;
      if (it.c === "town" && K < 4.4 && !on && !query) continue;
      if (it.c === "jun" && K < 2.3 && !on && !query) continue;
      if (future && K < 5 && !on) continue;
      const size = on ? 14 : actCap ? 13.5 : it.c === "battle" ? 12.5 : it.c === "town" ? 11 : 12;
      const twoLine = on || (it.c === "town" ? K > 7.5 : zoomedIn);
      const base = { capital: actCap ? 20 : 70, battle: 40, pass: 50, city: 60, culture: 65, town: 78, jun: 58 }[it.c];
      items.push({ kind: "site", it, x, y, r, size, twoLine, on, act: actCap,
        w: Math.max(textW(it.old, size), twoLine ? textW(it.mod, 10.5) : 0), h: twoLine ? size + 13 : size + 2,
        pri: (on ? -1000 : 0) + base + it.i * 0.001 });
    }

    // 国名
    if (layerOn.territory) {
      for (const L of stateLabels) {
        const x = sx(L.xy), y = sy(L.xy);
        if (x < 0 || x > W || y < 0 || y > H) continue;
        const wpx = Math.sqrt(L.n) * 0.87 * K;
        const hpx = L.r * 17.45 * K * 1.6;
        let size = Math.min(wpx * 0.22, hpx * 0.8, 40);
        if (size < 10.5) { if (L.n < 400 && K > 2.5) size = 10.5; else continue; }
        const on = selected === L.it.i || hovered === L.it.i;
        const txt = L.k === "周" ? "周" : L.it.old;
        items.push({ kind: "state", L, x, y, size, text: txt, w: textW(txt, size) * (1 + (txt.length > 1 ? .35 : 0)), h: size, pri: (on ? -900 : 0) - Math.min(size, 40) });
      }
    }
    // 线要素注记
    const lineCats = ["range", "river", "wall", "road"];
    for (const it of ITEMS) {
      if (!lineCats.includes(it.c) || !it.axy || !layerOn[it.c] || !matches(it)) continue;
      if ((it.c === "wall" || it.c === "road") && it.y > Y) continue;
      if (it.c === "river" && it.sub === "lake" && K < 2.4) continue;
      const x = sx(it.axy), y = sy(it.axy);
      if (x < 10 || x > W - 10 || y < 10 || y > H - 10) continue;
      const on = hovered === it.i || selected === it.i;
      const isMajor = ["河", "江", "淮水", "济水", "汉水", "渭水"].includes(it.old);
      if (it.c === "river" && !isMajor && K < 3 && !on) continue;
      if (it.c === "range" && K < 2.2 && !on && !["太行山", "南山", "燕山", "五岭", "大别山", "大巴山", "阴山"].includes(it.old)) continue;
      const size = on ? 13.5 : it.c === "range" ? 11.5 : isMajor ? 13 : 11.5;
      const text = it.c === "wall" && wallGone(it, Y) ? it.old + "（废）" : it.old;
      items.push({ kind: it.c, it, x, y, size, text, on, w: textW(text, size) * (it.c === "range" ? 1.25 : 1.12) + 2, h: size + 2,
        pri: (on ? -950 : 0) + (it.c === "wall" ? (wallGone(it, Y) ? 96 : 88) : it.c === "road" ? 70 : it.c === "range" ? 80 : isMajor ? 45 : 85) });
    }
    // 族群
    if (layerOn.people) for (const it of ITEMS) {
      if (it.c !== "people" || !(it.y0 <= Y && Y <= it.y1) || !matches(it)) continue;
      const p = proj(it.lon, it.lat), x = sx(p), y = sy(p);
      if (x < 10 || x > W - 10 || y < 10 || y > H - 10) continue;
      items.push({ kind: "people", it, x, y, size: 12.5, text: it.old, w: textW(it.old, 12.5) * 1.45, h: 14, pri: 92 });
    }
    // 今省名
    if (layerOn.prov && K > 3.6) for (const p of provLabels) {
      const x = sx(p.xy), y = sy(p.xy);
      if (x < 20 || x > W - 20 || y < 16 || y > H - 16) continue;
      items.push({ kind: "prov", x, y, size: 11, text: p.text, w: textW(p.text, 11) * 1.4, h: 12, pri: 120 });
    }

    items.sort((a, b) => a.pri - b.pri);
    const placed = obstacles.slice();
    const txt = (a, s) => { const t = el("text", a); t.textContent = s; gMark.append(t); return t; };
    for (const it of items) {
      let cands;
      if (it.kind === "site") cands = [[it.r + 5, 0, "start"], [-it.r - 5, 0, "end"], [0, -it.r - 6, "middle"], [0, it.r + it.h - 1, "middle"], [it.r + 4, -it.h * .7, "start"], [-it.r - 4, -it.h * .7, "end"], [it.r + 4, it.h * .8, "start"], [-it.r - 4, it.h * .8, "end"]];
      else if (it.kind === "state") cands = [[0, 0, "middle"], [0, -it.size * .9, "middle"], [0, it.size * .9, "middle"], [-it.size * 1.2, 0, "middle"], [it.size * 1.2, 0, "middle"]];
      else cands = [[0, 0, "middle"], [0, -14, "middle"], [0, 14, "middle"], [-30, 0, "middle"], [30, 0, "middle"]];
      let put = null;
      for (const [dx, dy, anchor] of cands) {
        const bx = anchor === "start" ? it.x + dx : anchor === "end" ? it.x + dx - it.w : it.x + dx - it.w / 2;
        const by = it.y + dy - (it.kind === "site" ? it.size * .78 : it.size * .5);
        const box = { x: bx - 1, y: by - 1, w: it.w + 2, h: it.h + 2 };
        if (bx < 2 || bx + it.w > W - 2 || by < 2 || by + it.h > H - 2) continue;
        if (it.kind !== "state" && placed.some(q => overlap(box, q))) continue;
        if (it.kind === "state" && placed.some(q => q.state && overlap(box, q))) continue;
        put = { dx, dy, anchor, box }; break;
      }
      if (!put) continue;
      if (it.kind === "state") put.box.state = true;
      placed.push(put.box);
      const X = it.x + put.dx, Yy = it.y + put.dy;
      const halo = { stroke: "var(--land)", "stroke-width": 3.2, "paint-order": "stroke", "stroke-linejoin": "round" };
      if (it.kind === "site") {
        const s = it.it;
        const col = it.on ? (s.c === "battle" ? "var(--c-battle)" : s.c === "culture" ? "var(--c-culture)" : "var(--ink)") :
          (s.c === "capital" && !it.act) ? "var(--ink-2)" : s.c === "battle" ? "var(--c-battle)" : "var(--ink)";
        const fut = (s.c === "culture" && s.y > Y) || (s.c === "battle" && !inPeriod(s));
        const town = s.c === "town" && !it.on;
        if (s.c === "jun") {
          txt({ class: "map-text lbl-site", x: X, y: Yy, "text-anchor": put.anchor, "font-size": it.size, fill: "var(--jun)", "font-weight": 600, "letter-spacing": "1px", ...halo }, s.old);
          if (it.twoLine) txt({ class: "map-text", x: X, y: Yy + 12.5, "text-anchor": put.anchor, "font-size": 10, fill: "var(--ink-2)", ...halo, "stroke-width": 3 }, "治 " + s.zhi);
          continue;
        }
        txt({ class: "map-text lbl-site", x: X, y: Yy, "text-anchor": put.anchor, "font-size": it.size, fill: town ? "var(--ink-3)" : col, "font-weight": town ? 500 : 600, opacity: fut ? .5 : 1, ...halo }, s.old);
        if (it.twoLine) txt({ class: "map-text", x: X, y: Yy + 12.5, "text-anchor": put.anchor, "font-size": town ? 9.5 : 10.5, fill: town ? "var(--ink-3)" : "var(--ink-2)", opacity: town ? .85 : 1, ...halo, "stroke-width": 3 }, s.mod);
      } else if (it.kind === "state") {
        const k = it.L.k;

    territory: '<rect x="1" y="2" width="12" height="10" rx="1.5" fill="var(--s-0)" opacity=".6"/>',
    capital: '<rect x="2" y="2" width="10" height="10" fill="var(--paper)" stroke="var(--c-capital)" stroke-width="1.4"/><rect x="4.6" y="4.6" width="4.8" height="4.8" fill="var(--c-capital)"/>',
    battle: '<circle cx="7" cy="7" r="5.6" fill="var(--paper)" stroke="var(--c-battle)" stroke-width="1.2"/><path d="M4.6 4.6 9.4 9.4M9.4 4.6 4.6 9.4" stroke="var(--c-battle)" stroke-width="1.7" stroke-linecap="round"/>',
    pass: '<rect x="3.5" y="3.5" width="7" height="7" transform="rotate(45 7 7)" fill="var(--c-pass)"/>',
    city: '<circle cx="7" cy="7" r="3.6" fill="var(--paper)" stroke="var(--c-city)" stroke-width="1.6"/>',
    town: '<circle cx="7" cy="7" r="2.4" fill="var(--ink-3)"/>',
    culture: '<path d="M7 1.8 12 10.6H2Z" fill="var(--c-culture)"/>',
    jun: '<circle cx="7" cy="7" r="5.2" fill="none" stroke="var(--jun)" stroke-width="1.3"/><circle cx="7" cy="7" r="1.8" fill="var(--jun)"/>',
    road: '<path d="M1 9 C5 5, 9 9, 13 5" stroke="var(--road)" stroke-width="1.7" stroke-dasharray="4 2" fill="none"/>',
    wall: '<path d="M1 7H13" stroke="var(--wall)" stroke-width="1.4"/><path d="M1 7H13" stroke="var(--wall)" stroke-width="5" stroke-dasharray="1.6 2.4"/>',
    range: '<path d="M1 9 C4 5, 9 5, 13 8" stroke="var(--range)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/>',
    river: '<path d="M1 9 C4 4, 8 11, 13 5" stroke="var(--water)" stroke-width="1.8" fill="none"/>',
    people: '<text x="7" y="11" text-anchor="middle" font-size="10" font-style="italic" fill="var(--ink-3)">夷</text>',
    prov: '<path d="M1 7H13" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 2"/>'
  };
  const legend = document.getElementById("legend");
  for (const L of LAYERS) {
    const n = L.id === "territory" || L.id === "prov" ? "" : ITEMS.filter(i => i.c === L.id).length;
    const li = document.createElement("li");
    li.innerHTML = `<button aria-pressed="true" data-l="${L.id}"><svg width="14" height="14" viewBox="0 0 14 14">${SYM[L.id]}</svg><span>${L.name}</span><span class="n">${n}</span></button>`;
    legend.append(li);
  }
  legend.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.l; layerOn[id] = !layerOn[id];
    b.setAttribute("aria-pressed", layerOn[id] ? "true" : "false");
    if (id === "territory") buildStates();
    render(); buildIndex();
  });
  const legBody = document.getElementById("legbody"), legT = document.getElementById("legtoggle");
  function setLeg(open) { legBody.hidden = !open; legT.textContent = open ? "收起" : "展开"; legT.setAttribute("aria-expanded", open); }
  legT.addEventListener("click", () => setLeg(legBody.hidden));
  if (matchMedia("(max-width: 900px)").matches) setLeg(false);

  /* ---------------- 索引 ---------------- */
  const index = document.getElementById("index");
  const closedGroups = new Set(["people", "town"]);
  function buildIndex() {
    index.replaceChildren();
    const Y = snapY();
    let total = 0;
    for (const c of CATS) {
      let list = ITEMS.filter(i => i.c === c.id && matches(i));
      if (!list.length) continue;
      if (c.id === "culture" || c.id === "wall" || c.id === "road") list.sort((a, b) => a.y - b.y);
      if (c.id === "jun") list.sort((a, b) => a.y0 - b.y0);
      if (c.id === "battle") list.sort((a, b) => (inPeriod(b) - inPeriod(a)) || a.y - b.y);
      const sub = c.id === "battle" ? `本期 ${list.filter(inPeriod).length} · 共 ${list.length}` : `${list.length} · ${c.sub}`;
      if (c.id === "capital") list.sort((a, b) => STATES.indexOf(a.st) - STATES.indexOf(b.st) || a.y0 - b.y0);
      total += list.length;
      const sec = document.createElement("section");
      sec.className = "grp"; sec.style.setProperty("--k", c.k);
      sec.dataset.closed = closedGroups.has(c.id) && !query ? "1" : "0";
      sec.innerHTML = `<h2><span class="chev">▼</span><span class="bar"></span>${c.name}<span class="sub">${sub}</span></h2>`;
      sec.querySelector("h2").addEventListener("click", () => {
        const cl = sec.dataset.closed === "1"; sec.dataset.closed = cl ? "0" : "1";
        if (cl) closedGroups.delete(c.id); else closedGroups.add(c.id);
      });
      const ol = document.createElement("ol");
      for (const it of list) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = "row"; b.dataset.i = it.i; b.dataset.sel = selected === it.i ? "1" : "0";
        const kcol = it.c === "state" ? sVar(it.k) : it.c === "capital" ? sVar(it.st) : c.k;
        b.style.setProperty("--k", kcol);
        if ((it.c === "culture" || it.c === "wall" || it.c === "road") && it.y > Y) b.dataset.future = "1";
        if (it.c === "jun" && !junLive(it, Y)) b.dataset.future = "1";
        if (it.c === "battle" && !inPeriod(it)) b.dataset.future = "1";
        if (it.c === "state" && !SNAPS[si].s[it.k]) b.dataset.future = "1";
        const sw = it.c === "state" ? `<span class="sq" style="--k:${sVar(it.k)}"></span>` : "";
        const meta = metaHTML(it, Y, false);
        const note = it.c === "state" ? esc(it.note).replace(/\n/g, "<br>") : esc(it.note);
        b.innerHTML = `<span class="o">${sw}${esc(it.old)}</span><span class="m">${esc(it.mod || "")}</span>` +
          (meta ? `<span class="mt">${meta}</span>` : "") + (note ? `<span class="n">${note}</span>` : "");
        b.addEventListener("click", () => { if (stage.dataset.view !== "map") setMode("map"); select(it.i, false); });
        b.addEventListener("mouseenter", () => { hovered = it.i; if (it.c === "state") buildStates(); render(); });
        b.addEventListener("mouseleave", () => { hovered = null; if (it.c === "state") buildStates(); render(); });
        li.append(b); ol.append(li);
      }
      sec.append(ol); index.append(sec);
    }
    if (!total) { const d = document.createElement("div"); d.className = "empty"; d.textContent = "没有匹配的条目。"; index.append(d); }
  }

  /* ---------------- 对照表 ---------------- */
  function buildTable() {
    const wrap = document.getElementById("tablewrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>地图所标全部条目，一名一行。经纬度取今日遗址或所在城市，可在任何地图应用中直接定位；线状要素（山脉、河流、长城）给出注记点。点击任一行回到地图并定位。</p>`;
    wrap.append(intro);
    const t = document.createElement("table");
    t.innerHTML = `<thead><tr><th>古名</th><th>今地 / 今名</th><th>类别</th><th>年代</th><th>经纬度</th><th>按语</th></tr></thead>`;
    const tb = document.createElement("tbody");
    for (const c of CATS) {
      if (c.id === "state") continue;
      for (const it of ITEMS.filter(x => x.c === c.id && matches(x))) {
        const tr = document.createElement("tr"); tr.className = "click";
        const ll = it.lon != null ? [it.lon, it.lat] : it.anc;
        const when = it.c === "capital" ? `${yr(it.y0)}–${yr(it.y1)}` : it.c === "jun" ? (it.y0 > -9000 ? `${yr(it.y0)} 置` : "—") : it.yt || "";
        tr.innerHTML = `<td class="o">${esc(it.old)}</td><td>${esc(it.mod || "")}</td>` +
          `<td class="cat" style="--k:${it.c === "capital" ? sVar(it.st) : c.k}"><span class="dot"></span>${c.name}${it.c === "capital" ? "·" + esc(it.st) : ""}</td>` +
          `<td class="num">${esc(when)}</td><td class="num">${ll ? ll[0].toFixed(2) + "°E&nbsp; " + ll[1].toFixed(2) + "°N" : ""}</td><td class="note">${esc(it.note || "—")}</td>`;
        tr.addEventListener("click", () => { setMode("map"); requestAnimationFrame(() => select(it.i, false)); });
        tb.append(tr);
      }
    }
    t.append(tb); wrap.append(t);
  }

  /* ---------------- 年表 ---------------- */
  const FALLS = [
    [-375, "郑", "韩哀侯灭郑，迁都新郑。", "韩"], [-306, "越", "楚怀王乘越内乱灭越，杀越王无疆，尽取故吴地至浙江，置江东郡（杨宽说；传统据《史记》作前334/前333 楚威王时）。", "越"],
    [-316, "巴、蜀", "秦司马错、张仪灭蜀、巴。", "蜀"], [-296, "中山", "赵武灵王灭中山。", "中山"], [-286, "宋", "齐湣王灭宋。", "宋"],
    [-272, "义渠", "秦宣太后诱杀义渠王，秦灭义渠。", "义渠"], [-256, "西周、鲁", "秦灭西周，周赧王卒；楚灭鲁。", "周"], [-249, "东周", "秦相吕不韦灭东周。", "周"],
    [-230, "韩", "内史腾虏韩王安，置颍川郡。", "韩"], [-228, "赵", "王翦破邯郸，虏赵王迁。", "赵"], [-225, "魏", "王贲引水灌大梁，魏王假降。", "魏"],
    [-223, "楚", "王翦、蒙武虏楚王负刍。", "楚"], [-222, "燕、代", "王贲虏燕王喜、代王嘉。", "燕"], [-221, "齐", "齐王建降，秦统一天下。", "齐"],
    [-209, "卫", "秦二世废卫君角，卫绝祀。", "卫"]
  ];
  function buildChron() {
    const wrap = document.getElementById("chronwrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>把地图上的战役、变法、迁都、筑城与诸国灭亡按时间排成一条线。灰底为地图时间轴上的节点；点击任一事件，地图会跳到该事件之后最近的节点并定位。</p>`;
    wrap.append(intro);
    const ev = [];
    for (const it of ITEMS) {
      if ((it.c === "battle" || it.c === "culture" || it.c === "wall" || it.c === "road") && it.y >= -480 && matches(it)) ev.push({ y: it.y, yt: it.yt, t: it.old, k: CAT[it.c].name, p: it.c === "battle" ? `${it.sides}。${it.note}` : it.note, col: CAT[it.c].k, i: it.i });
      if (it.c === "capital" && it.y0 >= -480 && matches(it)) ev.push({ y: it.y0, yt: yr(it.y0), t: `${it.st}都${it.old}`, k: "迁都", p: it.note, col: sVar(it.st), i: it.i });
    }
    for (const [y, nm, p, k] of FALLS) if (!query || nm.includes(query)) ev.push({ y, yt: yr(y), t: `${nm}亡`, k: "灭国", p, col: sVar(k), i: stateItem[k].i, fall: true });
    for (const s of SNAPS) if (!query) ev.push({ y: s.y, yt: yr(s.y), t: s.t, k: "地图节点", p: s.d, col: "var(--ink)", snap: true });
    ev.sort((a, b) => a.y - b.y || (a.snap ? 1 : 0) - (b.snap ? 1 : 0));
    const box = document.createElement("div"); box.className = "chron";
    for (const e of ev) {
      const d = document.createElement("div");
      d.className = "ev" + (e.snap ? " snap" : ""); d.style.setProperty("--k", e.col);
      d.innerHTML = `<div class="yr">${esc(e.yt)}</div><div class="ln"><i></i></div><div class="evb"><b>${esc(e.t)}</b><span class="k">${esc(e.k)}</span><p>${esc(e.p)}</p></div>`;
      d.addEventListener("click", () => {
        let j = SNAPS.findIndex(s => s.y >= e.y); if (j < 0) j = SNAPS.length - 1;
        setMode("map"); setSnap(j);
        if (e.i != null) requestAnimationFrame(() => select(e.i, false));
      });
      box.append(d);
    }
    wrap.append(box);
  }

  /* ---------------- 控件 ---------------- */
  document.getElementById("views").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    activeFit = b.dataset.fit;
    document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    fitTo(activeFit, true);
  });
  document.getElementById("zin").addEventListener("click", () => setView(view.cx, view.cy, view.k * 1.6, true));
  document.getElementById("zout").addEventListener("click", () => setView(view.cx, view.cy, view.k / 1.6, true));
  document.getElementById("zreset").addEventListener("click", () => { selected = null; buildStates(); fitTo(activeFit, true); markRows(); });
  document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); buildIndex(); buildTable(); buildChron(); });
  function setMode(m) {
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === m ? "true" : "false"));
    stage.dataset.view = m;
    document.querySelectorAll(".maponly").forEach(x => x.hidden = (m !== "map"));
    document.getElementById("timebar").hidden = m !== "map";
    if (m === "map") requestAnimationFrame(() => { const keep = { ...view }; resize(); if (keep.k !== 1) { Object.assign(view, keep); render(); } });
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" && si < SNAPS.length - 1) { stopPlay(); setSnap(si + 1); }
    if (e.key === "ArrowLeft" && si > 0) { stopPlay(); setSnap(si - 1); }
    if (e.key === "Escape") { selected = null; buildStates(); render(); markRows(); tip.dataset.on = "0"; }
  });

  /* ---------------- 启动 ---------------- */
  setSnap(0, false);
  buildStates();
  buildIndex(); buildTable(); buildChron();
  resize();
})();
</script>
</body>
</html>
