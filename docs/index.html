,"yt":"前273","sides":"秦 胜 魏·赵","cmd":"白起 vs 芒卯","note":"魏、赵攻韩华阳，白起驰援，斩首十三万，又沉赵卒二万于河。魏割南阳以和。","tl":"-9999:郐;-769:郑;-375:韩;-230:秦","i":100,"eold":"Battle of Huayang","emod":"N of Xinzheng, Henan","eyt":"273 BC","esides":"Qin defeated Wei and Zhao","ecmd":"Bai Qi vs. Mang Mao","enote":"Wei and Zhao attacked Huayang in Han; Bai Qi rushed to its relief, beheaded a hundred and thirty thousand and drowned twenty thousand Zhao troops in the He. Wei ceded Nanyang to make peace."},{"c":"battle","old":"阏与之战","mod":"山西和顺西（一说沁县）","lon":113.35,"lat":37.3,"y":-269,"yt":"前269","sides":"赵 胜 秦","cmd":"赵奢 vs 胡阳","note":"赵奢以为“其道远险狭，譬之犹两鼠斗于穴中，将勇者胜”，抢占北山，大破秦军，封马服君。秦由此转行范雎“远交近攻”之策。","tl":"-9999:白狄;-541:晋;-453:赵;-236:秦","i":101,"eold":"Battle of Yuyu","emod":"W of Heshun, Shanxi (one view: Qin County)","eyt":"269 BC","esides":"Zhao defeated Qin","ecmd":"Zhao She vs. Hu Yang","enote":"Holding that \"the road is long, steep and narrow; it is like two rats fighting in a hole, and the braver commander will win\", Zhao She seized the northern hill and crushed the Qin army, and was made Lord Mafu. Qin then turned to Fan Ju's policy of \"ally with the distant, attack the near\"."},{"c":"battle","old":"长平之战","mod":"山西高平","lon":112.92,"lat":35.8,"y":-260,"yt":"前262–前260","sides":"秦 胜 赵","cmd":"白起·王龁 vs 廉颇→赵括","note":"韩上党以十七城降赵，引发秦赵决战。赵以赵括代廉颇，出击被围，绝粮四十六日，赵括战死，降卒四十余万被坑杀。此后六国再无力单独与秦抗衡。","tl":"-9999:赤狄;-594:晋;-453:韩;-262:赵;-260:秦;-257:赵;-247:秦","i":102,"eold":"Battle of Changping","emod":"Gaoping, Shanxi","eyt":"262–260 BC","esides":"Qin defeated Zhao","ecmd":"Bai Qi and Wang He vs. Lian Po, then Zhao Kuo","enote":"Han's Shangdang surrendered its seventeen towns to Zhao, setting off a decisive war between Qin and Zhao. Zhao replaced Lian Po with Zhao Kuo, who attacked and was surrounded; after forty-six days without food Zhao Kuo was killed; more than four hundred thousand surrendered troops were buried alive. After this none of the six states could stand up to Qin alone."},{"c":"battle","old":"邯郸之战","mod":"河北邯郸","lon":114.56,"lat":36.66,"y":-259,"yt":"前259–前257","sides":"赵·魏·楚 胜 秦","cmd":"王陵·王龁 vs 平原君·信陵君·春申君","note":"秦乘长平之胜围邯郸近三年；平原君赴楚求救，毛遂自荐定合纵之约；魏信陵君窃符救赵，秦军大败。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-228:秦","i":103,"eold":"Battle of Handan","emod":"Handan, Hebei","eyt":"259–257 BC","esides":"Zhao, Wei and Chu defeated Qin","ecmd":"Wang Ling and Wang He vs. Lord Pingyuan, Lord Xinling and Lord Chunshen","enote":"Following up its victory at Changping, Qin besieged Handan for nearly three years; Lord Pingyuan went to Chu for help, where Mao Sui put himself forward and sealed the vertical alliance; Lord Xinling of Wei stole the tally to rescue Zhao, and the Qin army was routed."},{"c":"battle","old":"河外之战","mod":"河南三门峡一带（大致）","lon":111.35,"lat":34.72,"y":-247,"yt":"前247","sides":"魏·赵·韩·楚·燕 胜 秦","cmd":"信陵君 vs 蒙骜","note":"信陵君归魏，率五国之兵大破蒙骜于河外，追至函谷关，秦兵不敢出。","tl":"-9999:虢;-655:晋;-453:魏;-324:秦","i":104,"eold":"Battle of Hewai","emod":"around Sanmenxia, Henan (approx.)","eyt":"247 BC","esides":"Wei, Zhao, Han, Chu and Yan defeated Qin","ecmd":"Lord Xinling vs. Meng Ao","enote":"Lord Xinling returned to Wei, led the forces of five states to crush Meng Ao at Hewai, and pursued him to Hangu Pass; the Qin army dared not come out."},{"c":"battle","old":"李牧破匈奴","mod":"山西大同—河北张家口以北","lon":113.4,"lat":40.45,"y":-244,"yt":"约前244","sides":"赵 胜 匈奴","cmd":"李牧","note":"李牧守代、雁门，示弱诱敌，一战破匈奴十余万骑，灭襜褴，破东胡，降林胡，此后十余年匈奴不敢近赵边。","tl":"-9999:;-300:赵;-222:秦","i":105,"eold":"Li Mu crushes the Xiongnu","emod":"N of the Datong (Shanxi) – Zhangjiakou (Hebei) line","eyt":"c. 244 BC","esides":"Zhao defeated the Xiongnu","ecmd":"Li Mu","enote":"Guarding Dai and Yanmen, Li Mu feigned weakness to lure the enemy, crushed more than a hundred thousand Xiongnu horsemen in a single battle, destroyed the Chanlan, broke the Donghu and received the surrender of the Linhu; for more than ten years afterwards the Xiongnu dared not approach Zhao's frontier."},{"c":"battle","old":"蕞之战","mod":"陕西西安临潼北","lon":109.25,"lat":34.42,"y":-241,"yt":"前241","sides":"秦 胜 赵·楚·魏·燕·韩","cmd":"庞煖","note":"山东诸国最后一次合纵，由赵将庞煖统率，攻至蕞地，距咸阳不远，终败还。楚因此徙都寿春。","tl":"-9999:周;-771:西戎;-687:秦","i":106,"eold":"Battle of Zui","emod":"N of Lintong, Xi'an, Shaanxi","eyt":"241 BC","esides":"Qin defeated Zhao, Chu, Wei, Yan and Han","ecmd":"Pang Nuan","enote":"The last vertical alliance of the states east of the mountains, led by the Zhao general Pang Nuan, reached Zui, not far from Xianyang, but was finally defeated and turned back. As a result Chu moved its capital to Shouchun."},{"c":"battle","old":"肥之战","mod":"河北晋州西","lon":114.97,"lat":38.05,"y":-233,"yt":"前233","sides":"赵 胜 秦","cmd":"李牧 vs 桓齮","note":"李牧大破秦军于肥，桓齮败走（一说被杀），李牧封武安君。","tl":"-9999:白狄;-520:晋;-453:赵;-350:中山;-296:赵;-228:秦","i":107,"eold":"Battle of Fei","emod":"W of Jinzhou, Hebei","eyt":"233 BC","esides":"Zhao defeated Qin","ecmd":"Li Mu vs. Huan Yi","enote":"Li Mu crushed the Qin army at Fei; Huan Yi fled (one view: was killed), and Li Mu was made Lord Wu'an."},{"c":"battle","old":"番吾之战","mod":"河北平山南","lon":114.05,"lat":38.18,"y":-232,"yt":"前232","sides":"赵 胜 秦","cmd":"李牧","note":"秦分兵两路攻赵，李牧再破秦军于番吾，南拒韩、魏。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":108,"eold":"Battle of Powu","emod":"S of Pingshan, Hebei","eyt":"232 BC","esides":"Zhao defeated Qin","ecmd":"Li Mu","enote":"Qin attacked Zhao along two routes; Li Mu defeated the Qin army again at Powu and held off Han and Wei in the south."},{"c":"battle","old":"秦破赵","mod":"河北邯郸南","lon":114.4,"lat":36.5,"y":-229,"yt":"前229–前228","sides":"秦 胜 赵","cmd":"王翦·杨端和 vs 赵葱·颜聚","note":"秦用反间，赵王迁杀李牧；王翦出井陉，杨端和攻邯郸，大破赵军，虏赵王迁。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-228:秦","i":109,"eold":"Qin crushes Zhao","emod":"S of Handan, Hebei","eyt":"229–228 BC","esides":"Qin defeated Zhao","ecmd":"Wang Jian and Yang Duanhe vs. Zhao Cong and Yan Ju","enote":"Qin sowed discord and Qian, king of Zhao, had Li Mu killed; Wang Jian came out through the Jingxing Pass and Yang Duanhe attacked Handan, crushing the Zhao army and capturing him."},{"c":"battle","old":"易水之战","mod":"河北易县","lon":115.38,"lat":39.2,"y":-227,"yt":"前227","sides":"秦 胜 燕·代","cmd":"王翦·辛胜","note":"荆轲刺秦失败后，秦大举伐燕，破燕代联军于易水之西，次年（前226）拔蓟。","tl":"-9999:燕;-226:秦","i":110,"eold":"Battle of the Yi River","emod":"Yi County, Hebei","eyt":"227 BC","esides":"Qin defeated Yan and Dai","ecmd":"Wang Jian and Xin Sheng","enote":"After Jing Ke's failed attempt on the king of Qin, Qin invaded Yan in force and defeated the allied Yan and Dai armies west of the Yi River; the next year (226 BC) it took Ji."},{"c":"battle","old":"大梁之战","mod":"河南开封","lon":114.46,"lat":34.73,"y":-225,"yt":"前225","sides":"秦 胜 魏","cmd":"王贲","note":"王贲引黄河、鸿沟之水灌大梁，三月城坏，魏王假降，魏亡。","tl":"-9999:东虢;-767:郑;-375:魏;-225:秦","i":111,"eold":"Battle of Daliang","emod":"Kaifeng, Henan","eyt":"225 BC","esides":"Qin defeated Wei","ecmd":"Wang Ben","enote":"Wang Ben flooded Daliang with water from the Yellow River and the Honggou Canal; after three months the walls gave way, Jia, king of Wei, surrendered, and Wei fell."},{"c":"battle","old":"城父之战","mod":"安徽亳州东南","lon":116.08,"lat":33.58,"y":-224,"yt":"前224","sides":"楚 胜 秦","cmd":"项燕 vs 李信·蒙恬","note":"李信以二十万众伐楚，项燕尾随三日三夜不顿舍，大破之于城父，秦军败走。","tl":"-9999:陈;-600:楚;-533:许;-529:楚;-223:秦","i":112,"eold":"Battle of Chengfu","emod":"SE of Bozhou, Anhui","eyt":"224 BC","esides":"Chu defeated Qin","ecmd":"Xiang Yan vs. Li Xin and Meng Tian","enote":"Li Xin invaded Chu with two hundred thousand men; Xiang Yan followed him for three days and three nights without stopping to camp, and crushed him at Chengfu; the Qin army fled."},{"c":"battle","old":"蕲南之战","mod":"安徽宿州东南","lon":117.15,"lat":33.45,"y":-223,"yt":"前223","sides":"秦 胜 楚","cmd":"王翦·蒙武 vs 项燕","note":"王翦率六十万众坚壁不战，待楚军东撤时追击，大破楚军于蕲南，项燕死（一说自杀）；其后虏楚王负刍（各篇所记先后不一）。","tl":"-9999:宋;-431:楚;-223:秦","i":113,"eold":"Battle of Qinan","emod":"SE of Suzhou, Anhui","eyt":"223 BC","esides":"Qin defeated Chu","ecmd":"Wang Jian and Meng Wu vs. Xiang Yan","enote":"Wang Jian, with six hundred thousand men, stayed behind his ramparts and would not fight; when the Chu army withdrew east he pursued it and crushed it at Qinan; Xiang Yan died (one view: killed himself); later Fuchu, king of Chu, was captured (the chapters of the Shiji differ on the order of events)."},{"c":"battle","old":"秦开却东胡","mod":"河北承德—辽宁朝阳一带","lon":119.6,"lat":41.9,"y":-300,"yt":"约前300","sides":"燕 胜 东胡","cmd":"秦开","note":"秦开曾为质于东胡，深知其情，归燕后袭破东胡，东胡却千余里；燕置五郡，筑长城自造阳至襄平。","tl":"-9999:;-300:燕;-222:秦","i":114,"eold":"Qin Kai drives back the Donghu","emod":"around Chengde, Hebei – Chaoyang, Liaoning","eyt":"c. 300 BC","esides":"Yan defeated the Donghu","ecmd":"Qin Kai","enote":"Qin Kai had once been a hostage among the Donghu and knew them well; back in Yan he routed the Donghu, who fell back more than a thousand li; Yan set up five commanderies and built a long wall from Zaoyang to Xiangping."},{"c":"battle","old":"南征百越","mod":"广西桂林—兴安一带","lon":110.35,"lat":25.0,"y":-218,"yt":"约前219–前214","sides":"秦 胜 百越（先败后胜）","cmd":"屠睢 → 任嚣·赵佗 vs 西瓯君译吁宋","note":"始皇发五十万众分五路南征百越，监禄凿渠通粮道。秦军杀西瓯君译吁宋，越人遁入丛林，夜袭秦军，杀主将屠睢，“伏尸流血数十万”（《淮南子·人间训》）。其后秦军再进，终于平定岭南。","tl":"-9999:;-214:秦","i":115,"eold":"Southern campaign against the Hundred Yue","emod":"around Guilin and Xing'an, Guangxi","eyt":"c. 219–214 BC","esides":"Qin defeated the Hundred Yue (after early defeats)","ecmd":"Tu Sui, then Ren Xiao and Zhao Tuo vs. Yixusong, lord of the Xi'ou","enote":"The First Emperor sent five hundred thousand men south along five routes against the Hundred Yue, and the censor Lu cut a canal to open a supply route. The Qin army killed Yixusong, lord of the Xi'ou, but the Yue fled into the forests, raided the Qin troops at night and killed their commander Tu Sui: \"corpses lay and blood flowed, several hundred thousand\" (Huainanzi, \"Renjian xun\"). Afterwards the Qin army advanced again and finally pacified Lingnan."},{"c":"battle","old":"平定岭南","mod":"广东广州","lon":113.4,"lat":23.25,"y":-214,"yt":"前214","sides":"秦 胜 百越","cmd":"任嚣·赵佗","note":"任嚣、赵佗率军平定岭南，置南海、桂林、象郡，徙中原罪人五十万戍守。秦末任嚣死，赵佗割据岭南，建南越国。","tl":"-9999:;-214:秦","i":116,"eold":"Pacification of Lingnan","emod":"Guangzhou, Guangdong","eyt":"214 BC","esides":"Qin defeated the Hundred Yue","ecmd":"Ren Xiao and Zhao Tuo","enote":"Ren Xiao and Zhao Tuo led the army that pacified Lingnan; the Nanhai, Guilin and Xiang commanderies were set up and five hundred thousand convicts from the Central Plains were moved there as garrison. When Ren Xiao died at the end of Qin, Zhao Tuo took Lingnan for himself and founded the kingdom of Nanyue."},{"c":"battle","old":"北击匈奴","mod":"内蒙古鄂尔多斯一带（河南地）","lon":109.1,"lat":39.75,"y":-215,"yt":"前215","sides":"秦 胜 匈奴","cmd":"蒙恬 vs 头曼单于","note":"始皇巡北边后，遣蒙恬率三十万众北击匈奴，尽取河南地（河套以南），匈奴头曼单于北徙。次年置九原郡，自榆中并河以东设四十四县，“因河为塞”。","tl":"-9999:;-215:秦","i":117,"eold":"Northern campaign against the Xiongnu","emod":"around Ordos, Inner Mongolia (Henandi)","eyt":"215 BC","esides":"Qin defeated the Xiongnu","ecmd":"Meng Tian vs. Touman Chanyu","enote":"After touring the northern frontier, the First Emperor sent Meng Tian with three hundred thousand men against the Xiongnu; he took all Henandi (south of the Hetao bend), and Touman Chanyu moved north. The next year Jiuyuan Commandery was set up and forty-four counties were established from Yuzhong east along the He, \"using the river as a barrier\"."},{"c":"battle","old":"取高阙·北假","mod":"内蒙古乌拉特前旗—狼山一带","lon":108.3,"lat":41.0,"y":-213,"yt":"前213","sides":"秦 胜 匈奴","cmd":"蒙恬","note":"蒙恬渡河取高阙、阳山、北假中，筑亭障以逐戎人，徙谪实之初县。","tl":"-9999:;-213:秦","i":118,"eold":"Capture of Gaoque and Beijia","emod":"Urad Front Banner – Lang Mountains, Inner Mongolia","eyt":"213 BC","esides":"Qin defeated the Xiongnu","ecmd":"Meng Tian","enote":"Meng Tian crossed the He and took Gaoque, the Yang Mountains and Beijia, building watchtowers and stockades to drive out the Rong, and moved banished convicts there to fill the new counties."},{"c":"battle","old":"楚威王败越","mod":"江淮之间（大致）","lon":118.95,"lat":32.3,"y":-333,"yt":"前334/前333（《史记》《通鉴》）","sides":"楚 胜 越","cmd":"楚威王 vs 越王无疆","note":"据《史记·越世家》，越王无疆北伐齐，齐使说之转而伐楚，楚威王大败越，并“北破齐于徐州”（前333）。传统以此为越亡之年；但前312 越王仍遣使献舟于魏，故今多认为此役楚只取得江淮间部分越地，越国并未就此灭亡。","tl":"-9999:淮夷;-540:吴;-473:越;-333:楚;-223:秦","i":119,"eold":"King Wei of Chu defeats Yue","emod":"between the Yangtze and the Huai (approx.)","eyt":"334/333 BC (Shiji, Zizhi Tongjian)","esides":"Chu defeated Yue","ecmd":"King Wei of Chu vs. Wujiang, king of Yue","enote":"According to the Yue chapter of the Shiji, Wujiang, king of Yue, marched north against Qi; an envoy from Qi persuaded him to turn against Chu instead, and King Wei of Chu routed Yue and also \"crushed Qi at Xuzhou in the north\" (333 BC). Tradition takes this as the year Yue fell; but in 312 BC the king of Yue still sent envoys to present boats to Wei, so it is now widely held that in this battle Chu took only part of Yue's lands between the Yangtze and the Huai, and that Yue did not fall."},{"c":"battle","old":"楚灭越","mod":"江苏苏州一带","lon":120.3,"lat":31.12,"y":-306,"yt":"约前306（杨宽说；一说前307）","sides":"楚 胜 越","cmd":"楚怀王·召滑 vs 越王无疆","note":"楚怀王派召滑入越行间，“内行章义之难，越国乱，故楚南塞厉门而郡江东”（《史记·甘茂列传》范蜎语）。楚乘乱攻越，杀越王无疆，尽取故吴地至浙江，设江东郡。越由此分崩，诸族子“或为王，或为君”，服朝于楚。","tl":"-9999:;-560:吴;-473:越;-306:楚;-222:秦","i":120,"eold":"Chu conquest of Yue","emod":"around Suzhou, Jiangsu","eyt":"c. 306 BC (Yang Kuan; or 307 BC)","esides":"Chu defeated Yue","ecmd":"King Huai of Chu and Shao Hua vs. Wujiang, king of Yue","enote":"King Huai of Chu sent Shao Hua into Yue to sow discord: \"within, he stirred up the troubles of Zhangyi, and Yue fell into chaos; therefore Chu closed Limen in the south and made Jiangdong a commandery\" (Fan Yuan's words, biography of Gan Mao in the Shiji). Chu attacked Yue in the turmoil, killed Wujiang, king of Yue, took all the old lands of Wu up to the Zhe River, and set up Jiangdong Commandery. Yue broke apart, and its princes, \"some becoming kings and some lords\", submitted and paid court to Chu."},{"c":"battle","old":"姑苏之围","mod":"江苏苏州","lon":120.58,"lat":31.33,"y":-473,"yt":"前475–前473","sides":"越 胜 吴","cmd":"勾践 vs 夫差","note":"越军围吴都三年，夫差请和不许，自刎而死，临终“蔽其面”，言无面目见伍子胥于地下。越尽有吴地，北上会诸侯于徐州称霸。","tl":"-9999:吴;-473:越;-306:楚;-222:秦","i":121,"eold":"Siege of Gusu","emod":"Suzhou, Jiangsu","eyt":"475–473 BC","esides":"Yue defeated Wu","ecmd":"Goujian vs. Fuchai","enote":"The Yue army besieged the Wu capital for three years. Fuchai's plea for peace was refused, and he cut his own throat, \"covering his face\" as he died and saying he could not face Wu Zixu in the underworld. Yue took all of Wu's land and went north to meet the lords at Xuzhou as hegemon."},{"c":"battle","old":"魏灭中山","mod":"河北定州一带","lon":114.9,"lat":38.45,"y":-406,"yt":"前408–前406","sides":"魏 胜 中山","cmd":"乐羊·吴起","note":"魏文侯借道于赵，遣乐羊伐中山，三年乃克，乐羊“食子之羹”以示无私；魏以太子击守中山，约前380 中山复国。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":122,"eold":"Wei conquest of Zhongshan","emod":"around Dingzhou, Hebei","eyt":"408–406 BC","esides":"Wei defeated Zhongshan","ecmd":"Yue Yang and Wu Qi","enote":"Marquis Wen of Wei obtained passage through Zhao and sent Yue Yang against Zhongshan, which fell only after three years; Yue Yang \"drank the soup made from his son\" to show his selfless loyalty. Wei put Crown Prince Ji in charge of Zhongshan; Zhongshan was restored c. 380 BC."},{"c":"battle","old":"吴起拔河西","mod":"陕西大荔—澄城一带","lon":109.9,"lat":35.05,"y":-408,"yt":"前409–前408","sides":"魏 胜 秦","cmd":"吴起","note":"吴起率魏军攻秦，拔临晋、元里等五城，筑城于洛水之东，尽取河西之地；秦退守洛水，“堑洛，城重泉”以御魏。","tl":"-9999:大荔;-461:秦;-408:魏;-330:秦","i":123,"eold":"Wu Qi takes Hexi","emod":"around Dali and Chengcheng, Shaanxi","eyt":"409–408 BC","esides":"Wei defeated Qin","ecmd":"Wu Qi","enote":"Wu Qi led the Wei army against Qin, took five towns including Linjin and Yuanli, built walls east of the Luo River and seized all of Hexi. Qin fell back to hold the Luo, \"digging a moat along the Luo and walling Chongquan\" to keep Wei out."},{"c":"battle","old":"廪丘之战","mod":"山东郓城西北（一说河南范县东）","lon":115.75,"lat":35.72,"y":-405,"yt":"前405","sides":"赵·魏·韩 胜 齐","cmd":"翟角·孔屑 vs 田布","note":"齐公孙会以廪丘叛归赵，齐田布围之；三晋救廪丘，大败齐军于龙泽（《竹书纪年》），次年三晋伐齐入长城（骉羌钟铭）。","tl":"-9999:鲁;-408:齐;-242:秦","i":124,"eold":"Battle of Linqiu","emod":"NW of Yuncheng, Shandong (one view: E of Fan County, Henan)","eyt":"405 BC","esides":"Zhao, Wei and Han defeated Qi","ecmd":"Zhai Jiao and Kong Xie vs. Tian Bu","enote":"Gongsun Hui of Qi rebelled and went over to Zhao with Linqiu, and Tian Bu of Qi besieged the town. The three Jin states came to its relief and routed the Qi army at Long Marsh (Bamboo Annals); the next year they invaded Qi and pushed through the Qi Long Wall (inscription on the Biaoqiang bells)."},{"c":"battle","old":"浊泽之战","mod":"山西运城西南（一说河南长葛）","lon":111.05,"lat":35.05,"y":-369,"yt":"前369","sides":"韩·赵 胜 魏","cmd":"韩懿侯·赵成侯 vs 魏罃","note":"魏武侯死，公中缓与魏罃争立，韩、赵乘乱攻魏，大败魏军于浊泽，围魏罃；因两国意见不合而各自撤兵，魏得不亡，魏罃即位，是为惠王。","tl":"-9999:晋;-745:曲沃;-678:晋;-453:魏;-286:秦","i":125,"eold":"Battle of Zhuo Marsh","emod":"SW of Yuncheng, Shanxi (one view: Changge, Henan)","eyt":"369 BC","esides":"Han and Zhao defeated Wei","ecmd":"Marquis Yi of Han and Marquis Cheng of Zhao vs. Wei Ying","enote":"When Marquis Wu of Wei died, Gongzhong Huan and Wei Ying fought over the succession. Han and Zhao took advantage of the turmoil to attack Wei, routed the Wei army at Zhuo Marsh and surrounded Wei Ying; but the two states disagreed and each withdrew, so Wei survived, and Wei Ying took the throne as King Hui."},{"c":"battle","old":"浍北之战","mod":"山西翼城一带","lon":111.65,"lat":35.72,"y":-362,"yt":"前362","sides":"魏 胜 韩·赵","cmd":"公叔痤","note":"魏相公叔痤败韩、赵联军于浍水之北，擒赵将乐祚；魏惠王郊迎，赏田百万，公叔痤辞让，归功于吴起之教。","tl":"-9999:晋;-376:魏;-290:秦","i":126,"eold":"Battle of Kuaibei","emod":"around Yicheng, Shanxi","eyt":"362 BC","esides":"Wei defeated Han and Zhao","ecmd":"Gongshu Cuo","enote":"Gongshu Cuo, chancellor of Wei, defeated the allied Han and Zhao armies north of the Kuai River and captured the Zhao general Yue Zuo. King Hui of Wei came out to the suburbs to greet him and rewarded him with a million mu of land, but Gongshu Cuo declined, crediting the victory to Wu Qi's training."},{"c":"battle","old":"少梁之战","mod":"陕西韩城南","lon":110.45,"lat":35.5,"y":-362,"yt":"前362","sides":"秦 胜 魏","cmd":"秦献公 vs 公叔痤","note":"秦献公败魏于少梁，俘魏将公叔痤（一说魏太子），取庞。继石门之胜后，秦开始反攻河西。","tl":"-9999:梁;-641:秦;-617:晋;-453:魏;-330:秦","i":127,"eold":"Battle of Shaoliang","emod":"S of Hancheng, Shaanxi","eyt":"362 BC","esides":"Qin defeated Wei","ecmd":"Duke Xian of Qin vs. Gongshu Cuo","enote":"Duke Xian of Qin defeated Wei at Shaoliang, captured the Wei general Gongshu Cuo (one view: the crown prince of Wei) and took Pang. Following the victory at Shimen, Qin began its counteroffensive in Hexi."},{"c":"pass","old":"函谷关","mod":"河南灵宝王垛村","lon":110.91,"lat":34.63,"note":"秦东大门，“崤函之固”。前318、前241 合纵之师攻秦皆受阻于此；前296 齐韩魏攻入函谷（前298 起兵）。","tl":"-9999:虢;-655:晋;-453:魏;-330:秦","i":128,"eold":"Hangu Pass","emod":"Wangduo Village, Lingbao, Henan","enote":"Qin's eastern gate, the \"stronghold of Xiao and Hangu\". The allied armies that attacked Qin in 318 and 241 BC were both stopped here; in 296 BC Qi, Han and Wei broke through Hangu (having raised their armies in 298 BC)."},{"c":"pass","old":"武关","mod":"陕西丹凤武关镇","lon":110.7,"lat":33.56,"note":"秦南大门，通南阳、江汉。前299 楚怀王入武关会秦昭王，被扣留，终客死于秦。","tl":"-9999:西戎;-623:秦","i":129,"eold":"Wu Pass","emod":"Wuguan Town, Danfeng, Shaanxi","enote":"Qin's southern gate, leading to Nanyang and the Yangtze–Han region. In 299 BC King Huai of Chu went through the Wu Pass to meet King Zhao of Qin, was detained, and died while detained in Qin."},{"c":"pass","old":"萧关","mod":"宁夏固原东南","lon":106.35,"lat":35.93,"note":"关中西北门户，扼泾水上游通道，防御义渠与北方游牧。","tl":"-9999:义渠;-272:秦","i":130,"eold":"Xiao Pass","emod":"SE of Guyuan, Ningxia","enote":"The northwestern gateway to Guanzhong, commanding the route along the upper Jing River; a defence against Yiqu and the northern nomads."},{"c":"pass","old":"散关","mod":"陕西宝鸡南","lon":106.97,"lat":34.23,"note":"大散关，秦岭陈仓道北口，入汉中、巴蜀的孔道之一。","tl":"-9999:周;-771:西戎;-762:秦","i":131,"eold":"San Pass","emod":"S of Baoji, Shaanxi","enote":"The Great San Pass, at the northern end of the Chencang Road through the Qinling, one of the routes into Hanzhong and Ba–Shu."},{"c":"pass","old":"峣关","mod":"陕西蓝田东南","lon":109.42,"lat":34.07,"note":"即蓝田关，武关道进入关中的最后一道关口。","tl":"-9999:周;-771:西戎;-687:秦","i":132,"eold":"Yao Pass","emod":"SE of Lantian, Shaanxi","enote":"Also called the Lantian Pass, the last pass on the Wu Pass road before Guanzhong."},{"c":"pass","old":"井陉","mod":"河北井陉西","lon":114.1,"lat":38.07,"note":"太行八陉之五，连通赵都与太原盆地。秦灭赵时王翦大军由此东出。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":133,"eold":"Jingxing Pass","emod":"W of Jingxing, Hebei","enote":"The fifth of the Eight Passes of the Taihang, linking the Zhao capital with the Taiyuan basin. Wang Jian's army came out this way when Qin destroyed Zhao."},{"c":"pass","old":"句注塞","mod":"山西代县西北","lon":112.85,"lat":39.15,"note":"即后世雁门关一带，赵国北境要塞。","tl":"-9999:;-453:赵;-222:秦","i":134,"eold":"Gouzhu Pass","emod":"NW of Dai County, Shanxi","enote":"Around the later Yanmen Pass; a fortress on Zhao's northern frontier."},{"c":"pass","old":"居庸塞","mod":"北京昌平北","lon":116.07,"lat":40.29,"note":"太行八陉之八（军都陉），燕国北方门户。","tl":"-9999:燕;-226:秦","i":135,"eold":"Juyong Pass","emod":"N of Changping, Beijing","enote":"The eighth of the Eight Passes of the Taihang (Jundu Pass), Yan's northern gateway."},{"c":"pass","old":"飞狐陉","mod":"河北涞源—蔚县间","lon":114.68,"lat":39.6,"note":"太行八陉之七，连通代地与燕、赵腹地。","tl":"-9999:;-457:晋;-453:赵;-222:秦","i":136,"eold":"Feihu Pass","emod":"between Laiyuan and Yu County, Hebei","enote":"The seventh of the Eight Passes of the Taihang, linking Dai with the heartlands of Yan and Zhao."},{"c":"pass","old":"滏口陉","mod":"河北邯郸峰峰西","lon":114.2,"lat":36.52,"note":"太行八陉之四，邯郸西出上党的孔道。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-228:秦","i":137,"eold":"Fukou Pass","emod":"W of Fengfeng, Handan, Hebei","enote":"The fourth of the Eight Passes of the Taihang, the route west from Handan to Shangdang."},{"c":"pass","old":"太行陉","mod":"山西晋城南天井关","lon":112.95,"lat":35.37,"note":"太行八陉之二（羊肠坂道），野王北上上党的要路。前262 秦取野王，截断上党南路。","tl":"-9999:赤狄;-594:晋;-453:韩;-262:赵;-260:秦;-257:赵;-247:秦","i":138,"eold":"Taihang Pass","emod":"Tianjing Pass, S of Jincheng, Shanxi","enote":"The second of the Eight Passes of the Taihang (the Yangchang slope road), the main route north from Yewang to Shangdang. In 262 BC Qin took Yewang and cut Shangdang's southern road."},{"c":"pass","old":"轵关陉","mod":"河南济源东南","lon":112.45,"lat":35.12,"note":"太行八陉之一，河内西通河东。","tl":"-9999:周;-635:晋;-453:魏;-289:秦","i":139,"eold":"Zhiguan Pass","emod":"SE of Jiyuan, Henan","enote":"The first of the Eight Passes of the Taihang, leading west from Henei to Hedong."},{"c":"pass","old":"蒲阪津","mod":"山西永济西","lon":110.28,"lat":34.9,"note":"河东与关中之间的黄河渡口（蒲津）。","tl":"-9999:古魏;-661:晋;-453:魏;-290:秦","i":140,"eold":"Puban Ford","emod":"W of Yongji, Shanxi","enote":"Yellow River ford between Hedong and Guanzhong (Pujin)."},{"c":"pass","old":"孟津","mod":"河南洛阳孟津区东北","lon":112.62,"lat":34.84,"note":"洛阳北的黄河渡口，相传武王伐纣于此会盟诸侯。","tl":"-9999:周;-635:晋;-453:魏;-289:秦","i":141,"eold":"Mengjin Ford","emod":"NE of Mengjin District, Luoyang, Henan","enote":"Yellow River ford north of Luoyang; by tradition King Wu of Zhou gathered the lords here in his campaign against King Zhou of Shang."},{"c":"pass","old":"成皋","mod":"河南荥阳汜水镇","lon":113.2,"lat":34.86,"note":"即后世虎牢关，洛阳东出的咽喉，韩之要塞。","tl":"-9999:东虢;-767:郑;-375:韩;-249:秦","i":142,"eold":"Chenggao","emod":"Sishui Town, Xingyang, Henan","enote":"The later Hulao Pass, the gateway east from Luoyang; a Han stronghold."},{"c":"pass","old":"伊阙","mod":"河南洛阳龙门","lon":112.47,"lat":34.56,"note":"两山对峙如阙，伊水中流，洛阳南门。","tl":"-9999:周;-256:秦","i":143,"eold":"Yique","emod":"Longmen, Luoyang, Henan","enote":"Two hills facing each other like gate towers with the Yi River flowing between: Luoyang's southern gate."},{"c":"pass","old":"冥阸","mod":"河南信阳南（平靖关一带）","lon":114.0,"lat":31.83,"note":"又作黾塞、冥厄，楚国北境要塞，“义阳三关”之一。","tl":"-9999:息;-680:楚;-223:秦","i":144,"eold":"Ming'e Pass","emod":"S of Xinyang, Henan (around Pingjing Pass)","enote":"Also written Mengsai, or Ming'e with different characters; a fortress on Chu's northern frontier, one of the \"Three Passes of Yiyang\"."},{"c":"pass","old":"扞关","mod":"重庆奉节东（一说湖北长阳）","lon":109.55,"lat":31.0,"note":"楚西拒巴蜀之关。","tl":"-9999:巴;-316:秦","i":145,"eold":"Han Pass","emod":"E of Fengjie, Chongqing (one view: Changyang, Hubei)","enote":"Chu's pass against Ba and Shu in the west."},{"c":"pass","old":"白马津","mod":"河南滑县东北","lon":114.55,"lat":35.6,"note":"濮阳西南的古黄河要津。","tl":"-9999:卫;-242:秦","i":146,"eold":"Baima Ford","emod":"NE of Hua County, Henan","enote":"Important ford on the ancient Yellow River SW of Puyang."},{"c":"pass","old":"高阙","mod":"内蒙古乌拉特后旗东南","lon":107.35,"lat":41.15,"note":"阴山缺口，赵长城西端要塞。","tl":"-9999:","i":147,"eold":"Gaoque","emod":"SE of Urad Rear Banner, Inner Mongolia","enote":"A gap in the Yin Mountains, the fortress at the western end of the Zhao Northern Long Wall."},{"c":"city","old":"邺","mod":"河北临漳邺城遗址","lon":114.58,"lat":36.33,"note":"魏文侯时西门豹为邺令，破“河伯娶妇”陋俗，开引漳十二渠，邺遂富庶。战国大部分时间属魏，前239 魏割邺予赵，前236 秦王翦等攻赵取邺。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:魏;-239:赵;-236:秦","i":148,"eold":"Ye","emod":"Yecheng ruins, Linzhang, Hebei","enote":"Under Marquis Wen of Wei, Ximen Bao as magistrate of Ye ended the custom of \"brides for the River Lord\" and dug twelve canals from the Zhang River, making Ye prosperous. For most of the Warring States it belonged to Wei; in 239 BC Wei ceded Ye to Zhao, and in 236 BC Wang Jian and other Qin generals attacked Zhao and took Ye."},{"c":"city","old":"陶","mod":"山东菏泽定陶区","lon":115.57,"lat":35.07,"note":"“天下之中”，诸侯四通，范蠡居此经商致富，号陶朱公。秦相魏冉封于此。","tl":"-9999:曹;-487:宋;-286:齐;-284:秦;-254:魏;-242:秦","i":149,"eold":"Tao","emod":"Dingtao District, Heze, Shandong","enote":"\"The centre of the realm\", with roads to every state; Fan Li settled here, grew rich in trade and was called Lord Zhu of Tao. The Qin chancellor Wei Ran was enfeoffed here."},{"c":"city","old":"宛","mod":"河南南阳","lon":112.53,"lat":33.0,"note":"南阳盆地中心，楚国冶铁重镇，“宛钜铁釶，惨如蜂虿”。前272 秦置南阳郡。","tl":"-9999:申;-688:楚;-301:韩;-291:秦","i":150,"eold":"Wan","emod":"Nanyang, Henan","enote":"Centre of the Nanyang basin and a major iron-working town of Chu: \"the steel spears of Wan sting like bees and scorpions\". Qin set up Nanyang Commandery in 272 BC."},{"c":"city","old":"上蔡","mod":"河南上蔡","lon":114.26,"lat":33.26,"note":"原蔡国都城，楚之北方重镇；李斯故里。","tl":"-9999:蔡;-531:楚;-224:秦","i":151,"eold":"Shangcai","emod":"Shangcai, Henan","enote":"Former capital of the state of Cai and a key northern town of Chu; home town of Li Si."},{"c":"city","old":"即墨","mod":"山东平度东南","lon":120.05,"lat":36.6,"note":"与莒同为齐国在乐毅破齐后唯一坚守的两城，田单由此复国。齐“五都”之一。","tl":"-9999:莱;-567:齐;-221:秦","i":152,"eold":"Jimo","emod":"SE of Pingdu, Shandong","enote":"With Ju, one of the only two Qi towns that held out after Yue Yi crushed Qi; Tian Dan restored the state from here. One of Qi's \"Five Capitals\"."},{"c":"city","old":"莒","mod":"山东莒县","lon":118.83,"lat":35.58,"note":"齐湣王出奔之地；齐襄王即位于莒，坚守五年。齐“五都”之一，南面防楚。","tl":"-9999:莒;-431:楚;-386:齐;-221:秦","i":153,"eold":"Ju","emod":"Ju County, Shandong","enote":"Where King Min of Qi fled; King Xiang of Qi took the throne at Ju and held it for five years. One of Qi's \"Five Capitals\", guarding the south against Chu."},{"c":"city","old":"彭城","mod":"江苏徐州","lon":117.18,"lat":34.26,"note":"宋国东部重镇（一说宋后期迁都于此），宋亡后入楚。","tl":"-9999:宋;-286:齐;-284:楚;-223:秦","i":154,"eold":"Pengcheng","emod":"Xuzhou, Jiangsu","enote":"Key town in eastern Song (one view: Song moved its capital here late in its history); passed to Chu after Song fell."},{"c":"city","old":"薛","mod":"山东滕州东南","lon":117.12,"lat":34.8,"note":"孟尝君田文封邑，养士数千，“鸡鸣狗盗”皆其门客。","tl":"-9999:薛;-351:齐;-221:秦","i":155,"eold":"Xue","emod":"SE of Tengzhou, Shandong","enote":"Fief of Lord Mengchang, Tian Wen, who kept several thousand retainers, among them the men \"who crowed like cocks and stole like dogs\"."},{"c":"city","old":"上党","mod":"山西长子","lon":112.87,"lat":36.12,"note":"韩上党郡（治长子一带）。前262 郡守冯亭以十七城降赵，引发长平之战。","tl":"-9999:赤狄;-594:晋;-453:韩;-262:赵;-260:秦;-257:赵;-247:秦","i":156,"eold":"Shangdang","emod":"Zhangzi, Shanxi","enote":"Han's Shangdang Commandery (seat around Zhangzi). In 262 BC its governor Feng Ting surrendered its seventeen towns to Zhao, setting off the Battle of Changping."},{"c":"city","old":"荥阳","mod":"河南荥阳","lon":113.38,"lat":34.78,"note":"河济之交，敖仓所在，鸿沟起点，中原水陆交通枢纽。","tl":"-9999:东虢;-767:郑;-375:韩;-249:秦","i":157,"eold":"Xingyang","emod":"Xingyang, Henan","enote":"Where the He and the Ji meet, site of the Ao Granary and start of the Honggou Canal; the hub of water and land transport in the Central Plains."},{"c":"city","old":"商","mod":"陕西丹凤西","lon":110.3,"lat":33.7,"note":"秦孝公封商鞅于商、於十五邑，号商君。张仪曾以“商於之地六百里”诈楚。","tl":"-9999:西戎;-623:秦","i":158,"eold":"Shang","emod":"W of Danfeng, Shaanxi","enote":"Duke Xiao of Qin enfeoffed Shang Yang with the fifteen towns of Shang and Wu, styling him Lord Shang. Zhang Yi once deceived Chu with \"six hundred li of the land of Shang and Wu\"."},{"c":"city","old":"南郑","mod":"陕西汉中","lon":107.02,"lat":33.07,"note":"汉中盆地中心，秦、蜀反复争夺：前451 秦“城南郑”，前441“南郑反”，前387 一说秦“伐蜀，取南郑”（《秦本纪》），一说“蜀取我南郑”（《六国年表》）。战国中期属蜀，前316 入秦，后为秦汉中郡治。","tl":"-9999:蜀;-451:秦;-441:蜀;-316:秦","i":159,"eold":"Nanzheng","emod":"Hanzhong, Shaanxi","enote":"Centre of the Hanzhong basin, fought over repeatedly by Qin and Shu: in 451 BC Qin \"walled Nanzheng\"; in 441 BC \"Nanzheng rebelled\"; in 387 BC, by one account Qin \"attacked Shu and took Nanzheng\" (Basic Annals of Qin in the Shiji), by another \"Shu took our Nanzheng\" (Table of the Six States in the Shiji). In the mid Warring States it belonged to Shu; it passed to Qin in 316 BC and later became the seat of Qin's Hanzhong Commandery."},{"c":"city","old":"狄道","mod":"甘肃临洮","lon":103.86,"lat":35.38,"note":"秦陇西郡治，秦昭王长城西起于此。","tl":"-9999:西戎;-384:秦","i":160,"eold":"Didao","emod":"Lintao, Gansu","enote":"Seat of Qin's Longxi Commandery, where the Long Wall of King Zhao of Qin began in the west."},{"c":"city","old":"肤施","mod":"陕西榆林东南","lon":109.8,"lat":38.0,"note":"秦上郡治；赵灭中山后曾迁中山王于肤施。","tl":"-9999:;-272:秦","i":161,"eold":"Fushi","emod":"SE of Yulin, Shaanxi","enote":"Seat of Qin's Shang Commandery; after destroying Zhongshan, Zhao moved the king of Zhongshan to Fushi."},{"c":"city","old":"云中","mod":"内蒙古托克托东北","lon":111.2,"lat":40.27,"note":"赵武灵王所置云中郡治。","tl":"-9999:;-300:赵;-222:秦","i":162,"eold":"Yunzhong","emod":"NE of Togtoh, Inner Mongolia","enote":"Seat of the Yunzhong Commandery set up by King Wuling of Zhao."},{"c":"city","old":"九原","mod":"内蒙古包头西","lon":109.84,"lat":40.6,"note":"赵武灵王拓地所至，秦时为九原郡，秦直道北端。","tl":"-9999:;-300:赵;-222:秦","i":163,"eold":"Jiuyuan","emod":"W of Baotou, Inner Mongolia","enote":"The limit of King Wuling of Zhao's conquests; under Qin, Jiuyuan Commandery and the northern end of the Qin Straight Road."},{"c":"city","old":"鄢","mod":"湖北宜城东南","lon":112.26,"lat":31.72,"note":"楚别都（鄢郢）。前279 白起引水灌城。","tl":"-9999:楚;-279:秦","i":164,"eold":"Yan","emod":"SE of Yicheng, Hubei","enote":"Secondary capital of Chu (Yan-Ying). In 279 BC Bai Qi flooded the city."},{"c":"city","old":"长沙","mod":"湖南长沙","lon":112.94,"lat":28.2,"note":"楚国南境重镇，出土楚帛书等大量楚文物；秦置长沙郡。","tl":"-9999:;-520:楚;-222:秦","i":165,"eold":"Changsha","emod":"Changsha, Hunan","enote":"Key town on Chu's southern frontier, where the Chu silk manuscript and many other Chu artefacts have been found; Qin set up Changsha Commandery."},{"c":"city","old":"广陵","mod":"江苏扬州","lon":119.43,"lat":32.4,"note":"楚怀王十年（前319）城广陵。当时长江在此附近入海，江面宽阔。","tl":"-9999:淮夷;-540:吴;-473:越;-333:楚;-223:秦","i":166,"eold":"Guangling","emod":"Yangzhou, Jiangsu","enote":"In the 10th year of King Huai of Chu (319 BC) Guangling was walled. At that time the Yangtze entered the sea near here, and the river was very wide."},{"c":"city","old":"金陵","mod":"江苏南京","lon":118.78,"lat":32.05,"note":"相传楚威王败越后置金陵邑（约前333，说出宋代方志，可靠性存疑），南京称“金陵”即源于此。","tl":"-9999:;-560:吴;-473:越;-333:楚;-222:秦","i":167,"eold":"Jinling","emod":"Nanjing, Jiangsu","enote":"By tradition King Wei of Chu set up the town of Jinling after defeating Yue (c. 333 BC; the account comes from Song-dynasty gazetteers and its reliability is doubtful); this is the origin of Nanjing's name \"Jinling\"."},{"c":"city","old":"洛阳","mod":"河南洛阳","lon":112.6,"lat":34.72,"note":"“天下之中”，周王畿所在；苏秦即洛阳人。","tl":"-9999:周;-256:秦","i":168,"eold":"Luoyang","emod":"Luoyang, Henan","enote":"\"The centre of the realm\", seat of the Zhou royal domain; Su Qin was a native of Luoyang."},{"c":"city","old":"平原","mod":"山东平原","lon":116.43,"lat":37.17,"note":"齐国西北要地；赵平原君赵胜之号，一说即取自此地（《史记正义》）；其封邑在东武城。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":169,"eold":"Pingyuan","emod":"Pingyuan, Shandong","enote":"Key place in northwestern Qi. By one view (Shiji zhengyi), the title of Lord Pingyuan, Zhao Sheng of Zhao, comes from this place; his fief was at Dongwucheng."},{"c":"city","old":"阿","mod":"山东阳谷东北","lon":116.25,"lat":36.25,"note":"齐国西部重镇，“阿、鄄之间”为孙膑出生地。齐威王所烹“阿大夫”即此地大夫；一说为齐“五都”之一（以阿代临淄）。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":170,"eold":"E","emod":"NE of Yanggu, Shandong","enote":"Key town in western Qi; Sun Bin was born \"between E and Juan\". the \"grandee of E\" boiled by King Wei of Qi was the grandee of this place; one view counts it among Qi's \"Five Capitals\" (in place of Linzi)."},{"c":"city","old":"高唐","mod":"山东高唐东","lon":116.23,"lat":36.86,"note":"齐“五都”之一，西北重镇，临古黄河以防赵。齐威王：“吾臣有盼子者，使守高唐，则赵人不敢东渔于河。”","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":171,"eold":"Gaotang","emod":"E of Gaotang, Shandong","enote":"One of Qi's \"Five Capitals\", a key northwestern town on the ancient Yellow River guarding against Zhao. King Wei of Qi: \"I have a minister called Panzi; I have him guard Gaotang, and the men of Zhao dare not come east to fish in the He.\""},{"c":"city","old":"平陆","mod":"山东汶上北","lon":116.49,"lat":35.75,"note":"齐“五都”之一，西南门户，防鲁、宋、魏。孟子至平陆，与其大夫孔距心论“凶年饥岁，子之民老羸转于沟壑”（《孟子·公孙丑下》）。","tl":"-9999:鲁;-408:齐;-284:燕;-279:齐;-221:秦","i":172,"eold":"Pinglu","emod":"N of Wenshang, Shandong","enote":"One of Qi's \"Five Capitals\", the southwestern gateway guarding against Lu, Song and Wei. Mencius came to Pinglu and told its grandee Kong Juxin, \"in years of disaster and famine, the old and weak among your people are tossed into the ditches\" (Mencius, \"Gongsun Chou II\")."},{"c":"city","old":"雍氏","mod":"河南禹州东北","lon":113.56,"lat":34.22,"note":"韩邑，在旧都阳翟东北约二十五里，当楚军出方城北上、进逼韩都新郑的要道。楚三次围雍氏：前312 楚将景翠围之，秦助韩败楚（《竹书纪年》《秦本纪》）；前307（一说前306）楚怀王怨韩在丹阳之战时不救，围雍氏五月，甘茂说秦出兵救韩，楚兵乃去（《甘茂列传》《战国策·韩策二》）；前300 韩太子婴死，公子咎与公子虮虱争立，楚围雍氏，终解围而去（《韩世家》）。","tl":"-9999:郐;-769:郑;-423:韩;-230:秦","i":173,"eold":"Yongshi","emod":"NE of Yuzhou, Henan","enote":"A Han town about twenty-five li NE of the old capital Yangzhai, on the road by which Chu armies came north out of Fangcheng to threaten the Han capital Xinzheng. Chu besieged Yongshi three times: in 312 BC the Chu general Jing Cui besieged it and Qin helped Han defeat Chu (Bamboo Annals; Basic Annals of Qin in the Shiji); in 307 BC (or 306 BC) King Huai of Chu, resenting Han's failure to help at Danyang, besieged Yongshi for five months, Gan Mao persuaded Qin to send troops to save Han, and the Chu troops left (biography of Gan Mao in the Shiji; second Han section of the Zhanguo ce); in 300 BC, after Ying, crown prince of Han, died and Prince Jiu and Prince Jishi contended for the succession, Chu besieged Yongshi and finally lifted the siege and withdrew (Han chapter of the Shiji)."},{"c":"city","old":"武遂","mod":"山西垣曲东南（一说临汾附近）","lon":111.92,"lat":35.2,"note":"韩邑，在黄河北岸，与宜阳隔河相对；“武遂地二百里”即指这一带河北之地。秦韩反复争夺：前307 秦拔宜阳后“涉河，城武遂”；前306 甘茂力主归还韩；前303 秦复取；前296 齐韩魏攻入函谷，秦“与韩河外及武遂”求和；前290 韩以“武遂地二百里”割秦（《秦本纪》《韩世家》《甘茂列传》）。地望有两说：此处按“涉河，城武遂”定在垣曲东南；《楚世家》称韩“先王墓在平阳，而秦之武遂去之七十里”，平阳在今临汾西南，故一说武遂在临汾附近。另有燕邑武遂（今河北徐水西），前243 为赵将李牧所拔，与此非一地。","tl":"-9999:赤狄;-594:晋;-453:韩;-307:秦;-306:韩;-303:秦;-296:韩;-290:秦","i":174,"eold":"Wusui","emod":"SE of Yuanqu, Shanxi (one view: near Linfen)","enote":"A Han town on the north bank of the Yellow River, facing Yiyang across the river; \"two hundred li of Wusui land\" refers to this land north of the river. Qin and Han fought over it repeatedly: in 307 BC, after taking Yiyang, Qin \"crossed the river and walled Wusui\"; in 306 BC Gan Mao urged its return to Han; in 303 BC Qin took it again; in 296 BC, after Qi, Han and Wei broke through Hangu, Qin \"gave Han Hewai and Wusui\" to make peace; in 290 BC Han ceded \"two hundred li of Wusui land\" to Qin (Basic Annals of Qin, Han chapter and biography of Gan Mao in the Shiji). There are two views of its location: here it is placed SE of Yuanqu following \"crossed the river and walled Wusui\"; the Chu chapter of the Shiji says Han's \"former kings' tombs are at Pingyang, and Qin's Wusui is seventy li from them\", and Pingyang lies SW of modern Linfen, so one view puts Wusui near Linfen. There was also a Yan town called Wusui (W of modern Xushui, Hebei), taken by the Zhao general Li Mu in 243 BC; it is not the same place."},{"c":"city","old":"东郡","mod":"河南濮阳","lon":115.1,"lat":35.62,"note":"前242 秦取魏酸枣等二十城置东郡，楔入齐、魏、赵之间，切断山东合纵的南北联系。","tl":"-9999:卫;-242:秦","i":175,"eold":"Dong Commandery","emod":"Puyang, Henan","enote":"In 242 BC Qin took Suanzao and nineteen other Wei towns and set up Dong Commandery, a wedge driven between Qi, Wei and Zhao that cut the north–south links of the vertical alliance east of the mountains."},{"c":"town","old":"郿","mod":"陕西眉县","lon":107.75,"lat":34.28,"note":"白起故里。","tl":"-9999:周;-771:西戎;-750:秦","i":176,"eold":"Mei","emod":"Mei County, Shaanxi","enote":"Home town of Bai Qi."},{"c":"town","old":"杜","mod":"陕西西安长安区","lon":108.95,"lat":34.2,"note":"秦较早设立的县之一（前687）。","tl":"-9999:周;-771:西戎;-687:秦","i":177,"eold":"Du","emod":"Chang'an District, Xi'an, Shaanxi","enote":"One of the earlier counties set up by Qin (687 BC)."},{"c":"town","old":"频阳","mod":"陕西富平东北","lon":109.18,"lat":34.9,"note":"王翦故里。","tl":"-9999:周;-771:西戎;-687:秦","i":178,"eold":"Pinyang","emod":"NE of Fuping, Shaanxi","enote":"Home town of Wang Jian."},{"c":"town","old":"邽","mod":"甘肃天水","lon":1 n":104.25,"lat":30.98,"note":"","tl":"-9999:蜀;-316:秦","i":313,"eold":"Luo","emod":"N of Guanghan, Sichuan"},{"c":"town","old":"涪","mod":"四川绵阳","lon":104.73,"lat":31.47,"note":"","tl":"-9999:蜀;-316:秦","i":314,"eold":"Fu","emod":"Mianyang, Sichuan"},{"c":"town","old":"南安","mod":"四川乐山","lon":103.76,"lat":29.55,"note":"","tl":"-9999:蜀;-316:秦","i":315,"eold":"Nan'an","emod":"Leshan, Sichuan"},{"c":"town","old":"严道","mod":"四川荥经","lon":102.85,"lat":29.8,"note":"秦徙罪人于此。","tl":"-9999:蜀;-316:秦","i":316,"eold":"Yandao","emod":"Yingjing, Sichuan","enote":"Qin sent convicts here."},{"c":"town","old":"临邛","mod":"四川邛崃","lon":103.47,"lat":30.42,"note":"秦灭蜀后张若筑城；后来卓氏在此冶铁致富。","tl":"-9999:蜀;-316:秦","i":317,"eold":"Linqiong","emod":"Qionglai, Sichuan","enote":"Walled by Zhang Ruo after the Qin conquest of Shu; later the Zhuo family grew rich here smelting iron."},{"c":"culture","old":"书同文·车同轨","mod":"陕西咸阳","lon":108.82,"lat":34.42,"y":-221,"yt":"前221","note":"统一后即“一法度衡石丈尺，车同轨，书同文字”，以小篆为标准字体，又统一货币为半两钱。","tl":"-9999:周;-771:西戎;-713:秦","i":318,"eold":"Standard script · standard axle gauge","emod":"Xianyang, Shaanxi","eyt":"221 BC","enote":"Right after unification Qin \"made uniform the laws and the standards of weight and length; carts had the same axle width, writing the same characters\", with small seal script as the standard, and the currency was unified as the banliang coin."},{"c":"culture","old":"泰山封禅","mod":"山东泰安泰山","lon":117.1,"lat":36.25,"y":-219,"yt":"前219","note":"始皇东巡，封泰山、禅梁父，并在泰山、琅琊台等地刻石颂秦德。","tl":"-9999:鲁;-408:齐;-284:燕;-279:齐;-221:秦","i":319,"eold":"Feng and Shan sacrifices at Mount Tai","emod":"Mount Tai, Tai'an, Shandong","eyt":"219 BC","enote":"On his eastern tour the First Emperor performed the Feng sacrifice on Mount Tai and the Shan sacrifice at Liangfu, and had stone inscriptions praising the virtue of Qin carved on Mount Tai, the Langya Terrace and elsewhere."},{"c":"culture","old":"博浪沙刺秦","mod":"河南原阳东南","lon":113.95,"lat":34.98,"y":-218,"yt":"前218","note":"张良为报韩仇，与力士以百二十斤铁椎狙击始皇于博浪沙，误中副车，张良亡匿下邳。","tl":"-9999:东虢;-767:郑;-375:魏;-225:秦","i":320,"eold":"Attempt on the First Emperor at Bolangsha","emod":"SE of Yuanyang, Henan","eyt":"218 BC","enote":"To avenge Han, Zhang Liang and a strongman ambushed the First Emperor at Bolangsha with an iron mallet weighing a hundred and twenty jin, but struck an attendant carriage by mistake; Zhang Liang fled into hiding at Xiapi."},{"c":"culture","old":"碣石刻辞","mod":"河北昌黎北","lon":119.25,"lat":39.78,"y":-215,"yt":"前215","note":"始皇巡碣石，刻辞称“堕坏城郭，决通川防，夷去险阻”——拆毁六国间的城郭关塞与堤防，统一后的内地长城由此废弃。","tl":"-9999:山戎;-663:燕;-226:秦","i":321,"eold":"Jieshi inscription","emod":"N of Changli, Hebei","eyt":"215 BC","enote":"On his tour to Jieshi, the First Emperor had an inscription carved saying he had \"pulled down city walls, cut through river dykes and levelled strongholds\": the walls, forts and dykes between the six states were demolished, and the interior long walls were abandoned after unification as a result."},{"c":"culture","old":"灵渠","mod":"广西兴安","lon":110.67,"lat":25.61,"y":-214,"yt":"约前219–前214","note":"监御史禄凿渠连通湘江与漓江（分水铧嘴、大小天平），沟通长江与珠江水系，为南征百越运粮。至今仍可通航。","tl":"-9999:;-385:楚;-222:秦","i":322,"eold":"Lingqu Canal","emod":"Xing'an, Guangxi","eyt":"c. 219–214 BC","enote":"The supervising censor Lu cut a canal linking the Xiang and Li rivers (with the ploughshare divider and the large and small weirs), joining the Yangtze and Pearl river systems, to carry grain for the southern campaign against the Hundred Yue. It is still navigable today."},{"c":"culture","old":"焚书坑儒","mod":"陕西咸阳","lon":108.62,"lat":34.33,"y":-213,"yt":"前213–前212","note":"淳于越请复分封，李斯驳之并建议焚《诗》《书》百家语；次年坑杀诸生四百六十余人于咸阳。","tl":"-9999:周;-771:西戎;-713:秦","i":323,"eold":"Burning of books and burying of scholars","emod":"Xianyang, Shaanxi","eyt":"213–212 BC","enote":"Chunyu Yue asked for a return to enfeoffment; Li Si rebutted him and proposed burning the Odes, the Documents and the writings of the Hundred Schools; the next year more than four hundred and sixty scholars were buried alive at Xianyang."},{"c":"culture","old":"阿房宫","mod":"陕西西安西郊","lon":108.83,"lat":34.25,"y":-212,"yt":"前212","note":"始皇以咸阳人多、先王宫廷小，在渭南上林苑营建朝宫，前殿即阿房，至秦亡未完工。","tl":"-9999:周;-771:西戎;-687:秦","i":324,"eold":"Epang Palace","emod":"western outskirts of Xi'an, Shaanxi","eyt":"212 BC","enote":"Since Xianyang was crowded and the palaces of the former kings small, the First Emperor built a court palace in the Shanglin Park south of the Wei River; its front hall was Epang, and it was still unfinished when Qin fell."},{"c":"culture","old":"骊山陵","mod":"陕西西安临潼区","lon":109.27,"lat":34.38,"y":-221,"yt":"前246–前208","note":"秦始皇陵，即位之初开始营建，统一后征发刑徒七十余万大规模扩建；陵东有兵马俑坑。","tl":"-9999:周;-771:西戎;-687:秦","i":325,"eold":"Mausoleum at Mount Li","emod":"Lintong District, Xi'an, Shaanxi","eyt":"246–208 BC","enote":"Mausoleum of the First Emperor of Qin, begun soon after he came to the throne and greatly enlarged after unification by more than seven hundred thousand conscripted convicts; the terracotta army pits lie to its east."},{"c":"culture","old":"李悝变法","mod":"山西夏县（安邑）","lon":111.35,"lat":35.02,"y":-406,"yt":"约前406","note":"魏文侯任李悝为相，“尽地力之教”，行平籴法，著《法经》六篇，为战国变法之先声。","tl":"-9999:虢;-658:晋;-453:魏;-324:秦","i":326,"eold":"Li Kui's reforms","emod":"Xia County, Shanxi (Anyi)","eyt":"c. 406 BC","enote":"Marquis Wen of Wei made Li Kui chancellor; Li Kui taught \"making full use of the land's strength\", introduced the price-stabilising grain purchases and wrote the six-chapter Canon of Laws: the forerunner of the Warring States reforms."},{"c":"culture","old":"西门豹治邺","mod":"河北临漳","lon":114.5,"lat":36.25,"y":-420,"yt":"约前420","note":"西门豹破除“河伯娶妇”，发民凿渠十二条引漳水灌溉，邺地大治。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:魏;-239:赵;-236:秦","i":327,"eold":"Ximen Bao governs Ye","emod":"Linzhang, Hebei","eyt":"c. 420 BC","enote":"Ximen Bao ended the custom of \"brides for the River Lord\" and had the people dig twelve canals to irrigate the land with water from the Zhang River; Ye was well governed."},{"c":"culture","old":"吴起变法","mod":"湖北荆州（郢）","lon":112.3,"lat":30.5,"y":-386,"yt":"约前386–前381","note":"楚悼王任吴起为令尹，“明法审令，捐不急之官，废公族疏远者”。悼王死，吴起被射杀于王尸之侧。","tl":"-9999:楚;-506:吴;-505:楚;-278:秦","i":328,"eold":"Wu Qi's reforms","emod":"Jingzhou, Hubei (Ying)","eyt":"c. 386–381 BC","enote":"King Dao of Chu made Wu Qi his chief minister; Wu Qi \"made the laws clear and the orders precise, cut unnecessary offices, and stripped distant members of the royal clan of their status\". When King Dao died, Wu Qi was shot dead beside the king's body."},{"c":"culture","old":"商鞅变法","mod":"陕西西安阎良区（栎阳）","lon":109.33,"lat":34.76,"y":-356,"yt":"前356、前350","note":"秦孝公任商鞅，两次变法：连坐告奸、奖励耕战、军功爵、废井田开阡陌、普遍推行县制、统一度量衡。秦由此富强。","tl":"-9999:周;-771:西戎;-687:秦","i":329,"eold":"Shang Yang's reforms","emod":"Yanliang District, Xi'an, Shaanxi (Yueyang)","eyt":"356 and 350 BC","enote":"Duke Xiao of Qin employed Shang Yang, who carried out two rounds of reform: collective responsibility and denunciation, rewards for farming and fighting, ranks for military merit, abolition of the well-field system and opening of the field boundaries, counties throughout the state, and unified weights and measures. Qin became rich and strong."},{"c":"culture","old":"申不害相韩","mod":"河南新郑","lon":113.85,"lat":34.45,"y":-355,"yt":"前355–前337","note":"申不害以“术”治韩，“内修政教，外应诸侯，十五年，终申子之身，国治兵强”。","tl":"-9999:郐;-769:郑;-375:韩;-230:秦","i":330,"eold":"Shen Buhai, chancellor of Han","emod":"Xinzheng, Henan","eyt":"355–337 BC","enote":"Shen Buhai governed Han by \"technique\": \"at home he reformed government and teaching, abroad he dealt with the lords; for fifteen years, until Shenzi's death, the state was well ordered and its army strong\"."},{"c":"culture","old":"稷下学宫","mod":"山东淄博临淄区","lon":118.45,"lat":36.8,"y":-374,"yt":"约前374 始建","note":"齐国在都城稷门外设学宫，孟子、荀子（三为祭酒）、邹衍、淳于髡、慎到等云集，“不治而议论”，百家争鸣的中心。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":331,"eold":"Jixia Academy","emod":"Linzi District, Zibo, Shandong","eyt":"founded c. 374 BC","enote":"Qi set up an academy outside the Ji Gate of its capital; Mencius, Xunzi (three times its libationer), Zou Yan, Chunyu Kun, Shen Dao and others gathered there, \"not governing but debating\": the centre of the contention of the Hundred Schools."},{"c":"culture","old":"鸿沟","mod":"河南荥阳至开封","lon":113.6,"lat":34.95,"y":-360,"yt":"前360 起","note":"魏惠王引河水经荥阳、大梁，东南连通颍、涡、睢、泗诸水入淮，是中原最早的大型人工运河网。","tl":"-9999:东虢;-767:郑;-375:韩;-249:秦","i":332,"eold":"Honggou Canal","emod":"Xingyang to Kaifeng, Henan","eyt":"from 360 BC","enote":"King Hui of Wei led water from the He past Xingyang and Daliang and southeast to the Ying, Guo, Sui, Si and other rivers into the Huai: the first large network of artificial canals in the Central Plains."},{"c":"culture","old":"胡服骑射","mod":"河北邯郸","lon":114.35,"lat":36.55,"y":-307,"yt":"前307","note":"赵武灵王令国人改穿胡服、习骑射，建立骑兵，赵国军力大振。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-228:秦","i":333,"eold":"Nomad dress and mounted archery","emod":"Handan, Hebei","eyt":"307 BC","enote":"King Wuling of Zhao ordered his people to adopt nomad dress and learn mounted archery, creating a cavalry force that greatly strengthened Zhao's army."},{"c":"culture","old":"黄金台","mod":"河北易县—定兴一带（位置说法不一）","lon":115.62,"lat":39.4,"y":-311,"yt":"约前311","note":"燕昭王为报齐仇，师事郭隗，“筑宫而师之”，乐毅、邹衍、剧辛争相趋燕。","tl":"-9999:燕;-226:秦","i":334,"eold":"Golden Terrace","emod":"around Yi County – Dingxing, Hebei (location disputed)","eyt":"c. 311 BC","enote":"To take revenge on Qi, King Zhao of Yan took Guo Wei as his teacher, \"building him a palace and serving him as master\"; Yue Yi, Zou Yan and Ju Xin vied to come to Yan."},{"c":"culture","old":"都江堰","mod":"四川都江堰市","lon":103.62,"lat":31.0,"y":-256,"yt":"约前256–前251","note":"秦蜀守李冰主持修建，鱼嘴分水、飞沙堰泄洪、宝瓶口引水，使成都平原成为“天府之国”，至今仍在使用。","tl":"-9999:蜀;-316:秦","i":335,"eold":"Dujiangyan","emod":"Dujiangyan, Sichuan","eyt":"c. 256–251 BC","enote":"Built under Li Bing, Qin governor of Shu: the Fish Mouth divides the river, the Flying Sand Weir sheds floods and the Precious Bottle Neck draws water, making the Chengdu Plain the \"Land of Abundance\". Still in use today."},{"c":"culture","old":"郑国渠","mod":"陕西泾阳（渠首）","lon":108.84,"lat":34.62,"y":-246,"yt":"前246 始建","note":"韩国水工郑国入秦修渠，本为“疲秦”之计，事泄后秦仍令其完成。渠引泾水东注洛水，溉田四万余顷，“关中为沃野”。","tl":"-9999:周;-771:西戎;-713:秦","i":336,"eold":"Zhengguo Canal","emod":"Jingyang, Shaanxi (canal head)","eyt":"begun 246 BC","enote":"Zheng Guo, a hydraulic engineer from Han, went to Qin to build a canal as a plan to \"exhaust Qin\"; when the plot came out, Qin still had him finish it. The canal led the Jing River east to the Luo and irrigated more than forty thousand qing of fields: \"Guanzhong became fertile land\"."},{"c":"culture","old":"屈原投江","mod":"湖南汨罗","lon":113.08,"lat":28.8,"y":-278,"yt":"约前278","note":"郢都陷落后，屈原自沉于汨罗江。著有《离骚》《九歌》《天问》等。","tl":"-9999:;-600:楚;-222:秦","i":337,"eold":"Qu Yuan drowns himself","emod":"Miluo, Hunan","eyt":"c. 278 BC","enote":"After the fall of the capital Ying, Qu Yuan drowned himself in the Miluo River. Author of the Li Sao, the Nine Songs, the Heavenly Questions and other works."},{"c":"culture","old":"易水送别","mod":"河北易县","lon":115.2,"lat":39.42,"y":-227,"yt":"前227","note":"太子丹及宾客白衣冠送荆轲于易水之上，“风萧萧兮易水寒，壮士一去兮不复还”。","tl":"-9999:燕;-226:秦","i":338,"eold":"Farewell at the Yi River","emod":"Yi County, Hebei","eyt":"227 BC","enote":"Crown Prince Dan and his retainers, dressed in white, saw Jing Ke off on the banks of the Yi River: \"The wind sighs, the Yi is cold; the hero, once gone, will not return.\""},{"c":"culture","old":"孟子故里","mod":"山东邹城","lon":117.1,"lat":35.35,"y":-372,"yt":"约前372–前289","note":"孟子为邹人，游说梁惠王、齐宣王，倡“仁政”“民为贵”。","tl":"-9999:邾;-351:鲁;-256:楚;-223:秦","i":339,"eold":"Hometown of Mencius","emod":"Zoucheng, Shandong","eyt":"c. 372–289 BC","enote":"Mencius was a man of Zou; he counselled King Hui of Liang and King Xuan of Qi, advocating \"humane government\" and \"the people are most important\"."},{"c":"culture","old":"庄子故里","mod":"河南商丘东北（蒙）","lon":115.85,"lat":34.6,"y":-369,"yt":"约前369–前286","note":"庄周为宋国蒙人，曾为漆园吏，著《庄子》。","tl":"-9999:宋;-286:齐;-284:魏;-225:秦","i":340,"eold":"Hometown of Zhuangzi","emod":"NE of Shangqiu, Henan (Meng)","eyt":"c. 369–286 BC","enote":"Zhuang Zhou was a man of Meng in Song, once an official of the lacquer garden, and author of the Zhuangzi."},{"c":"culture","old":"荀子·兰陵","mod":"山东兰陵","lon":118.0,"lat":34.75,"y":-255,"yt":"约前255","note":"荀子晚年由春申君任为兰陵令，著书终老；韩非、李斯皆出其门下。","tl":"-9999:鄫;-567:莒;-538:鲁;-431:楚;-223:秦","i":341,"eold":"Xunzi · Lanling","emod":"Lanling, Shandong","eyt":"c. 255 BC","enote":"In his later years Xunzi was made magistrate of Lanling by Lord Chunshen and spent the rest of his life there writing; Han Fei and Li Si were both his students."},{"c":"culture","old":"曾侯乙墓","mod":"湖北随州","lon":113.37,"lat":31.7,"y":-433,"yt":"约前433","note":"战国早期曾国国君墓，出土 65 件套编钟，音域跨五个八度半，可演奏十二律。","tl":"-9999:随;-360:楚;-278:秦","i":342,"eold":"Tomb of Marquis Yi of Zeng","emod":"Suizhou, Hubei","eyt":"c. 433 BC","enote":"Tomb of a ruler of Zeng from the early Warring States; it yielded a 65-piece set of bells spanning five and a half octaves and able to play all twelve pitches of the scale."},{"c":"culture","old":"中山王墓","mod":"河北平山三汲乡","lon":114.2,"lat":38.24,"y":-310,"yt":"约前310","note":"中山王厝墓出土错金银四龙四凤铜方案、“兆域图”铜版（最早的建筑平面图之一）及“中山三器”。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":343,"eold":"Tomb of the king of Zhongshan","emod":"Sanji Township, Pingshan, Hebei","eyt":"c. 310 BC","enote":"The tomb of King Cuo of Zhongshan yielded a bronze square table with four dragons and four phoenixes inlaid with gold and silver, the bronze \"Zhaoyu tu\" plate (one of the earliest architectural plans) and the \"Three Vessels of Zhongshan\"."},{"c":"culture","old":"郭店楚简","mod":"湖北荆门","lon":112.2,"lat":31.03,"y":-300,"yt":"约前300","note":"楚墓出土竹简，含迄今所见最早的《老子》抄本及多篇儒家佚籍。","tl":"-9999:楚;-506:吴;-505:楚;-278:秦","i":344,"eold":"Guodian Chu slips","emod":"Jingmen, Hubei","eyt":"c. 300 BC","enote":"Bamboo slips from a Chu tomb, including the earliest known manuscript of the Laozi and several lost Confucian texts."},{"c":"culture","old":"墨子止楚攻宋","mod":"河南商丘（宋都）","lon":115.55,"lat":34.35,"y":-440,"yt":"约前440","note":"公输般为楚造云梯将以攻宋，墨子行十日十夜至郢，与公输般解带为城、九攻九拒，楚王遂罢攻宋。“兼爱”“非攻”之说由此名闻天下。","tl":"-9999:宋;-286:齐;-284:魏;-225:秦","i":345,"eold":"Mozi stops Chu from attacking Song","emod":"Shangqiu, Henan (Song capital)","eyt":"c. 440 BC","enote":"Gongshu Ban built scaling ladders for Chu to attack Song. Mozi travelled ten days and nights to Ying and, with his belt laid out as a city wall, repulsed all nine of Gongshu Ban's attacks; the king of Chu then called off the attack on Song. From then on the doctrines of \"universal love\" and \"against aggression\" were known throughout the realm."},{"c":"culture","old":"子夏西河设教","mod":"陕西韩城—合阳一带（西河，一说在山西）","lon":110.3,"lat":35.4,"y":-400,"yt":"约前400","note":"孔子弟子子夏居西河教授，魏文侯师事之，田子方、段干木、李悝、吴起等皆曾受其影响，魏以礼贤称强。","tl":"-9999:梁;-641:秦;-617:晋;-453:魏;-330:秦","i":346,"eold":"Zixia teaches at Xihe","emod":"around Hancheng and Heyang, Shaanxi (Xihe; one view: in Shanxi)","eyt":"c. 400 BC","enote":"Zixia, a disciple of Confucius, lived and taught at Xihe. Marquis Wen of Wei took him as his teacher, and Tian Zifang, Duangan Mu, Li Kui, Wu Qi and others all came under his influence; Wei became strong through honouring worthy men."},{"c":"culture","old":"三家分晋","mod":"山西侯马（晋都新田）","lon":111.33,"lat":35.58,"y":-403,"yt":"前403","note":"周威烈王命晋大夫魏斯、赵籍、韩虔为诸侯。司马光《资治通鉴》以此开篇，叹“礼莫大于分”。","tl":"-9999:晋;-745:曲沃;-678:晋;-376:魏;-290:秦","i":347,"eold":"Partition of Jin","emod":"Houma, Shanxi (Xintian, the Jin capital)","eyt":"403 BC","enote":"King Weilie of Zhou recognised the Jin grandees Wei Si, Zhao Ji and Han Qian as feudal lords. Sima Guang opened his Zizhi Tongjian with this event, lamenting that \"in ritual nothing is greater than distinctions of rank\"."},{"c":"culture","old":"秦献公废殉","mod":"陕西宝鸡凤翔区（雍）","lon":107.45,"lat":34.47,"y":-384,"yt":"前384","note":"秦献公即位，“止从死”，废除人殉；次年徙都栎阳，又“为户籍相伍”（前375），推行县制，为商鞅变法先导。","tl":"-9999:周;-771:西戎;-750:秦","i":348,"eold":"Duke Xian of Qin abolishes human sacrifice","emod":"Fengxiang District, Baoji, Shaanxi (Yong)","eyt":"384 BC","enote":"On coming to the throne, Duke Xian of Qin \"stopped people following the dead\", abolishing human sacrifice. The next year he moved the capital to Yueyang, and he also \"registered households in groups of five\" (375 BC) and extended the county system, paving the way for Shang Yang's reforms."},{"c":"culture","old":"田氏代齐","mod":"山东淄博临淄区","lon":118.3,"lat":36.92,"y":-386,"yt":"前386","note":"齐相田和迁齐康公于海上，食一城以奉先祀；周安王立田和为齐侯。前379 康公卒，姜齐绝祀。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":349,"eold":"Usurpation of Qi by Tian","emod":"Linzi District, Zibo, Shandong","eyt":"386 BC","enote":"Tian He, chancellor of Qi, moved Duke Kang of Qi to the seaside, leaving him the revenue of one town to maintain his ancestral sacrifices, and King An of Zhou made Tian He marquis of Qi. When Duke Kang died in 379 BC, the sacrifices of Jiang Qi came to an end."},{"c":"wall","old":"秦始皇长城（新筑段）","mod":"甘肃兰州—宁夏—内蒙古河套、阴山","y":-214,"yt":"前214 起","note":"蒙恬取河南地后，“因河为塞”，沿黄河设亭障，又越河筑城于阴山、高阙一带，与秦昭王、赵、燕旧长城连成“万里长城”，西起临洮，东至辽东。","geo":[[103.86,35.38],[103.85,36.05],[104.7,36.55],[105.2,37.5],[106.3,38.5],[106.6,39.2],[107.0,40.3],[107.35,41.15],[108.5,41.35],[109.6,41.1],[110.5,41.0]],"anc":[106.57,39.131],"i":350,"eold":"First Emperor's Great Wall (new sections)","emod":"Lanzhou, Gansu – Ningxia – Hetao and Yin Mountains, Inner Mongolia","eyt":"from 214 BC","enote":"After taking Henandi, Meng Tian \"used the river as a barrier\", setting up watchtowers and stockades along the Yellow River; he also crossed the river and built walls and forts around the Yin Mountains and Gaoque, joining them with the old long walls of King Zhao of Qin, Zhao and Yan into the \"Great Wall\", from Lintao in the west to Liaodong in the east."},{"c":"wall","old":"秦昭王长城","mod":"甘肃临洮—宁夏固原—陕西榆林","y":-272,"yt":"约前272","note":"灭义渠后所筑，西起临洮，经固原、环县、吴起、靖边至榆林、神木，拒北方胡人。秦统一后成为万里长城西段。","geo":[[103.86,35.38],[104.3,35.2],[105.2,35.2],[105.8,35.55],[106.25,36.0],[106.8,36.3],[107.3,36.6],[108.1,36.95],[108.8,37.6],[109.7,38.3],[110.5,38.85],[111.0,39.3]],"anc":[107.661,36.758],"i":351,"eold":"Long Wall of King Zhao of Qin","emod":"Lintao, Gansu – Guyuan, Ningxia – Yulin, Shaanxi","eyt":"c. 272 BC","enote":"Built after the destruction of Yiqu, from Lintao in the west through Guyuan, Huan County, Wuqi and Jingbian to Yulin and Shenmu, against the northern Hu. After the Qin unification it became the western section of the Great Wall."},{"c":"wall","old":"魏河西长城","mod":"陕西华阴—大荔—澄城—延安","y":-355,"yt":"约前361–前352","note":"魏为防秦，沿洛水东岸筑长城，南起华阴，北至上郡。秦统一后废弃（约前215，碣石刻辞“堕坏城郭……夷去险阻”）。","geo":[[110.05,34.55],[109.98,34.9],[109.95,35.3],[109.85,35.7],[109.65,36.1],[109.55,36.5]],"anc":[109.89,35.541],"i":352,"y1":-215,"eold":"Wei Hexi Long Wall","emod":"Huayin – Dali – Chengcheng – Yan'an, Shaanxi","eyt":"c. 361–352 BC","enote":"Built by Wei along the east bank of the Luo River against Qin, from Huayin in the south to Shang Commandery in the north. Abandoned after the Qin unification (c. 215 BC; Jieshi inscription: \"pulled down city walls … levelled strongholds\")."},{"c":"wall","old":"魏河南长城","mod":"河南原阳—新密","y":-355,"yt":"约前355","note":"魏于大梁以西所筑，防韩、秦。秦统一后废弃（约前215，碣石刻辞“堕坏城郭……夷去险阻”）。","geo":[[113.95,35.0],[113.8,34.65],[113.6,34.4]],"anc":[113.814,34.684],"i":353,"y1":-215,"eold":"Wei Henan Long Wall","emod":"Yuanyang – Xinmi, Henan","eyt":"c. 355 BC","enote":"Built by Wei west of Daliang against Han and Qin. Abandoned after the Qin unification (c. 215 BC; Jieshi inscription: \"pulled down city walls … levelled strongholds\")."},{"c":"wall","old":"赵北长城","mod":"河北张家口—内蒙古阴山—高阙","y":-300,"yt":"约前300","note":"赵武灵王破林胡、楼烦后，“筑长城，自代并阴山下，至高阙为塞”。秦统一后为万里长城所沿用。","geo":[[114.9,40.7],[113.7,40.9],[112.4,40.9],[111.2,40.8],[109.8,40.8],[108.5,41.05],[107.35,41.15]],"anc":[111.12,40.8],"i":354,"eold":"Zhao Northern Long Wall","emod":"Zhangjiakou, Hebei – Yin Mountains, Inner Mongolia – Gaoque","eyt":"c. 300 BC","enote":"After crushing the Linhu and Loufan, King Wuling of Zhao \"built a long wall from Dai along the foot of the Yin Mountains to Gaoque as a barrier\". After the Qin unification it was taken into the Great Wall."},{"c":"wall","old":"赵南长城","mod":"河北邯郸—磁县漳滏之间","y":-333,"yt":"约前333","note":"赵肃侯筑于漳、滏之间，防魏、齐。秦统一后废弃（约前215，碣石刻辞“堕坏城郭……夷去险阻”）。","geo":[[114.1,36.45],[114.4,36.38],[114.8,36.3]],"anc":[114.449,36.37],"i":355,"y1":-215,"eold":"Zhao Southern Long Wall","emod":"Handan – Ci County, Hebei, between the Zhang and Fu rivers","eyt":"c. 333 BC","enote":"Built by Marquis Su of Zhao between the Zhang and Fu rivers against Wei and Qi. Abandoned after the Qin unification (c. 215 BC; Jieshi inscription: \"pulled down city walls … levelled strongholds\")."},{"c":"wall","old":"燕北长城","mod":"河北张家口—内蒙古赤峰—辽宁辽阳","y":-290,"yt":"约前290","note":"秦开却东胡后，燕“筑长城，自造阳至襄平”，置五郡以拒胡。秦统一后为万里长城东段。","geo":[[115.3,41.0],[116.4,41.6],[117.6,42.0],[118.9,42.45],[120.5,42.7],[121.8,42.3],[122.8,42.0],[123.4,41.7]],"anc":[119.235,42.502],"i":356,"eold":"Yan Northern Long Wall","emod":"Zhangjiakou, Hebei – Chifeng, Inner Mongolia – Liaoyang, Liaoning","eyt":"c. 290 BC","enote":"After Qin Kai drove back the Donghu, Yan \"built a long wall from Zaoyang to Xiangping\" and set up five commanderies against the Hu. After the Qin unification it became the eastern section of the Great Wall."},{"c":"wall","old":"燕南长城","mod":"河北易县—文安（易水长城）","y":-334,"yt":"约前334","note":"沿易水修筑，防齐、赵、中山。秦统一后废弃（约前215，碣石刻辞“堕坏城郭……夷去险阻”）。","geo":[[115.3,39.38],[115.6,39.22],[116.0,39.05],[116.5,38.9]],"anc":[115.876,39.103],"i":357,"y1":-215,"eold":"Yan Southern Long Wall","emod":"Yi County – Wen'an, Hebei (Yi River Long Wall)","eyt":"c. 334 BC","enote":"Built along the Yi River against Qi, Zhao and Zhongshan. Abandoned after the Qin unification (c. 215 BC; Jieshi inscription: \"pulled down city walls … levelled strongholds\")."},{"c":"wall","old":"齐长城","mod":"山东平阴—泰山—沂山—青岛黄岛","y":-441,"yt":"约前5世纪起","note":"现存最早的长城之一，西起平阴（防门），沿泰沂
