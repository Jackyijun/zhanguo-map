f Yan, Yan's territory crossed the Yan Mountains and reached Liaodong."},{"c":"range","old":"阴山","mod":"阴山","note":"赵武灵王筑长城依阴山西至高阙；山北为匈奴游牧之地。","geo":[[106.8,41.1],[108.2,41.0],[109.5,40.85],[110.8,40.85],[112.0,41.0],[113.2,41.2]],"anc":[110.015,40.85],"i":419,"eold":"Yin Mountains","emod":"Yin Mountains","enote":"King Wuling of Zhao built the Zhao Northern Long Wall along the Yin Mountains west to Gaoque; north of the mountains lay the Xiongnu pastures."},{"c":"range","old":"南山","mod":"秦岭","note":"古称南山、终南山，关中南屏。关中与汉中之间只能经陈仓、褒斜、傥骆、子午诸谷道穿越。","geo":[[104.3,34.25],[105.5,34.1],[106.6,33.95],[107.6,33.85],[108.6,33.85],[109.6,33.85],[110.5,33.8],[111.1,33.75]],"anc":[107.69,33.85],"i":420,"eold":"Nan Mountains","emod":"Qinling Mountains","enote":"Anciently called the Nan Mountains or the Zhongnan Mountains, the southern screen of Guanzhong. Between Guanzhong and Hanzhong it could only be crossed by the Chencang, Baoxie, Tangluo, Ziwu and other valley roads."},{"c":"range","old":"华山","mod":"华山","note":"古称太华，西岳。秦、魏河西之争的南端。","geo":[[109.85,34.44],[110.3,34.5]],"anc":[110.075,34.47],"i":421,"eold":"Mount Hua","emod":"Mount Hua","enote":"Anciently called Taihua, the Western Peak. The southern end of the Qin–Wei struggle for Hexi."},{"c":"range","old":"崤山","mod":"崤山","note":"与函谷关合称“崤函之固”，秦东出之咽喉。","geo":[[111.0,34.52],[111.4,34.6],[111.8,34.62]],"anc":[111.395,34.599],"i":422,"eold":"Xiao Mountains","emod":"Xiao Mountains","enote":"With the Hangu Pass, the \"stronghold of Xiao and Hangu\", the throat of Qin's route east."},{"c":"range","old":"伏牛山","mod":"伏牛山","note":"南阳盆地北屏；楚方城依其余脉而筑。","geo":[[111.2,33.5],[111.8,33.6],[112.4,33.7],[112.9,33.82]],"anc":[112.055,33.642],"i":423,"eold":"Funiu Mountains","emod":"Funiu Mountains","enote":"Northern screen of the Nanyang basin; the Chu Fangcheng was built along its spurs."},{"c":"range","old":"嵩山","mod":"嵩山","note":"古称太室、外方，中岳；韩国腹地。","geo":[[112.85,34.45],[113.2,34.5]],"anc":[113.025,34.475],"i":424,"eold":"Mount Song","emod":"Mount Song","enote":"Anciently called Taishi or Waifang, the Central Peak; the heartland of Han."},{"c":"range","old":"桐柏山","mod":"桐柏山","note":"淮水发源之地，楚国北境。","geo":[[113.0,32.35],[113.5,32.45],[113.9,32.3]],"anc":[113.463,32.443],"i":425,"eold":"Tongbai Mountains","emod":"Tongbai Mountains","enote":"Source of the Huai River, on Chu's northern frontier."},{"c":"range","old":"大别山","mod":"大别山","note":"江淮之间的屏障；冥阸等“义阳三关”在其西端。","geo":[[114.1,31.75],[114.8,31.4],[115.5,31.15],[116.2,30.85]],"anc":[115.139,31.279],"i":426,"eold":"Dabie Mountains","emod":"Dabie Mountains","enote":"The barrier between the Yangtze and the Huai; Ming'e and the other \"Three Passes of Yiyang\" lie at its western end."},{"c":"range","old":"大巴山","mod":"大巴山","note":"汉中与巴蜀之间的屏障；秦伐蜀取道金牛道（石牛道）。","geo":[[106.3,32.5],[107.3,32.2],[108.3,32.0],[109.3,31.75],[110.2,31.5]],"anc":[108.257,32.009],"i":427,"eold":"Daba Mountains","emod":"Daba Mountains","enote":"The barrier between Hanzhong and Ba–Shu; Qin's attack on Shu went by the Jinniu (Shiniu) Road."},{"c":"range","old":"巫山","mod":"巫山","note":"长江三峡所在；楚置巫郡，扼巴蜀东出之路。","geo":[[109.7,31.2],[110.2,31.0],[110.6,30.8]],"anc":[110.16,31.016],"i":428,"eold":"Wu Mountains","emod":"Wu Mountains","enote":"Site of the Three Gorges of the Yangtze; Chu set up Wu Commandery to block the way east out of Ba–Shu."},{"c":"range","old":"武陵山","mod":"武陵山","note":"楚黔中郡所在的山地。","geo":[[108.4,28.0],[109.1,28.8],[109.8,29.4],[110.4,29.8]],"anc":[109.306,28.977],"i":429,"eold":"Wuling Mountains","emod":"Wuling Mountains","enote":"The uplands where Chu's Qianzhong Commandery lay."},{"c":"range","old":"五岭","mod":"南岭","note":"楚国南境大致止于五岭北麓；岭南为百越之地，秦统一后（前214）方开岭南三郡。","geo":[[109.8,25.9],[110.8,25.4],[111.8,25.2],[112.8,25.15],[113.8,25.2],[114.8,25.2],[115.6,25.0]],"anc":[112.635,25.158],"i":430,"eold":"Five Ridges","emod":"Nanling Mountains","enote":"Chu's southern frontier stopped roughly at the northern foot of the Five Ridges; south of the ridges was the land of the Hundred Yue, and only after the Qin unification (214 BC) were the three Lingnan commanderies opened."},{"c":"range","old":"陇山","mod":"六盘山","note":"关中与陇西的分界，“陇坂九回”，萧关在其北口。","geo":[[106.25,34.85],[106.35,35.4],[106.3,36.0],[106.2,36.5]],"anc":[106.327,35.675],"i":431,"eold":"Long Mountains","emod":"Liupan Mountains","enote":"The divide between Guanzhong and Longxi, where \"the Long slope winds nine times\"; the Xiao Pass is at its northern mouth."},{"c":"range","old":"泰山·沂山","mod":"泰沂山地","note":"泰山古称岱宗，东岳；齐长城沿其北麓修筑，为齐与鲁、楚之界。","geo":[[116.6,36.28],[117.2,36.25],[117.7,36.1],[118.2,35.9],[118.6,35.75]],"anc":[117.638,36.119],"i":432,"eold":"Mount Tai · Mount Yi","emod":"Tai–Yi uplands","enote":"Mount Tai, anciently called Daizong, is the Eastern Peak; the Qi Long Wall was built along its northern foot, marking the border of Qi with Lu and Chu."},{"c":"range","old":"贺兰山","mod":"贺兰山","note":"北方游牧诸部活动之地。","geo":[[105.8,38.2],[106.0,38.7],[106.3,39.2]],"anc":[106.008,38.713],"i":433,"eold":"Helan Mountains","emod":"Helan Mountains","enote":"Where the northern nomadic peoples roamed."},{"c":"range","old":"岷山","mod":"岷山","note":"古人以岷山为江源，《禹贡》：“岷山导江”。","geo":[[103.4,33.2],[103.7,32.6],[103.5,31.8]],"anc":[103.68,32.518],"i":434,"eold":"Min Mountains","emod":"Min Mountains","enote":"The ancients took the Min Mountains as the source of the Jiang; Yu Gong: \"from the Min Mountains he led the Jiang\"."},{"c":"range","old":"武夷山","mod":"武夷山","note":"闽越与内地之间的屏障。","geo":[[116.6,27.0],[117.4,27.7],[118.1,28.1]],"anc":[117.295,27.608],"i":435,"eold":"Wuyi Mountains","emod":"Wuyi Mountains","enote":"The barrier between Minyue and the interior."},{"c":"range","old":"会稽山","mod":"会稽山","note":"越国发祥之地，相传大禹葬于会稽。","geo":[[120.3,29.72],[120.75,29.62]],"anc":[120.525,29.67],"i":436,"eold":"Kuaiji Mountains","emod":"Kuaiji Mountains","enote":"Birthplace of the state of Yue; by tradition Yu the Great was buried at Kuaiji."},{"c":"range","old":"医巫闾山","mod":"医巫闾山","note":"古幽州镇山，燕辽西郡境内。","geo":[[121.55,41.4],[121.8,42.0]],"anc":[121.675,41.7],"i":437,"eold":"Yiwulü Mountains","emod":"Yiwulü Mountains","enote":"The guardian mountain of ancient Youzhou, within Yan's Liaoxi Commandery."},{"c":"river","sub":"river","old":"汾水","mod":"汾河","note":"晋中、河东的中轴；晋阳、平阳皆临汾水。","anc":[111.996,37.142],"i":438,"eold":"Fen River","emod":"Fen River","enote":"The axis of central Shanxi and Hedong; both Jinyang and Pingyang lie on the Fen."},{"c":"river","sub":"river","old":"沂水","mod":"沂河","note":"齐、楚、鲁之间。","anc":[118.649,35.262],"i":439,"eold":"Yi River","emod":"Yi River","enote":"Between Qi, Chu and Lu."},{"c":"river","sub":"river","old":"江","mod":"长江","note":"战国时“江”专指长江。当时江口约在今扬州、镇江一带，以下为宽阔的河口湾。","anc":[114.6,30.45],"i":440,"eold":"Jiang","emod":"Yangtze River","enote":"In the Warring States \"Jiang\" meant the Yangtze alone. Its mouth was then around modern Yangzhou and Zhenjiang, with a wide estuary below."},{"c":"river","sub":"river","old":"辽水","mod":"辽河","note":"燕辽东郡西界。","anc":[123.061,42.105],"i":441,"eold":"Liao River","emod":"Liao River","enote":"Western boundary of Yan's Liaodong Commandery."},{"c":"river","sub":"river","old":"沅水","mod":"沅江","note":"楚黔中郡的主要河谷。","anc":[110.082,27.267],"i":442,"eold":"Yuan River","emod":"Yuan River","enote":"The main valley of Chu's Qianzhong Commandery."},{"c":"river","sub":"river","old":"汉水","mod":"汉江","note":"上游称沔水。汉中、上庸在其流域；楚“以汉水为池”。","anc":[111.8,32.4],"i":443,"eold":"Han River","emod":"Han River","enote":"Its upper course is called the Mian. Hanzhong and Shangyong lie in its basin; Chu \"has the Han River for its moat\"."},{"c":"river","sub":"river","old":"豫章水","mod":"赣江","note":"楚国东南境。","anc":[114.919,26.788],"i":444,"eold":"Yuzhang River","emod":"Gan River","enote":"Southeastern frontier of Chu."},{"c":"river","sub":"river","old":"饶乐水","mod":"西拉木伦河","note":"东胡活动地区。","anc":[118.624,43.242],"i":445,"eold":"Raole River","emod":"Xar Moron River","enote":"Region of the Donghu."},{"c":"river","sub":"river","old":"浙江","mod":"钱塘江·富春江","note":"浙江之名本指此水；楚灭越后“尽取故吴地至浙江”。","anc":[119.696,29.824],"i":446,"eold":"Zhe River","emod":"Qiantang and Fuchun rivers","enote":"The name Zhejiang originally referred to this river; after destroying Yue, Chu \"took all the old lands of Wu up to the Zhe River\"."},{"c":"river","sub":"river","old":"治水","mod":"桑干河·永定河","note":"又称㶟水，流经代地与燕都蓟南。","anc":[113.982,40.006],"i":447,"eold":"Zhi River","emod":"Sanggan and Yongding rivers","enote":"Also called the Lei River; it flowed through Dai and south of Ji, the Yan capital."},{"c":"river","sub":"river","old":"延江","mod":"乌江","note":"又称涪陵水；枳（涪陵）为巴楚交界。","anc":[108.234,28.282],"i":448,"eold":"Yan River","emod":"Wu River","enote":"Also called the Fuling River; Zhi (Fuling) was on the border of Ba and Chu."},{"c":"river","sub":"river","old":"湘水","mod":"湘江","note":"楚国南境开发的主轴。","anc":[112.609,26.816],"i":449,"eold":"Xiang River","emod":"Xiang River","enote":"The main axis of Chu's development of its southern frontier."},{"c":"river","sub":"river","old":"淮水","mod":"淮河","note":"“江淮河济”四渎之一。战国时淮河下游经淮阴独流入海，尚无洪泽湖；楚国东进的主轴。","anc":[116.1,32.45],"i":450,"eold":"Huai River","emod":"Huai River","enote":"One of the Four Waterways, \"Jiang, Huai, He and Ji\". In the Warring States the lower Huai flowed on its own past Huaiyin to the sea, and there was no Hongze Lake yet; it was the main axis of Chu's eastward expansion."},{"c":"river","sub":"river","old":"西汉水","mod":"嘉陵江","note":"上游称西汉水，下游又称渝水，巴国腹地。","anc":[105.996,31.596],"i":451,"eold":"Xihan River","emod":"Jialing River","enote":"Called the Xihan River in its upper course and the Yu River in its lower course; the heartland of Ba."},{"c":"river","sub":"river","old":"河","mod":"黄河（下游为战国故道）","note":"“四渎”之首，战国时单称“河”。下游与今迥异：大致经今浚县宿胥口北流，过内黄、馆陶、临清、德州、沧州，在今黄骅一带入渤海（据谭其骧考订，示意），是齐、赵、燕之间的界河。今河道（虚线）系后世多次改道形成。","anc":[115.65,36.85],"i":452,"eold":"He","emod":"Yellow River (lower course: Warring States channel)","enote":"First of the Four Waterways, called simply \"He\" in the Warring States. Its lower course was very different from today's: roughly from Suxukou in modern Xun County it flowed north past Neihuang, Guantao, Linqing, Dezhou and Cangzhou into the Bohai around modern Huanghua (following Tan Qixiang's reconstruction; schematic), and was the border river between Qi, Zhao and Yan. The modern course (dashed) is the result of many later shifts."},{"c":"river","sub":"river","old":"马訾水","mod":"鸭绿江","note":"流经燕辽东郡东境，燕与朝鲜以其南的满番汗为界。","anc":[126.866,41.758],"i":453,"eold":"Mazi River","emod":"Yalu River","enote":"Flows through the eastern part of Yan's Liaodong Commandery; Yan and Joseon were bordered at Manbanhan to its south."},{"c":"river","sub":"river","old":"白狼水","mod":"大凌河","note":"燕辽西郡境内。","anc":[120.631,41.616],"i":454,"eold":"Bailang River","emod":"Daling River","enote":"Within Yan's Liaoxi Commandery."},{"c":"river","sub":"river","old":"渭水","mod":"渭河","note":"关中命脉，秦都咸阳临渭。","anc":[107.127,34.367],"i":455,"eold":"Wei River","emod":"Wei River","enote":"The lifeline of Guanzhong; the Qin capital Xianyang stood on the Wei."},{"c":"river","sub":"river","old":"泾水","mod":"泾河","note":"“泾渭分明”；郑国渠引泾水东注洛水。","anc":[107.95,35.245],"i":456,"eold":"Jing River","emod":"Jing River","enote":"\"The Jing and the Wei are clearly distinct\"; the Zhengguo Canal led water from the Jing east to the Luo."},{"c":"river","sub":"river","old":"沁水","mod":"沁河","note":"发源于太岳山，穿太行南下入河。","anc":[112.537,35.541],"i":457,"eold":"Qin River","emod":"Qin River","enote":"Rises in the Taiyue Mountains and cuts south through the Taihang to the He."},{"c":"river","sub":"river","old":"漳水","mod":"漳河","note":"赵魏界水；西门豹引漳溉邺；赵南长城沿漳滏而筑。","anc":[114.153,36.315],"i":458,"eold":"Zhang River","emod":"Zhang River","enote":"The border river between Zhao and Wei; Ximen Bao irrigated Ye from the Zhang; the Zhao Southern Long Wall was built along the Zhang and the Fu."},{"c":"river","sub":"river","old":"濡水","mod":"滦河","note":"燕国东北境。","anc":[118.059,40.814],"i":459,"eold":"Nan River","emod":"Luan River","enote":"Northeastern frontier of Yan."},{"c":"river","sub":"river","old":"奢延水","mod":"无定河","note":"上郡北部。","anc":[110.294,37.467],"i":460,"eold":"Sheyan River","emod":"Wuding River","enote":"Northern Shang Commandery."},{"c":"river","sub":"river","old":"丹水","mod":"丹江","note":"丹阳之战爆发于此（前312）。","anc":[110.547,33.47],"i":461,"eold":"Dan River","emod":"Dan River","enote":"The Battle of Danyang was fought here (312 BC)."},{"c":"river","sub":"river","old":"济水","mod":"古济水（今已湮废）","note":"“四渎”之一，自荥阳分河东流，经定陶北、巨野泽，东北经今济南北入海。济南、济阳、济宁诸地名皆源于此；后被黄河夺道而消失。","anc":[116.21,35.84],"i":462,"eold":"Ji River","emod":"ancient Ji River (now vanished)","enote":"One of the Four Waterways; it left the He at Xingyang and flowed east, passing north of Dingtao and through the Juye Marsh, then northeast past the north of modern Jinan to the sea. The place names Jinan, Jiyang and Jining all come from it; it disappeared after the Yellow River captured its course."},{"c":"river","sub":"river","old":"洛水","mod":"北洛河","note":"秦魏河西之争的界河；魏沿洛水筑长城，秦简公“堑洛”。","anc":[109.409,35.91],"i":463,"eold":"Luo River","emod":"Beiluo River","enote":"The border river in the Qin–Wei struggle for Hexi; Wei built the Wei Hexi Long Wall along the Luo, and Duke Jian of Qin \"dug a moat along the Luo\"."},{"c":"river","sub":"river","old":"雒水","mod":"洛河（豫西）","note":"伊洛河谷为周王畿所在，宜阳、洛阳皆临此水。","anc":[111.612,34.359],"i":464,"eold":"Luo River","emod":"Luo River (western Henan)","enote":"The Yi–Luo valley was the seat of the Zhou royal domain; Yiyang and Luoyang both lie on this river."},{"c":"river","sub":"river","old":"伊水","mod":"伊河","note":"经伊阙北流入洛。","anc":[112.224,34.249],"i":465,"eold":"Yi River","emod":"Yi River","enote":"Flows north through Yique into the Luo."},{"c":"river","sub":"river","old":"汝水","mod":"汝河","note":"韩、魏、楚之间。","anc":[114.088,33.471],"i":466,"eold":"Ru River","emod":"Ru River","enote":"Between Han, Wei and Chu."},{"c":"river","sub":"river","old":"颍水","mod":"颍河","note":"发源于嵩山，经阳翟、陈之南入淮；鸿沟南段通颍。","anc":[114.73,33.577],"i":467,"eold":"Ying River","emod":"Ying River","enote":"Rises on Mount Song and flows past Yangzhai and south of Chen into the Huai; the southern section of the Honggou joined the Ying."},{"c":"river","sub":"river","old":"泗水","mod":"泗河（古泗水）","note":"经曲阜、彭城南流入淮，“泗上十二诸侯”在其流域。","anc":[117.136,34.357],"i":468,"eold":"Si River","emod":"Si River (ancient Si)","enote":"Flows south past Qufu and Pengcheng into the Huai; the \"twelve lords on the Si\" lay in its basin."},{"c":"river","sub":"river","old":"汶水","mod":"大汶河","note":"齐鲁界水之一。","anc":[116.91,35.888],"i":469,"eold":"Wen River","emod":"Dawen River","enote":"One of the border rivers between Qi and Lu."},{"c":"river","sub":"river","old":"滹沱","mod":"滹沱河","note":"中山国主要河流，东流入河。","anc":[114.279,38.23],"i":470,"eold":"Hutuo River","emod":"Hutuo River","enote":"The main river of Zhongshan, flowing east into the He."},{"c":"river","sub":"river","old":"易水","mod":"易水（南拒马河）","note":"燕国南界，燕南长城沿之而筑；荆轲辞燕于易水之上。","anc":[115.841,39.19],"i":471,"eold":"Yi River","emod":"Yi River (Southern Juma River)","enote":"Yan's southern border, along which the Yan Southern Long Wall was built; Jing Ke took leave of Yan on the Yi."},{"c":"river","sub":"river","old":"淇水","mod":"淇河","note":"卫地名川，《诗·卫风》“瞻彼淇奥”。","anc":[114.096,35.711],"i":472,"eold":"Qi River","emod":"Qi River","enote":"A famous river of Wey; Odes, \"Airs of Wey\": \"Look at that bend of the Qi\"."},{"c":"river","sub":"river","old":"淯水","mod":"白河","note":"南阳盆地主要河流，经宛城南流入汉。","anc":[112.45,32.763],"i":473,"eold":"Yu River","emod":"Bai River","enote":"The main river of the Nanyang basin, flowing south past Wan into the Han."},{"c":"river","sub":"river","old":"澧水","mod":"澧水","note":"“沅有芷兮澧有兰”。","anc":[111.224,29.46],"i":474,"eold":"Li River","emod":"Li River","enote":"\"On the Yuan there is angelica, on the Li there are orchids.\""},{"c":"river","sub":"river","old":"资水","mod":"资江","note":"楚南境河流。","anc":[111.344,28.404],"i":475,"eold":"Zi River","emod":"Zi River","enote":"A river on Chu's southern frontier."},{"c":"river","sub":"river","old":"江（岷江）","mod":"岷江","note":"古人视岷江为长江正源；都江堰即筑于其出山口。","anc":[103.734,30.619],"i":476,"eold":"Jiang (Min River)","emod":"Min River","enote":"The ancients regarded the Min River as the true source of the Yangtze; Dujiangyan was built where it leaves the mountains."},{"c":"river","sub":"canal","old":"鸿沟","mod":"古运河（已湮废）","note":"魏惠王前360年起开凿，自荥阳引河水东经大梁，南下至陈入颍，连通河淮。楚汉相争时以鸿沟为界。","anc":[114.532,34.482],"y":-360,"i":477,"eold":"Honggou Canal","emod":"ancient canal (vanished)","enote":"Dug from 360 BC under King Hui of Wei, leading water from the He at Xingyang east past Daliang, then south to Chen and into the Ying, linking the He and the Huai. In the Chu–Han contention the Honggou served as the boundary."},{"c":"river","sub":"canal","old":"邗沟","mod":"里运河前身","note":"吴王夫差前486年开凿，自广陵（扬州）北通淮水，是有明确纪年的最早运河之一。","anc":[119.402,33.028],"y":-486,"i":478,"eold":"Hangou Canal","emod":"forerunner of the Li Canal","enote":"Dug by Fuchai, king of Wu, in 486 BC, running north from Guangling (Yangzhou) to the Huai; one of the earliest canals with a firm date."},{"c":"river","sub":"canal","old":"灵渠","mod":"兴安运河","note":"监御史禄凿，引湘江水入漓江，沟通长江、珠江两大水系，秦军赖以运粮平定岭南。","anc":[110.629,25.583],"y":-214,"i":479,"eold":"Lingqu Canal","emod":"Xing'an Canal","enote":"Cut by the supervising censor Lu, leading water from the Xiang River into the Li River and joining the Yangtze and Pearl river systems; the Qin army relied on it to bring up grain and pacify Lingnan."},{"c":"river","sub":"canal","old":"郑国渠","mod":"泾惠渠前身","note":"前246 年始建，自泾阳引泾水东流注入洛水，长三百余里。","anc":[109.338,34.801],"y":-246,"i":480,"eold":"Zhengguo Canal","emod":"forerunner of the Jinghui Canal","enote":"Begun in 246 BC, leading water from the Jing at Jingyang east into the Luo, more than three hundred li long."},{"c":"river","sub":"marsh","old":"云梦泽","mod":"江汉平原（今洪湖等湖群为其遗存）","lon":113.2,"lat":30.3,"rx":0.85,"ry":0.33,"note":"楚王游猎之地，“云梦者，方九百里”（司马相如《子虚赋》）（范围历代说法不一）。","anc":[113.2,30.3],"i":481,"eold":"Yunmeng Marsh","emod":"Jianghan Plain (Honghu and nearby lakes are its remnants)","enote":"Hunting ground of the kings of Chu: \"Yunmeng is nine hundred li square\" (Sima Xiangru, Zixu Rhapsody) (accounts of its extent vary)."},{"c":"river","sub":"marsh","old":"大野泽","mod":"山东巨野以北（已淤废）","lon":116.05,"lat":35.45,"rx":0.3,"ry":0.2,"note":"又称巨野泽，济水所经；今东平湖为其残余。","anc":[116.05,35.45],"i":482,"eold":"Daye Marsh","emod":"N of Juye, Shandong (silted up)","enote":"Also called the Juye Marsh, on the course of the Ji; modern Dongping Lake is its remnant."},{"c":"river","sub":"marsh","old":"大陆泽","mod":"河北隆尧—巨鹿间（已淤废）","lon":114.95,"lat":37.35,"rx":0.18,"ry":0.13,"note":"古巨鹿泽，赵国境内大泽。","anc":[114.95,37.35],"i":483,"eold":"Dalu Marsh","emod":"between Longyao and Julu, Hebei (silted up)","enote":"The ancient Julu Marsh, a great marsh in Zhao."},{"c":"river","sub":"marsh","old":"圃田泽","mod":"河南郑州东（已淤废）","lon":113.93,"lat":34.72,"rx":0.13,"ry":0.07,"note":"魏国大泽，鸿沟水源的调节湖。","anc":[113.93,34.72],"i":484,"eold":"Putian Marsh","emod":"E of Zhengzhou, Henan (silted up)","enote":"A great marsh of Wei, the regulating lake for the Honggou's water supply."},{"c":"river","sub":"marsh","old":"孟诸泽","mod":"河南商丘东北（已淤废）","lon":115.95,"lat":34.62,"rx":0.13,"ry":0.08,"note":"宋国大泽。","anc":[115.95,34.62],"i":485,"eold":"Mengzhu Marsh","emod":"NE of Shangqiu, Henan (silted up)","enote":"A great marsh of Song."},{"c":"river","sub":"marsh","old":"雷夏泽","mod":"山东鄄城东南（已淤废）","lon":115.68,"lat":35.5,"rx":0.08,"ry":0.06,"note":"古泽名，相传舜渔于雷泽。","anc":[115.68,35.5],"i":486,"eold":"Leixia Marsh","emod":"SE of Juancheng, Shandong (silted up)","enote":"An ancient marsh; by tradition Shun fished in the Lei Marsh."},{"c":"river","sub":"lake","old":"震泽","mod":"太湖","note":"即今太湖，又名具区，吴越之间。","anc":[120.14,31.23],"i":487,"eold":"Zhen Marsh","emod":"Lake Tai","enote":"Modern Lake Tai, also called Juqu, between Wu and Yue."},{"c":"river","sub":"lake","old":"彭蠡泽","mod":"鄱阳湖","note":"今鄱阳湖前身（古彭蠡泽的范围与今湖不尽相同）。","anc":[116.06,29.26],"i":488,"eold":"Pengli Marsh","emod":"Poyang Lake","enote":"Forerunner of modern Poyang Lake (the ancient Pengli Marsh did not cover quite the same area as the modern lake)."},{"c":"river","sub":"lake","old":"巢湖","mod":"巢湖","note":"楚国江淮之间的大湖。","anc":[117.53,31.58],"i":489,"eold":"Lake Chao","emod":"Lake Chao","enote":"A large lake in Chu between the Yangtze and the Huai."},{"c":"river","sub":"lake","old":"洞庭","mod":"洞庭湖","note":"《战国策》“楚南有洞庭、苍梧”，战国时湖面远小于后世。","anc":[112.17,28.92],"i":490,"eold":"Dongting","emod":"Dongting Lake","enote":"Zhanguo ce: \"south of Chu are Dongting and Cangwu\"; in the Warring States the lake was far smaller than in later times."},{"c":"river","sub":"lake","old":"西海","mod":"青海湖","note":"青海湖古称，羌人游牧之地。","anc":[100.11,36.88],"i":491,"eold":"Xihai","emod":"Qinghai Lake","enote":"Ancient name of Qinghai Lake, pastureland of the Qiang."},{"c":"people","old":"匈奴","mod":"","lon":110.5,"lat":42.3,"y0":-400,"y1":-200,"note":"战国后期崛起于阴山南北的游牧部族，秦、赵筑长城以御之（燕长城主要防东胡）。","i":492,"eold":"Xiongnu","enote":"Nomadic people who rose north and south of the Yin Mountains in the late Warring States; Qin and Zhao built long walls against them (Yan's long wall was mainly against the Donghu)."},{"c":"people","old":"林胡","mod":"","lon":110.9,"lat":39.55,"y0":-400,"y1":-301,"note":"北方游牧部族，赵武灵王破之，其地入赵。","i":493,"eold":"Linhu","enote":"A northern nomadic people, crushed by King Wuling of Zhao; its land passed to Zhao."},{"c":"people","old":"楼烦","mod":"","lon":112.3,"lat":39.35,"y0":-400,"y1":-301,"note":"善骑射的北方部族，为赵武灵王所破，北徙河南地（河套以南）。","i":494,"eold":"Loufan","enote":"A northern people skilled in mounted archery, crushed by King Wuling of Zhao; they moved north to Henandi (south of the Hetao bend)."},{"c":"people","old":"楼烦","mod":"","lon":108.7,"lat":39.7,"y0":-300,"y1":-213,"note":"楼烦北徙河南地（河套以南），秦统一后蒙恬逐之。","i":495,"eold":"Loufan","enote":"The Loufan moved north to Henandi (south of the Hetao bend); after the Qin unification Meng Tian drove them out."},{"c":"people","old":"东胡","mod":"","lon":118.8,"lat":42.2,"y0":-400,"y1":-301,"note":"东北游牧部族，燕将秦开破之，却千余里。","i":496,"eold":"Donghu","enote":"A nomadic people of the northeast, crushed by the Yan general Qin Kai and driven back more than a thousand li."},{"c":"people","old":"东胡","mod":"","lon":120.5,"lat":43.5,"y0":-300,"y1":-200,"note":"东北游牧部族。","i":497,"eold":"Donghu","enote":"A nomadic people of the northeast."},{"c":"people","old":"朝鲜","mod":"","lon":125.9,"lat":39.2,"y0":-400,"y1":-200,"note":"箕氏朝鲜，与燕以满番汗（今清川江一带）为界。","i":498,"eold":"Joseon","enote":"Gija Joseon, bordering Yan at Manbanhan (around the modern Cheongcheon River)."},{"c":"people","old":"濊貊","mod":"","lon":126.8,"lat":41.3,"y0":-400,"y1":-200,"note":"东北诸族。","i":499,"eold":"Yemaek","enote":"Peoples of the northeast."},{"c":"people","old":"羌","mod":"","lon":101.9,"lat":35.4,"y0":-400,"y1":-200,"note":"西羌诸部，居河湟、陇西以西。","i":500,"eold":"Qiang","enote":"The Western Qiang tribes, living in the He–Huang region and west of Longxi."},{"c":"people","old":"氐","mod":"","lon":104.4,"lat":33.3,"y0":-400,"y1":-200,"note":"居陇南、川北山地。","i":501,"eold":"Di","enote":"Lived in the mountains of southern Gansu and northern Sichuan."},{"c":"people","old":"滇","mod":"","lon":102.7,"lat":25.0,"y0":-400,"y1":-200,"note":"约前279 楚将庄蹻率军至滇，因秦断归路，遂“变服，从其俗，以长之”。","i":502,"eold":"Dian","enote":"Around 279 BC the Chu general Zhuang Qiao led an army to Dian; when Qin cut off his way home he \"changed his dress, followed their customs and ruled over them\"."},{"c":"people","old":"夜郎","mod":"","lon":105.9,"lat":26.5,"y0":-400,"y1":-200,"note":"西南夷中最大的部族国家。","i":503,"eold":"Yelang","enote":"The largest tribal state among the Southwestern Yi."},{"c":"people","old":"邛都","mod":"","lon":102.2,"lat":27.9,"y0":-400,"y1":-200,"note":"西南夷之一。","i":504,"eold":"Qiongdu","enote":"One of the Southwestern Yi."},{"c":"people","old":"闽越","mod":"","lon":118.9,"lat":26.2,"y0":-400,"y1":-213,"note":"越人支系，居今福建。","i":505,"eold":"Minyue","enote":"A branch of the Yue, living in modern Fujian."},{"c":"people","old":"越人诸君长","mo     let jumped = false;
    if (it.c === "battle" && !inPeriod(it)) { stopPlay(); setSnap(periodOf(it.y), false); jumped = true; }   // 战役跳到它所在的那一期
    else if (evY != null && evY > snapY()) { stopPlay(); setSnap(periodOf(evY), false); jumped = true; }
    if (it.c === "state" && !SNAPS[si].s[it.k]) {
      // 跳到该国尚存的最后一个时间节点
      let j = SNAPS.length - 1; while (j > 0 && !SNAPS[j].s[it.k]) j--;
      setSnap(j, false);
    }
    buildStates();
    if (!fromMap) {
      const p = focusPoint(it);
      if (p) {
        const zk = it.c === "state" ? Math.max(view.k, 2.6) : it.c === "range" || it.c === "river" || it.c === "wall" ? Math.max(view.k, 3.2) : Math.max(view.k, 6.5);
        setView(p[0], p[1], zk, true);
      } else render();
    } else {
      render();
      if (ev && ev.pointerType !== "mouse") showTip(it, ev);
    }
    if (jumped) buildIndex();
    markRows();
    const row = document.querySelector(`.row[data-i="${i}"]`);
    if (row) {
      const grp = row.closest(".grp"); if (grp && grp.dataset.closed === "1") { grp.dataset.closed = "0"; }
      row.scrollIntoView({ block: "nearest", behavior: reduce() ? "auto" : "smooth" });
    }
  }
  function markRows() { document.querySelectorAll(".row").forEach(r => r.dataset.sel = (+r.dataset.i === selected) ? "1" : "0"); }

  /* ---------------- 时间轴 ---------------- */
  const axis = document.getElementById("axis"), axiswrap = document.getElementById("axiswrap");
  // 轴的两端：首节点前 3 年至末节点后 5 年；轴宽随节点数放宽，每个节点至少约 26px
  const TY0 = SNAPS[0].y - 3, TY1 = SNAPS[SNAPS.length - 1].y + 5;
  const TSTEP = TY1 - TY0 > 220 ? 20 : 10;
  axis.style.minWidth = Math.max(860, SNAPS.length * 26) + "px";
  // 时间轴刻度：一半按真实年份，一半按节点序号均分，使末年密集的节点也有足够间距
  const SY = SNAPS.map(s => s.y), NS_ = SY.length;
  function idxPos(y) {
    if (y <= SY[0]) return (0.5 / NS_) * (y - TY0) / (SY[0] - TY0);
    if (y >= SY[NS_ - 1]) return 1 - (0.5 / NS_) * (TY1 - y) / (TY1 - SY[NS_ - 1]);
    let k = 0; while (SY[k + 1] < y) k++;
    return (k + 0.5 + (y - SY[k]) / (SY[k + 1] - SY[k])) / NS_;
  }
  const pct = y => ((0.5 * (y - TY0) / (TY1 - TY0) + 0.5 * idxPos(y)) * 100).toFixed(3) + "%";
  const ST = sn => (EN() && sn.te) || sn.t, SD_ = sn => (EN() && sn.de) || sn.d, SS = sn => (EN() && sn.she) || sn.sh;
  function buildAxis() {
    axis.innerHTML = '<div class="ln"></div><div class="fill" id="axfill"></div>';
    const y0 = Math.ceil(SNAPS[0].y / TSTEP) * TSTEP;
    for (let y = y0; y <= TY1 - 4; y += TSTEP) {
      const d = document.createElement("div"); d.className = "dec"; d.style.left = pct(y); d.textContent = EN() && y !== y0 ? String(Math.abs(y)) : yr(y); axis.append(d);
    }
    SNAPS.forEach((s, j) => {
      const b = document.createElement("button");
      b.className = "sd"; b.dataset.j = j; b.style.left = pct(s.y);
      b.title = `${yr(s.y)} ${ST(s)}`;
      b.setAttribute("aria-label", `${yr(s.y)} ${ST(s)}`); b.setAttribute("aria-pressed", "false");
      b.innerHTML = `<span class="d"></span><span class="t">${esc(SS(s))}</span>`;
      b.addEventListener("click", () => { stopPlay(); setSnap(j, true); });
      axis.append(b);
    });
  }
  buildAxis();
  function placeLbl(node, x) {
    const w = node.offsetWidth, W2 = axis.offsetWidth;
    node.style.left = Math.max(0, Math.min(W2 - w, x - w / 2)) + "px";
  }
  function setSnap(j, rebuild = true) {
    si = j;
    const s = SNAPS[j];
    axis.querySelectorAll(".sd").forEach(b => { const k = +b.dataset.j; b.setAttribute("aria-pressed", k === j ? "true" : "false"); b.classList.toggle("past", k < j); });
    document.getElementById("axfill").style.width = pct(s.y);
    const btn = axis.querySelector(`.sd[data-j="${j}"]`);
    requestAnimationFrame(() => {
      if (axiswrap.scrollWidth > axiswrap.clientWidth) axiswrap.scrollTo({ left: btn.offsetLeft - axiswrap.clientWidth / 2, behavior: reduce() ? "auto" : "smooth" });
    });
    const cb = ITEMS.filter(it => it.c === "battle" && inPeriod(it)).sort((a, b) => a.y - b.y);
    document.getElementById("caption").innerHTML = `<span class="y">${yr(s.y)}</span><b>${esc(ST(s))}</b>${esc(SD_(s))}` +
      (cb.length ? `<span class="bchips"><span class="lb">${t("thisPeriod")}</span>${cb.map(b => `<button data-i="${b.i}">${esc(N(b))}</button>`).join("")}</span>` : "");
    document.getElementById("prev").disabled = j === 0;
    document.getElementById("next").disabled = j === SNAPS.length - 1;
    buildLegendStates();
    if (rebuild) { buildStates(); render(); buildIndex(); }
  }
  document.getElementById("caption").addEventListener("click", e => {
    const b = e.target.closest(".bchips button"); if (!b) return;
    if (stage.dataset.view !== "map") setMode("map");
    select(+b.dataset.i, false);
  });
  document.getElementById("prev").addEventListener("click", () => { stopPlay(); if (si > 0) setSnap(si - 1); });
  document.getElementById("next").addEventListener("click", () => { stopPlay(); if (si < SNAPS.length - 1) setSnap(si + 1); });
  let playT = null, speed = 1;
  const playBtn = document.getElementById("play"), speedBtn = document.getElementById("speed");
  const PLAY_MS = DATA.playms || 1700;
  function stopPlay() { if (playT) { clearTimeout(playT); playT = null; document.getElementById("playicon").innerHTML = '<path d="M3 2 12 7 3 12Z" fill="currentColor"/>'; playBtn.title = t("play"); } }
  playBtn.addEventListener("click", () => {
    if (playT) { stopPlay(); return; }
    if (si === SNAPS.length - 1) setSnap(0);
    document.getElementById("playicon").innerHTML = '<rect x="3" y="2" width="3" height="10" fill="currentColor"/><rect x="8" y="2" width="3" height="10" fill="currentColor"/>';
    playBtn.title = t("pause");
    const tick = () => { if (si >= SNAPS.length - 1) { stopPlay(); return; } setSnap(si + 1); playT = setTimeout(tick, PLAY_MS / speed); };
    playT = setTimeout(tick, PLAY_MS / speed);
  });
  speedBtn.addEventListener("click", () => {
    speed = speed === 1 ? 2 : 1;
    speedBtn.textContent = speed + "×"; speedBtn.setAttribute("aria-pressed", speed === 2 ? "true" : "false");
  });

  /* ---------------- 图例 ---------------- */
  const legStates = document.getElementById("legstates");
  function buildLegendStates() {
    legStates.replaceChildren();
    // 只列本期尚存者与本期新亡者（划掉），部族排在最后
    const fellNow = new Set(FALLS.filter(f => f.y > prevY() && f.y <= snapY()).map(f => f.k));
    const keys = STATES.filter(k => SNAPS[si].s[k] || (fellNow.has(k) && si > 0 && SNAPS[si - 1].s[k]));
    keys.sort((a, b) => isTribe(a) - isTribe(b));
    for (const k of keys) {
      const b = document.createElement("button");
      const alive = !!SNAPS[si].s[k];
      b.dataset.gone = alive ? "0" : "1";
      const nm = EN() ? (SNAPS[si].labe?.[k] || SN(k)) : (SNAPS[si].lab?.[k] || stateItem[k].old.replace("（王畿）", ""));
      b.innerHTML = `<span class="sq${isTribe(k) ? " tr" : ""}" style="--k:${sVar(k)}"></span>${esc(nm)}`;
      b.title = alive ? t("legClick")(N(stateItem[k])) : t("legGone")(N(stateItem[k]), yr(snapY()));
      b.addEventListener("click", () => select(stateItem[k].i, false));
      b.addEventListener("mouseenter", () => { hovered = stateItem[k].i; buildStates(); render(); });
      b.addEventListener("mouseleave", () => { hovered = null; buildStates(); render(); });
      legStates.append(b);
    }
  }
  const SYM = {
    territory: '<rect x="1" y="2" width="12" height="10" rx="1.5" fill="var(--s-0)" opacity=".6"/>',
    capital: '<rect x="2" y="2" width="10" height="10" fill="var(--paper)" stroke="var(--c-capital)" stroke-width="1.4"/><rect x="4.6" y="4.6" width="4.8" height="4.8" fill="var(--c-capital)"/>',
    battle: '<circle cx="7" cy="7" r="5.6" fill="var(--paper)" stroke="var(--c-battle)" stroke-width="1.2"/><path d="M4.6 4.6 9.4 9.4M9.4 4.6 4.6 9.4" stroke="var(--c-battle)" stroke-width="1.7" stroke-linecap="round"/>',
    pass: '<rect x="3.5" y="3.5" width="7" height="7" transform="rotate(45 7 7)" fill="var(--c-pass)"/>',
    city: '<circle cx="7" cy="7" r="3.6" fill="var(--paper)" stroke="var(--c-city)" stroke-width="1.6"/>',
    town: '<circle cx="7" cy="7" r="2.4" fill="var(--ink-3)"/>',
    culture: '<path d="M7 1.8 12 10.6H2Z" fill="var(--c-culture)"/>',
    jun: '<circle cx="7" cy="7" r="5.2" fill="none" stroke="var(--jun)" stroke-width="1.3"/><circle cx="7" cy="7" r="1.8" fill="var(--jun)"/>',
    road: '<path d="M1 9 C5 5, 9 9, 13 5" stroke="var(--road)" stroke-width="1.7" stroke-dasharray="4 2" fill="none"/>',
    wall: '<path d="M1 7H13" stroke="var(--wall)" stroke-width="1.4"/><path d="M1 7H13" stroke="var(--wall)" stroke-width="5" stroke-dasharray="1.6 2.4"/>',
    range: '<path d="M1 9 C4 5, 9 5, 13 8" stroke="var(--range)" stroke-width="5" stroke-linecap="round" fill="none" opacity=".45"/>',
    river: '<path d="M1 9 C4 4, 8 11, 13 5" stroke="var(--water)" stroke-width="1.8" fill="none"/>',
    people: '<text x="7" y="11" text-anchor="middle" font-size="10" font-style="italic" fill="var(--ink-3)">夷</text>',
    prov: '<path d="M1 7H13" stroke="var(--border)" stroke-width="1.2" stroke-dasharray="3 2"/>'
  };
  const legend = document.getElementById("legend");
  function buildLegendLayers() {
    legend.replaceChildren();
    for (const L of LAYERS) {
      const n = L.id === "territory" || L.id === "prov" ? "" : ITEMS.filter(i => i.c === L.id).length;
      const li = document.createElement("li");
      li.innerHTML = `<button aria-pressed="${layerOn[L.id]}" data-l="${L.id}"><svg width="14" height="14" viewBox="0 0 14 14">${SYM[L.id]}</svg><span>${L[LANG]}</span><span class="n">${n}</span></button>`;
      legend.append(li);
    }
  }
  buildLegendLayers();
  legend.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const id = b.dataset.l; layerOn[id] = !layerOn[id];
    b.setAttribute("aria-pressed", layerOn[id] ? "true" : "false");
    if (id === "territory") buildStates();
    render(); buildIndex();
  });
  const legBody = document.getElementById("legbody"), legT = document.getElementById("legtoggle");
  function setLeg(open) { legBody.hidden = !open; legT.textContent = open ? t("hide") : t("show"); legT.setAttribute("aria-expanded", open); }
  legT.addEventListener("click", () => setLeg(legBody.hidden));
  if (matchMedia("(max-width: 900px)").matches) setLeg(false);

  /* ---------------- 索引 ---------------- */
  const index = document.getElementById("index");
  const closedGroups = new Set(["people", "town"]);
  function buildIndex() {
    index.replaceChildren();
    const Y = snapY();
    let total = 0;
    for (const c of CATS) {
      let list = ITEMS.filter(i => i.c === c.id && matches(i));
      if (!list.length) continue;
      if (c.id === "culture" || c.id === "wall" || c.id === "road") list.sort((a, b) => a.y - b.y);
      if (c.id === "jun") list.sort((a, b) => a.y0 - b.y0);
      if (c.id === "battle") list.sort((a, b) => (inPeriod(b) - inPeriod(a)) || a.y - b.y);
      const sub = c.id === "battle" ? t("bSub")(list.filter(inPeriod).length, list.length) : `${list.length}` + (cSub(c) ? ` · ${cSub(c)}` : "");
      if (c.id === "capital") list.sort((a, b) => STATES.indexOf(a.st) - STATES.indexOf(b.st) || a.y0 - b.y0);
      total += list.length;
      const sec = document.createElement("section");
      sec.className = "grp"; sec.style.setProperty("--k", c.k);
      sec.dataset.closed = closedGroups.has(c.id) && !query ? "1" : "0";
      sec.innerHTML = `<h2><span class="chev">▼</span><span class="bar"></span>${cName(c)}<span class="sub">${sub}</span></h2>`;
      sec.querySelector("h2").addEventListener("click", () => {
        const cl = sec.dataset.closed === "1"; sec.dataset.closed = cl ? "0" : "1";
        if (cl) closedGroups.delete(c.id); else closedGroups.add(c.id);
      });
      const ol = document.createElement("ol");
      for (const it of list) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.className = "row"; b.dataset.i = it.i; b.dataset.sel = selected === it.i ? "1" : "0";
        const kcol = it.c === "state" ? sVar(it.k) : it.c === "capital" ? sVar(it.st) : c.k;
        b.style.setProperty("--k", kcol);
        if ((it.c === "culture" || it.c === "wall" || it.c === "road" || it.sub === "canal") && it.y > Y) b.dataset.future = "1";
        if (it.c === "jun" && !junLive(it, Y)) b.dataset.future = "1";
        if (it.c === "battle" && !inPeriod(it)) b.dataset.future = "1";
        if (it.c === "state" && !SNAPS[si].s[it.k]) b.dataset.future = "1";
        const sw = it.c === "state" ? `<span class="sq" style="--k:${sVar(it.k)}"></span>` : "";
        const meta = metaHTML(it, Y, false);
        const note = it.c === "state" ? esc(NT(it)).replace(/\n/g, "<br>") : esc(NT(it));
        b.innerHTML = `<span class="o">${sw}${esc(N(it))}${ZH(it)}</span><span class="m">${esc(M(it))}</span>` +
          (meta ? `<span class="mt">${meta}</span>` : "") + (note ? `<span class="n">${note}</span>` : "");
        b.addEventListener("click", () => { if (stage.dataset.view !== "map") setMode("map"); select(it.i, false); });
        b.addEventListener("mouseenter", () => { hovered = it.i; if (it.c === "state") buildStates(); render(); });
        b.addEventListener("mouseleave", () => { hovered = null; if (it.c === "state") buildStates(); render(); });
        li.append(b); ol.append(li);
      }
      sec.append(ol); index.append(sec);
    }
    if (!total) { const d = document.createElement("div"); d.className = "empty"; d.textContent = t("empty"); index.append(d); }
  }

  /* ---------------- 对照表 ---------------- */
  function buildTable() {
    const wrap = document.getElementById("tablewrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>${t("tIntro")}</p>`;
    wrap.append(intro);
    const tbl = document.createElement("table");
    tbl.innerHTML = `<thead><tr>${t("tHead").map(h => `<th>${h}</th>`).join("")}</tr></thead>`;
    const tb = document.createElement("tbody");
    for (const c of CATS) {
      if (c.id === "state") continue;
      for (const it of ITEMS.filter(x => x.c === c.id && matches(x))) {
        const tr = document.createElement("tr"); tr.className = "click";
        const ll = it.lon != null ? [it.lon, it.lat] : it.anc;
        const when = it.c === "capital" ? `${yr(it.y0)}–${yr(it.y1)}` : it.c === "jun" ? (it.y0 > -9000 ? t("junSet")(yr(it.y0)) : "—") : YT(it);
        tr.innerHTML = `<td class="o">${esc(N(it))}${ZH(it)}</td><td>${esc(M(it))}</td>` +
          `<td class="cat" style="--k:${it.c === "capital" ? sVar(it.st) : c.k}"><span class="dot"></span>${cName(c)}${it.c === "capital" ? " · " + esc(SN(it.st)) : ""}</td>` +
          `<td class="num">${esc(when)}</td><td class="num">${ll ? ll[0].toFixed(2) + "°E&nbsp; " + ll[1].toFixed(2) + "°N" : ""}</td><td class="note">${esc(NT(it) || "—")}</td>`;
        tr.addEventListener("click", () => { setMode("map"); requestAnimationFrame(() => select(it.i, false)); });
        tb.append(tr);
      }
    }
    tbl.append(tb); wrap.append(tbl);
  }

  /* ---------------- 年表 ---------------- */
  function buildChron() {
    const wrap = document.getElementById("chronwrap");
    wrap.replaceChildren();
    const intro = document.createElement("div"); intro.className = "intro";
    intro.innerHTML = `<p>${t("cIntro")}</p>`;
    wrap.append(intro);
    const ev = [];
    for (const it of ITEMS) {
      if ((it.c === "battle" || it.c === "culture" || it.c === "wall" || it.c === "road") && it.y > DATA.p0 && matches(it)) ev.push({ y: it.y, yt: YT(it), t: N(it), zh: ZH(it), k: cName(CAT[it.c]), p: it.c === "battle" ? (EN() ? `${pick(it, "sides")}. ${NT(it)}` : `${it.sides}。${it.note}`) : NT(it), col: CAT[it.c].k, i: it.i });
      if (it.c === "capital" && it.y0 > DATA.p0 && matches(it)) ev.push({ y: it.y0, yt: yr(it.y0), t: t("capEv")(SN(it.st), N(it)), zh: EN() ? `<span class="zh" lang="zh-CN">${esc(it.st + "都" + it.old)}</span>` : "", k: t("cMove"), p: NT(it), col: sVar(it.st), i: it.i });
    }
    for (const f of FALLS) if (!query || norm(f.nm).includes(norm(query)) || norm(f.nme).includes(norm(query))) ev.push({ y: f.y, yt: yr(f.y), t: t("fallEv")((EN() && f.nme) || f.nm), zh: EN() ? `<span class="zh" lang="zh-CN">${esc(f.nm + "亡")}</span>` : "", k: t("cFall"), p: (EN() && f.pe) || f.p, col: sVar(f.k), i: stateItem[f.k].i, fall: true });
    for (const s of SNAPS) if (!query) ev.push({ y: s.y, yt: yr(s.y), t: ST(s), zh: EN() && s.te ? `<span class="zh" lang="zh-CN">${esc(s.t)}</span>` : "", k: t("cNode"), p: SD_(s), col: "var(--ink)", snap: true });
    ev.sort((a, b) => a.y - b.y || (a.snap ? 1 : 0) - (b.snap ? 1 : 0));
    const box = document.createElement("div"); box.className = "chron";
    for (const e of ev) {
      const d = document.createElement("div");
      d.className = "ev" + (e.snap ? " snap" : ""); d.style.setProperty("--k", e.col);
      d.innerHTML = `<div class="yr">${esc(e.yt)}</div><div class="ln"><i></i></div><div class="evb"><b>${esc(e.t)}</b>${e.zh ? e.zh + " " : ""}<span class="k">${esc(e.k)}</span><p>${esc(e.p)}</p></div>`;
      d.addEventListener("click", () => {
        let j = SNAPS.findIndex(s => s.y >= e.y); if (j < 0) j = SNAPS.length - 1;
        setMode("map"); setSnap(j);
        if (e.i != null) requestAnimationFrame(() => select(e.i, false));
      });
      box.append(d);
    }
    wrap.append(box);
  }

  /* ---------------- 控件 ---------------- */
  document.getElementById("views").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    activeFit = b.dataset.fit;
    document.querySelectorAll("#views button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
    fitTo(activeFit, true);
  });
  document.getElementById("zin").addEventListener("click", () => setView(view.cx, view.cy, view.k * 1.6, true));
  document.getElementById("zout").addEventListener("click", () => setView(view.cx, view.cy, view.k / 1.6, true));
  document.getElementById("zreset").addEventListener("click", () => { selected = null; buildStates(); fitTo(activeFit, true); markRows(); });
  document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim(); render(); buildIndex(); buildTable(); buildChron(); });
  function setMode(m) {
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode === m ? "true" : "false"));
    stage.dataset.view = m;
    document.querySelectorAll(".maponly").forEach(x => x.hidden = (m !== "map"));
    document.getElementById("timebar").hidden = m !== "map";
    if (m === "map") requestAnimationFrame(() => { const keep = { ...view }; resize(); if (keep.k !== 1) { Object.assign(view, keep); render(); } });
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight" && si < SNAPS.length - 1) { stopPlay(); setSnap(si + 1); }
    if (e.key === "ArrowLeft" && si > 0) { stopPlay(); setSnap(si - 1); }
    if (e.key === "Escape") { selected = null; buildStates(); render(); markRows(); tip.dataset.on = "0"; }
  });

  /* ---------------- 语言切换 ---------------- */
  function applyStatic() {
    document.documentElement.lang = EN() ? "en" : "zh-CN";
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(n => n.textContent = t(n.dataset.t));
    document.querySelectorAll("[data-ta]").forEach(n => n.setAttribute("aria-label", t(n.dataset.ta)));
    document.querySelectorAll("[data-tt]").forEach(n => n.title = t(n.dataset.tt));
    document.querySelectorAll("[data-tp]").forEach(n => { n.placeholder = t(n.dataset.tp); n.setAttribute("aria-label", t(n.dataset.tp)); });
    document.querySelectorAll("#langsw button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false"));
    playBtn.title = playT ? t("pause") : t("play");
    setLeg(!legBody.hidden);
    readFonts();
  }
  function setLang(l) {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("zhanguo-lang", l); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + (l === "en" ? "#en" : "")); } catch (e) {}
    applyStatic();
    buildAxis(); setSnap(si, false);
    buildLegendLayers();
    buildStates(); render(); buildIndex(); buildTable(); buildChron();
  }
  document.getElementById("langsw").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setLang(b.dataset.lang); });

  /* ---------------- 启动 ---------------- */
  applyStatic();
  setSnap(Math.max(0, SNAPS.findIndex(s => s.y === GEO.first)), false);
  buildStates();
  buildIndex(); buildTable(); buildChron();
  resize();
})();
</script>
</body>
</html>
