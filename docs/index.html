<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>战国列国形势图</title>
<style>
  :root {
    --ground:#E3E2D9; --ground-deep:#D6D5C9; --paper:#F2F1EA; --paper-2:#EAE9E0;
    --ink:#1D1E23; --ink-2:#55575E; --ink-3:#83858C; --rule:#C7C5B8; --rule-soft:#D8D6CA;
    --accent:#2B5F87;
    --sea:#D5DCDB; --land:#ECEBE3; --coast:#A9AFAE; --border:#ADAA9A;
    --water:#7F9FB2; --water-fill:#B4C8D2; --range:#9C8F78; --wall:#4A4038; --road:#8C5A3A; --jun:#3B2722;
    --c-battle:#A3473A; --c-pass:#3B3B40; --c-city:#55575E; --c-culture:#2F7470; --c-capital:#1D1E23;
    --s-op:.52; --s-op-hi:.64;
    --s-0:#9A6A5C;--s-1:#7E9A6A;--s-2:#6B8DAA;--s-3:#978BB3;--s-4:#C09E62;--s-5:#B7868C;--s-6:#6FA39B;--s-7:#C7B271;--s-8:#9DAA6E;--s-9:#B09AC0;--s-10:#C9926F;--s-11:#83AB93;--s-12:#8FB0C4;--s-13:#B9A374;--s-14:#8AA2B8;--s-15:#C49AA0;--s-16:#A59A86;--s-17:#9A7096;--s-18:#9D784D;--s-19:#A86D76;--s-20:#CE96B0;--s-21:#B09FD2;--s-22:#83844E;--s-23:#B89CCD;--s-24:#9F8C57;--s-25:#6F7EAE;--s-26:#87B790;--s-27:#A8A2D6;--s-28:#4D89A5;--s-29:#78B9A2;--s-30:#688B60;--s-31:#777BAD;
    --shadow: 0 1px 2px rgba(29,30,35,.07), 0 8px 24px -12px rgba(29,30,35,.22);
    --f-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    --f-body:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --f-zh:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
    color-scheme: light;
  }
  /* 英文界面：西文衬线体、系统无衬线体，中文字体垫后 */
  html:lang(en) {
    --f-display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Songti SC","STSong","Noto Serif CJK SC",serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Noto Sans CJK SC",sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
      --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
      --accent:#78ADD8;
      --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
      --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
      --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
      --s-op:.34; --s-op-hi:.46;
      --s-0:#B98676;--s-1:#8FAE7B;--s-2:#7FA2C0;--s-3:#A99DC6;--s-4:#CDAE74;--s-5:#C9979D;--s-6:#82B7AE;--s-7:#D4C083;--s-8:#AEBB7F;--s-9:#C0ABD0;--s-10:#D6A382;--s-11:#95BDA5;--s-12:#A0C0D3;--s-13:#C8B386;--s-14:#9BB3C9;--s-15:#D5ACB2;--s-16:#B5AA97;--s-17:#AA81A6;--s-18:#B59066;--s-19:#C1858E;--s-20:#DFA8C1;--s-21:#C1B1E3;--s-22:#9B9C67;--s-23:#C9AEDE;--s-24:#B09D69;--s-25:#808FBE;--s-26:#99C8A2;--s-27:#B9B4E7;--s-28:#609AB5;--s-29:#8BCAB3;--s-30:#80A378;--s-31:#8F93C5;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ground:#15161A; --ground-deep:#101115; --paper:#1C1E23; --paper-2:#23252B;
    --ink:#E7E5DC; --ink-2:#A6A79F; --ink-3:#75777D; --rule:#33363D; --rule-soft:#292C32;
    --accent:#78ADD8;
    --sea:#111417; --land:#1C1E22; --coast:#3A4046; --border:#454951;
    --water:#4F7A93; --water-fill:#2A4352; --range:#6E6453; --wall:#C9BBA6; --road:#D39A70; --jun:#F3D2C4;
    --c-battle:#E07A68; --c-pass:#C9C7BF; --c-city:#A6A79F; --c-culture:#5CBAB3; --c-capital:#E7E5DC;
    --s-op:.34; --s-op-hi:.46;
    --s-0:#B98676;--s-1:#8FAE7B;--s-2:#7FA2C0;--s-3:#A99DC6;--s-4:#CDAE74;--s-5:#C9979D;--s-6:#82B7AE;--s-7:#D4C083;--s-8:#AEBB7F;--s-9:#C0ABD0;--s-10:#D6A382;--s-11:#95BDA5;--s-12:#A0C0D3;--s-13:#C8B386;--s-14:#9BB3C9;--s-15:#D5ACB2;--s-16:#B5AA97;--s-17:#AA81A6;--s-18:#B59066;--s-19:#C1858E;--s-20:#DFA8C1;--s-21:#C1B1E3;--s-22:#9B9C67;--s-23:#C9AEDE;--s-24:#B09D69;--s-25:#808FBE;--s-26:#99C8A2;--s-27:#B9B4E7;--s-28:#609AB5;--s-29:#8BCAB3;--s-30:#80A378;--s-31:#8F93C5;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 28px -14px rgba(0,0,0,.8);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--ground-deep); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto auto minmax(0,1fr); grid-template-columns: minmax(0,1fr); }

  /* masthead */
  .masthead { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; padding:12px 20px 11px; background:var(--paper); border-bottom:1px solid var(--rule); }
  .brand { display:flex; align-items:baseline; gap:12px; }
  .brand h1 { margin:0; font-family:var(--f-display); font-weight:600; font-size:20px; letter-spacing:.14em; }
  .brand .src { font-size:11px; letter-spacing:.18em; color:var(--ink-3); border-left:1px solid var(--rule); padding-left:12px; }
  .masthead .count { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); letter-spacing:.06em; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .seg { display:flex; border:1px solid var(--rule); border-radius:3px; overflow:hidden; }
  .seg button { background:transparent; border:0; padding:5px 10px; cursor:pointer; font-size:12px; letter-spacing:.06em; color:var(--ink-2); border-right:1px solid var(--rule-soft); white-space:nowrap; }
  .seg button:last-child { border-right:0; }
  .seg button:hover { background:var(--paper-2); color:var(--ink); }
  .seg button[aria-pressed="true"] { background:var(--ink); color:var(--paper); }
  .maponly[hidden] { display:none; }
  .search { position:relative; }
  .search input { width:170px; padding:5px 10px 5px 26px; border:1px solid var(--rule); border-radius:3px; background:var(--ground); font-size:12.5px; }
  .search input::placeholder { color:var(--ink-3); }
  .search svg { position:absolute; left:8px; top:50%; transform:translateY(-50%); opacity:.5; }

  /* timeline strip */
  .timebar { display:grid; grid-template-columns:auto minmax(0,1fr); align-items:stretch; background:var(--paper); border-bottom:1px solid var(--rule); }
  .timebar[hidden] { display:none; }
  .playcol { width:44px; border-right:1px solid var(--rule-soft); display:grid; grid-template-rows:minmax(0,1fr) auto; }
  .play { border:0; background:none; cursor:pointer; color:var(--ink-2); display:grid; place-items:center; }
  .play:hover { background:var(--paper-2); color:var(--ink); }
  .speed { border:0; border-top:1px solid var(--rule-soft); background:none; cursor:pointer; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); padding:4px 0; letter-spacing:.02em; }
  .speed:hover { background:var(--paper-2); color:var(--ink); }
  .speed[aria-pressed="true"] { color:var(--ink); font-weight:600; }
  .tb-main { min-width:0; display:grid; grid-template-rows:auto auto; }
  .axiswrap { overflow-x:auto; scrollbar-width:thin; padding:0 22px; }
  .axis { position:relative; height:96px; min-width:860px; }
  .axis .ln { position:absolute; left:0; right:0; top:25px; height:2px; background:var(--rule); border-radius:1px; }
  .axis .fill { position:absolute; left:0; top:25px; height:2px; background:var(--ink-2); border-radius:1px; }
  .axis .dec { position:absolute; top:3px; transform:translateX(-50%); font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); letter-spacing:.02em; pointer-events:none; }
  .axis .dec::after { content:""; position:absolute; left:50%; top:16px; width:1px; height:5px; background:var(--ink-3); }
  .axis .sd { position:absolute; top:20px; width:18px; margin-left:-9px; height:74px; border:0; padding:0; background:none; cursor:pointer; display:flex; flex-direction:column; align-items:center; color:var(--ink-2); }
  .axis .sd .d { width:9px; height:9px; margin-top:2px; border-radius:50%; background:var(--paper); border:1.5px solid var(--ink-3); box-sizing:border-box; flex:none; transition:transform .12s; }
  .axis .sd .t { margin-top:5px; writing-mode:vertical-rl; text-orientation:upright; font-family:var(--f-display); font-size:11.5px; line-height:1; letter-spacing:1px; white-space:nowrap; }
  .axis .sd:hover { color:var(--ink); }
  .axis .sd:hover .d { border-color:var(--ink); transform:scale(1.25); }
  .axis .sd.past .d { background:var(--ink-3); }
  .axis .sd[aria-pressed="true"] { color:var(--ink); }
  .axis .sd[aria-pressed="true"] .d { background:var(--ink); border-color:var(--ink); transform:scale(1.5); }
  .axis .sd[aria-pressed="true"] .t { font-weight:700; }
  .bchips { display:inline-flex; flex-wrap:wrap; gap:4px; margin-left:8px; vertical-align:1px; }
  .bchips .lb { font-size:11px; color:var(--c-battle); letter-spacing:.08em; align-self:center; margin-right:2px; }
  .bchips button { font-family:var(--f-display); font-size:12px; padding:0 7px; line-height:19px; border:1px solid color-mix(in srgb, var(--c-battle) 45%, transparent); background:color-mix(in srgb, var(--c-battle) 8%, transparent); color:var(--ink); border-radius:3px; cursor:pointer; }
  .bchips button:hover { background:color-mix(in srgb, var(--c-battle) 18%, transparent); }
  .step { background:none; border:1px solid var(--rule); border-radius:3px; width:22px; height:20px; line-height:1; cursor:pointer; color:var(--ink-2); margin-right:4px; font-size:14px; vertical-align:1px; padding:0; }
  .step:hover { background:var(--paper-2); color:var(--ink); }
  .step:disabled { opacity:.35; cursor:default; }
  .caption { padding:5px 16px 8px; font-size:12.5px; color:var(--ink-2); line-height:1.55; border-top:1px solid var(--rule-soft); }
  .caption b { font-family:var(--f-display); font-size:14px; color:var(--ink); letter-spacing:.08em; margin-right:8px; }
  .caption .y { margin-left:6px; }
  .caption .y { font-family:var(--f-mono); font-size:11px; color:var(--ink-3); margin-right:8px; }

  /* stage */
  .stage { display:grid; grid-template-columns:minmax(0,1fr) 348px; min-height:0; }
  .stage[data-view="table"], .stage[data-view="chron"] { grid-template-columns:minmax(0,1fr); }
  .stage[data-view="table"] .mapwrap, .stage[data-view="table"] .index,
  .stage[data-view="chron"] .mapwrap, .stage[data-view="chron"] .index { display:none; }
  .stage:not([data-view="table"]) .tablewrap { display:none; }
  .stage:not([data-view="chron"]) .chronwrap { display:none; }

  .mapwrap { position:relative; min-width:0; background:var(--sea); overflow:hidden; }
  #map { display:block; width:100%; height:100%; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #map.dragging { cursor:grabbing; }
  .map-text { font-family:var(--f-body); user-select:none; pointer-events:none; }
  .lbl-site { font-family:var(--f-display); font-weight:600; }
  .lbl-state { font-family:var(--f-display); font-weight:700; }
  .lbl-geo { letter-spacing:.2em; }
  .lbl-riv { font-family:var(--f-display); letter-spacing:.12em; font-style:italic; }
  .state-shape { cursor:pointer; }
  .hit { cursor:pointer; }

  .float { position:absolute; background:color-mix(in srgb, var(--paper) 93%, transparent); border:1px solid var(--rule); border-radius:3px; box-shadow:var(--shadow); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .legend { left:14px; bottom:14px; padding:10px 12px 11px; width:232px; max-height:calc(100% - 80px); overflow-y:auto; }
  .legend h2 { margin:0 0 6px; font-size:10px; font-weight:500; letter-spacing:.2em; color:var(--ink-3); display:flex; align-items:center; }
  .legend h2 button { margin-left:auto; background:none; border:0; cursor:pointer; color:var(--ink-3); font-size:11px; padding:0 2px; letter-spacing:.1em; }
  .legend h2 button:hover { color:var(--ink); }
  .legend .body[hidden] { display:none; }
  .legend .states { display:grid; grid-template-columns:1fr 1fr 1fr; gap:2px 6px; margin-bottom:9px; }
  .legend .states button { display:flex; align-items:center; gap:5px; background:none; border:0; padding:1px 2px; cursor:pointer; font-size:12px; color:var(--ink); text-align:left; border-radius:2px; font-family:var(--f-display); }
  .legend .states button:hover { background:var(--paper-2); }
  .legend .states button[data-gone="1"] { color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--ink-3); }
  .legend .states button[data-gone="1"] .sq { opacity:.25; }
  .sq { width:11px; height:11px; border-radius:2px; flex:none; background:var(--k); opacity:.85; }
  .sq.tr { background:color-mix(in srgb, var(--k) 55%, transparent); outline:1px dashed color-mix(in srgb, var(--k) 70%, var(--ink)); outline-offset:-1px; }
  .legend .states { max-height:172px; overflow-y:auto; scrollbar-width:thin; }
  .legend ul { list-style:none; margin:0; padding:0; display:grid; gap:0; }
  .legend li button { display:flex; align-items:center; gap:8px; width:100%; padding:2px 4px; background:none; border:0; cursor:pointer; text-align:left; border-radius:2px; font-size:12px; color:var(--ink); }
  .legend li button:hover { background:var(--paper-2); }
  .legend li button[aria-pressed="false"] { color:var(--ink-3); }
  .legend li button[aria-pressed="false"] svg { opacity:.3; }
  .legend .n { margin-left:auto; font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .legend .foot { margin-top:8px; padding-top:7px; border-top:1px solid var(--rule-soft); font-size:10.5px; line-height:1.5; color:var(--ink-3); }

  .zoomers { right:14px; top:14px; padding:4px; display:grid; gap:3px; }
  .zoomers button { width:27px; height:27px; display:grid; place-items:center; cursor:pointer; background:none; border:0; border-radius:2px; color:var(--ink-2); font-size:15px; line-height:1; }
  .zoomers button:hover { background:var(--paper-2); color:var(--ink); }
  .zoomers button.reset { font-size:10px; letter-spacing:.04em; }
  .inset { right:14px; bottom:14px; padding:6px 7px 4px; }
  .inset svg { display:block; }
  .inset .cap { font-size:9.5px; letter-spacing:.16em; color:var(--ink-3); text-align:center; margin-top:2px; }
  .scalebar { left:14px; top:14px; padding:6px 10px 5px; }
  .scalebar .bar { height:4px; border:1px solid var(--ink-2); border-top:0; }
  .scalebar .txt { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-2); text-align:center; letter-spacing:.04em; }

  .tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .12s; padding:9px 12px 10px; max-width:290px; z-index:5; }
  .tip[data-on="1"] { opacity:1; }
  .tip .old { font-family:var(--f-display); font-size:17px; font-weight:600; letter-spacing:.06em; }
  .tip .arrow { color:var(--ink-3); margin:0 6px; }
  .tip .new { font-size:13px; }
  .tip .meta { margin-top:4px; font-size:11.5px; color:var(--ink-2); }
  .tip .meta .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); }
  .tip .note { margin-top:6px; font-size:11.5px; line-height:1.6; color:var(--ink-2); border-top:1px solid var(--rule-soft); padding-top:6px; }
  .tag { display:inline-block; font-size:10.5px; padding:0 5px; border-radius:2px; background:var(--paper-2); color:var(--ink-2); margin-right:4px; letter-spacing:.04em; }
  .tag.st { background:color-mix(in srgb, var(--k) 30%, transparent); color:var(--ink); }

  /* index panel */
  .index { border-left:1px solid var(--rule); background:var(--paper); overflow-y:auto; overscroll-behavior:contain; min-height:0; }
  .grp { border-bottom:1px solid var(--rule-soft); }
  .grp > h2 { position:sticky; top:0; z-index:2; margin:0; display:flex; align-items:center; gap:8px; padding:7px 14px; background:var(--paper-2); border-bottom:1px solid var(--rule-soft); font-size:11px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); cursor:pointer; user-select:none; }
  .grp > h2 .bar { width:3px; height:12px; background:var(--k); border-radius:1px; }
  .grp > h2 .sub { margin-left:auto; font-family:var(--f-mono); font-size:10px; letter-spacing:.04em; color:var(--ink-3); font-weight:400; }
  .grp > h2 .chev { font-size:9px; color:var(--ink-3); transition:transform .15s; }
  .grp[data-closed="1"] > h2 .chev { transform:rotate(-90deg); }
  .grp[data-closed="1"] ol { display:none; }
  .grp ol { list-style:none; margin:0; padding:3px 0 5px; }
  .row { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; align-items:baseline; width:100%; padding:5px 14px; background:none; border:0; cursor:pointer; text-align:left; border-left:2px solid transparent; }
  .row:hover { background:var(--paper-2); }
  .row[data-sel="1"] { background:var(--paper-2); border-left-color:var(--k); }
  .row .o { font-family:var(--f-display); font-size:15.5px; font-weight:600; letter-spacing:.05em; white-space:nowrap; display:flex; align-items:center; gap:6px; }
  .row .o .sq { width:10px; height:10px; }
  .row .m { font-size:12px; color:var(--ink-2); }
  .row .mt { grid-column:1 / -1; font-size:11px; color:var(--ink-2); }
  .row .mt .mono { font-family:var(--f-mono); font-size:10.5px; color:var(--ink-3); margin-right:6px; }
  .row .n { grid-column:1 / -1; font-size:11.5px; color:var(--ink-3); line-height:1.55; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .row[data-sel="1"] .n { -webkit-line-clamp:unset; display:block; color:var(--ink-2); }
  .row[data-future="1"] .o { color:var(--ink-3); }
  .empty { padding:24px 16px; color:var(--ink-3); font-size:12.5px; }

  /* table + chronology */
  .tablewrap, .chronwrap { overflow:auto; background:var(--paper); min-height:0; padding:0 0 40px; }
  .intro { padding:18px 16px 14px; max-width:70ch; }
  .intro p { margin:0 0 8px; font-size:13px; color:var(--ink-2); line-height:1.7; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  thead th { position:sticky; top:0; background:var(--paper-2); text-align:left; padding:8px 14px; font-size:10.5px; font-weight:600; letter-spacing:.16em; color:var(--ink-2); border-bottom:1px solid var(--rule); white-space:nowrap; z-index:1; }
  tbody td { padding:7px 14px; border-bottom:1px solid var(--rule-soft); vertical-align:top; }
  tbody tr:hover { background:var(--paper-2); }
  tbody tr.click { cursor:pointer; }
  td.o { font-family:var(--f-display); font-size:15px; font-weight:600; letter-spacing:.05em; white-space:nowrap; }
  td.cat { white-space:nowrap; font-size:11.5px; color:var(--ink-2); }
  td.cat .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--k); margin-right:6px; vertical-align:middle; }
  td.num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:11.5px; color:var(--ink-3); white-space:nowrap; }
  td.note { font-size:12px; color:var(--ink-2); line-height:1.6; min-width:22ch; max-width:72ch; }
  .chron { max-width:900px; padding:0 16px; }
  .ev { display:grid; grid-template-columns:96px 16px minmax(0,1fr); gap:0 10px; cursor:pointer; }

  const DATA = {"items":[{"c":"state","k":"秦","old":"秦","mod":"嬴姓赵氏","note":"都城：雍 → 栎阳（前383）→ 咸阳（前350）。\n变法：秦孝公用商鞅两次变法（前356、前350）——废井田、开阡陌，行县制，奖励耕战，立二十等军功爵。\n名君：孝公、惠文王（前325 称王，次年改元）、武王、昭襄王、秦王政。\n将相：商鞅、张仪、司马错、魏冉、范雎（远交近攻）、白起、吕不韦、王翦、王贲、李斯。\n扩张：前330–328 得魏河西、上郡；前316 灭巴蜀；前312 取汉中；前278 拔郢置南郡；前272 灭义渠；前260 长平之战；前256、前249 灭二周；前230–前221 十年间尽灭六国。\n前221 统一天下，王政称始皇帝，分天下为三十六郡。\n统一后继续扩张：前215 蒙恬北逐匈奴、取河南地，前214 置九原郡并连接秦赵燕旧长城为“万里长城”；同年平定岭南，置南海、桂林、象郡。又修驰道、直道，凿灵渠。前210 始皇死于沙丘，前209 陈胜吴广起事，前207 秦亡。","i":0,"eold":"Qin","emod":"Ying surname, Zhao lineage","enote":"Capitals: Yong → Yueyang (383 BC) → Xianyang (350 BC).\nReforms: Duke Xiao of Qin had Shang Yang carry out two rounds of reform (356 and 350 BC): the well-field system was abolished and the field boundaries opened, counties were instituted, farming and fighting were rewarded, and a twenty-rank scale of military merit was created.\nNotable rulers: Duke Xiao, King Huiwen (took the title of king in 325 BC and began a new reign era the next year), King Wu, King Zhaoxiang, King Zheng of Qin.\nGenerals and ministers: Shang Yang, Zhang Yi, Sima Cuo, Wei Ran, Fan Ju (\"ally with the distant, attack the near\"), Bai Qi, Lü Buwei, Wang Jian, Wang Ben, Li Si.\nExpansion: 330–328 BC gained Wei's Hexi and Shang Commandery; 316 BC conquered Ba and Shu; 312 BC took Hanzhong; 278 BC took Ying and set up Nan Commandery; 272 BC destroyed Yiqu; 260 BC Battle of Changping; 256 and 249 BC destroyed the two Zhou; 230–221 BC destroyed all six states within ten years.\nIn 221 BC Qin unified the realm; King Zheng took the title First Emperor and divided the realm into thirty-six commanderies.\nExpansion continued after unification: in 215 BC Meng Tian drove the Xiongnu north and took Henandi; in 214 BC Jiuyuan Commandery was set up and the old long walls of Qin, Zhao and Yan were joined into the \"Great Wall\"; the same year Lingnan was pacified and the Nanhai, Guilin and Xiang commanderies were set up. The imperial highways and the Straight Road were built and the Lingqu Canal cut. The First Emperor died at Shaqiu in 210 BC; Chen Sheng and Wu Guang rose in 209 BC; Qin fell in 207 BC."},{"c":"state","k":"楚","old":"楚","mod":"芈姓熊氏","note":"都城：郢（纪南城）→ 陈（前278）→ 巨阳（前253）→ 寿春（前241）。\n战国疆域最广的国家：据江汉、江淮，南抵五岭，东灭越后尽有吴越故地。\n变法：楚悼王任吴起变法（约前386–前381），悼王死后吴起被旧贵族射杀，变法中辍。\n名君：悼王、威王（前333 败越，北破齐于徐州）、怀王（受张仪之欺，丹阳、蓝田两败；约前306 灭越、置江东郡；前299 入秦被扣，客死于秦）、顷襄王、考烈王。\n人物：吴起、屈原、召滑（入越行间）、春申君黄歇、庄蹻（入滇）、项燕。\n前223 王翦、蒙武破楚于蕲南，虏楚王负刍；前222 秦定楚江南地。","i":1,"eold":"Chu","emod":"Mi surname, Xiong lineage","enote":"Capitals: Ying (Jinancheng) → Chen (278 BC) → Juyang (253 BC) → Shouchun (241 BC).\nThe largest state of the Warring States: it held the Yangtze–Han and Yangtze–Huai regions, reached the Five Ridges in the south, and after destroying Yue held all the old lands of Wu and Yue in the east.\nReforms: King Dao of Chu had Wu Qi carry out reforms (c. 386–381 BC); after Dao's death Wu Qi was shot dead by the old nobility and the reforms were abandoned.\nNotable rulers: King Dao; King Wei (defeated Yue in 333 BC and crushed Qi at Xuzhou in the north); King Huai (deceived by Zhang Yi, defeated at Danyang and Lantian; destroyed Yue and set up Jiangdong Commandery c. 306 BC; went to Qin in 299 BC, was detained, and died there); King Qingxiang; King Kaolie.\nPeople: Wu Qi, Qu Yuan, Shao Hua (who went to Yue to sow discord), Lord Chunshen Huang Xie, Zhuang Qiao (who entered Dian), Xiang Yan.\nIn 223 BC Wang Jian and Meng Wu crushed Chu at Qinan and captured Fuchu, king of Chu; in 222 BC Qin pacified Chu's lands south of the Yangtze."},{"c":"state","k":"齐","old":"齐","mod":"妫姓田氏（田齐）","note":"都城：临淄。前386 田和列为诸侯，田氏代姜齐。\n齐威王任邹忌改革，扩建稷下学宫（始设于田齐桓公），诸子百家云集。\n桂陵（前353）、马陵（前341）两败魏军，与秦东西并峙；前288 齐湣王与秦昭王并称东、西帝。\n前286 灭宋，前284 遭燕将乐毅率五国联军攻破，仅余莒、即墨；前279 田单火牛阵复国，然国力大衰。\n人物：邹忌、田忌、孙膑、孟尝君田文、田单、鲁仲连。\n前221 王贲自燕南攻齐，齐王建不战而降，六国尽灭。","i":2,"eold":"Qi","emod":"Gui surname, Tian lineage (Tian Qi)","enote":"Capital: Linzi. In 386 BC Tian He was recognised as a feudal lord, and the Tian lineage replaced the Jiang house of Qi.\nKing Wei of Qi had Zou Ji carry out reforms and enlarged the Jixia Academy (first set up under Duke Huan of the Tian house of Qi), where the Hundred Schools gathered.\nDefeated Wei twice, at Guiling (353 BC) and Maling (341 BC), and stood as Qin's equal in the east; in 288 BC King Min of Qi and King Zhao of Qin styled themselves Emperor of the East and Emperor of the West.\nDestroyed Song in 286 BC; in 284 BC overrun by the five-state coalition led by the Yan general Yue Yi, keeping only Ju and Jimo; in 279 BC Tian Dan restored the state with his fire-ox formation, but Qi was greatly weakened.\nPeople: Zou Ji, Tian Ji, Sun Bin, Lord Mengchang Tian Wen, Tian Dan, Lu Zhonglian.\nIn 221 BC Wang Ben attacked Qi southward from Yan; Jian, king of Qi, surrendered without a fight, and the last of the six states was gone."},{"c":"state","k":"燕","old":"燕","mod":"姬姓","note":"都城：蓟（上都）；武阳（下都，今易县）。\n前316 燕王哙让国于子之，前314 国中大乱，齐宣王乘机破燕。燕昭王师事郭隗、筑黄金台招贤，乐毅、邹衍、剧辛皆至。\n约前300 燕将秦开袭破东胡，东胡却千余里，燕置上谷、渔阳、右北平、辽西、辽东五郡，筑长城自造阳至襄平。\n前284 乐毅破齐，几亡齐国。前227 太子丹遣荆轲刺秦王。\n前226 秦拔蓟，燕王喜走辽东；前222 王贲攻辽东，虏燕王喜。","i":3,"eold":"Yan","emod":"Ji surname","enote":"Capitals: Ji (Upper Capital); Wuyang (Lower Capital, modern Yi County).\nIn 316 BC King Kuai of Yan ceded the throne to Zizhi; in 314 BC the state fell into chaos, and King Xuan of Qi seized the chance to crush Yan. King Zhao of Yan took Guo Wei as his teacher and built the Golden Terrace to attract talent, and Yue Yi, Zou Yan and Ju Xin all came.\nAround 300 BC the Yan general Qin Kai made a surprise attack on the Donghu and routed them, who fell back more than a thousand li; Yan set up the five commanderies of Shanggu, Yuyang, Youbeiping, Liaoxi and Liaodong and built a long wall from Zaoyang to Xiangping.\nIn 284 BC Yue Yi crushed Qi and almost destroyed it. In 227 BC Crown Prince Dan sent Jing Ke to assassinate the king of Qin.\nIn 226 BC Qin took Ji, and Xi, king of Yan, fled to Liaodong; in 222 BC Wang Ben attacked Liaodong and captured him."},{"c":"state","k":"赵","old":"赵","mod":"嬴姓赵氏","note":"都城：晋阳 → 中牟（前425）→ 邯郸（前386）。前403 与韩、魏同列为诸侯（三家分晋）。\n赵武灵王推行胡服骑射（前307），灭中山（前296），北破林胡、楼烦，置云中、雁门、代郡，筑长城至高阙。\n蔺相如完璧归赵、将相和；赵奢阏与之胜；前260 长平之战惨败，此后元气大伤。\n李牧北破匈奴、南却强秦（肥、番吾），前229 秦行反间，赵王迁杀李牧。\n前228 秦破邯郸，虏赵王迁；公子嘉奔代称代王，前222 亡。","i":4,"eold":"Zhao","emod":"Ying surname, Zhao lineage","enote":"Capitals: Jinyang → Zhongmou (425 BC) → Handan (386 BC). In 403 BC recognised as a feudal lord together with Han and Wei (the partition of Jin).\nKing Wuling of Zhao adopted nomad dress and mounted archery (307 BC), destroyed Zhongshan (296 BC), crushed the Linhu and Loufan in the north, set up the Yunzhong, Yanmen and Dai commanderies, and built a long wall reaching Gaoque.\nLin Xiangru returned the jade disc intact to Zhao, and the general and the minister were reconciled; Zhao She won at Yuyu; the crushing defeat at Changping in 260 BC left Zhao badly weakened.\nLi Mu crushed the Xiongnu in the north and repelled mighty Qin in the south (at Fei and Powu); in 229 BC Qin sowed discord, and Qian, king of Zhao, had Li Mu killed.\nIn 228 BC Qin took Handan and captured King Qian; Prince Jia fled to Dai and styled himself king of Dai; Dai fell in 222 BC."},{"c":"state","k":"魏","old":"魏","mod":"姬姓魏氏","note":"都城：安邑 → 大梁（前361，一说前364），故魏又称“梁”。\n魏文侯任李悝变法、吴起取河西、西门豹治邺、乐羊灭中山，魏为战国初期第一强国。\n魏惠王（梁惠王）称霸中原，但桂陵、马陵两败于齐，又失河西、上郡于秦，由盛转衰。\n开鸿沟，连通河、淮。战国后期信陵君窃符救赵、合纵破秦于河外。\n前225 王贲引河沟之水灌大梁，魏王假降。","i":5,"eold":"Wei","emod":"Ji surname, Wei lineage","enote":"Capitals: Anyi → Daliang (361 BC, or 364 BC), hence Wei was also called \"Liang\".\nMarquis Wen of Wei employed Li Kui to carry out reforms, Wu Qi to take Hexi, Ximen Bao to govern Ye and Yue Yang to destroy Zhongshan, making Wei the strongest state of the early Warring States.\nKing Hui of Wei (King Hui of Liang) dominated the Central Plains, but after two defeats by Qi at Guiling and Maling and the loss of Hexi and Shang Commandery to Qin, Wei went into decline.\nWei cut the Honggou Canal, linking the He and the Huai. In the late Warring States Lord Xinling stole the tally to rescue Zhao and led a vertical alliance that defeated Qin at Hewai.\nIn 225 BC Wang Ben flooded Daliang with water from the He and the Honggou, and Jia, king of Wei, surrendered."},{"c":"state","k":"韩","old":"韩","mod":"姬姓韩氏","note":"都城：平阳 → 宜阳 → 阳翟 → 新郑（前375 灭郑后迁都）。\n七雄中最弱，地处“四战之地”，西有强秦，东、北、南为魏、赵、楚所环。\n韩昭侯任申不害为相（前355–前337），以“术”治国，“国治兵强，无侵韩者”。\n前262 秦断上党与本土联系，上党守冯亭以地降赵，引发长平之战。韩派水工郑国入秦修渠以“疲秦”，反助秦富强。\n韩非为韩国公子。前230 内史腾攻韩，虏韩王安，置颍川郡——六国中最先灭亡。","i":6,"eold":"Han","emod":"Ji surname, Han lineage","enote":"Capitals: Pingyang → Yiyang → Yangzhai → Xinzheng (moved there after destroying Zheng in 375 BC).\nThe weakest of the seven powers, a \"land open to war on all four sides\": mighty Qin to the west, and Wei, Zhao and Chu surrounding it to the east, north and south.\nMarquis Zhao of Han made Shen Buhai chancellor (355–337 BC), governing by \"technique\"; \"the state was well ordered and its army strong, and no one invaded Han\".\nIn 262 BC Qin cut Shangdang off from the Han heartland, and Feng Ting, governor of Shangdang, surrendered the territory to Zhao, setting off the Battle of Changping. Han sent the hydraulic engineer Zheng Guo to build a canal in Qin to \"exhaust Qin\", but it only made Qin richer and stronger.\nHan Fei was a prince of Han. In 230 BC Teng, the Neishi, attacked Han, captured An, king of Han, and set up Yingchuan Commandery: the first of the six states to fall."},{"c":"state","k":"周","old":"周（王畿）","mod":"姬姓","note":"天下共主，但战国时只剩洛阳附近一隅之地。\n前367 周分裂为西周（都河南王城）与东周（都巩）两个小国。\n前256 秦灭西周，周赧王卒，九鼎入秦；前249 秦相吕不韦灭东周。延续约八百年的周朝终结。","i":7,"eold":"Zhou (royal domain)","emod":"Ji surname","enote":"Common sovereign of all under Heaven, but in the Warring States left with only a corner of land around Luoyang.\nIn 367 BC Zhou split into two small states, West Zhou (capital Wangcheng at Henan) and East Zhou (capital Gong).\nIn 256 BC Qin destroyed West Zhou, King Nan of Zhou died, and the Nine Tripods went to Qin; in 249 BC the Qin chancellor Lü Buwei destroyed East Zhou. The Zhou dynasty, which had lasted some eight hundred years, came to an end."},{"c":"state","k":"宋","old":"宋","mod":"子姓（商王后裔）","note":"都城：商丘（睢阳）。地处中原东部，富庶而四面受敌。\n宋君偃（康王）称王，“射天笞地”，诸侯称为“桀宋”。\n前286 齐湣王灭宋，其地后为魏、楚所分；灭宋直接引发五国伐齐。\n庄子为宋国蒙人；墨子一说亦为宋人。","i":8,"eold":"Song","emod":"Zi surname (descendants of the Shang kings)","enote":"Capital: Shangqiu (Suiyang). In the east of the Central Plains, rich but surrounded by enemies.\nYan, ruler of Song (King Kang), took the title of king; he \"shot at Heaven and flogged the Earth\", and the lords called him \"the Jie of Song\".\nIn 286 BC King Min of Qi destroyed Song, whose lands were later divided between Wei and Chu; the destruction of Song directly provoked the five-state attack on Qi.\nZhuangzi was a man of Meng in Song; according to one view, Mozi was also from Song."},{"c":"state","k":"卫","old":"卫","mod":"姬姓","note":"都城：帝丘（濮阳）。战国时降为小国，先后依附魏、秦。\n商鞅、吴起、吕不韦、荆轲皆出自卫国。\n前242 秦置东郡，前241 拔濮阳并入东郡，徙卫君于野王（《卫世家》作卫元君，《秦始皇本纪》作君角），卫作为秦的附庸延续至前209，被秦二世废为庶人——周代封国中最后灭亡者。","i":9,"eold":"Wey","emod":"Ji surname","enote":"Capital: Diqiu (Puyang). Reduced to a small state in the Warring States, a dependent first of Wei, then of Qin.\nShang Yang, Wu Qi, Lü Buwei and Jing Ke all came from Wey.\nIn 242 BC Qin set up Dong Commandery, and in 241 BC it took Puyang and added it to Dong Commandery, moving the lord of Wey to Yewang (Lord Yuan of Wey in the Wey chapter of the Shiji, Lord Jue in the Basic Annals of the First Emperor); Wey survived as a Qin dependency until 209 BC, when the Second Emperor of Qin reduced its lord to a commoner: the last of the Zhou fiefs to fall."},{"c":"state","k":"鲁","old":"鲁","mod":"姬姓","note":"都城：曲阜。周公之后，礼乐之邦，孔子故国，儒学中心。战国时国势衰微。\n前255 楚考烈王取鲁，封鲁君于莒；前249 灭鲁，迁鲁顷公于卞为家人。","i":10,"eold":"Lu","emod":"Ji surname","enote":"Capital: Qufu. Ruled by the descendants of the Duke of Zhou; a land of ritual and music, Confucius's home state and the centre of Confucian learning. Weak in the Warring States.\nIn 255 BC King Kaolie of Chu took Lu and enfeoffed the lord of Lu at Ju; in 249 BC he destroyed Lu and moved Duke Qing of Lu to Bian as a commoner."},{"c":"state","k":"中山","old":"中山","mod":"姬姓（白狄鲜虞）","note":"都城：顾 → 灵寿。“千乘之国”，夹于燕、赵之间。\n前406 魏将乐羊灭中山，约前380 复国；前323 与魏、韩、赵、燕“五国相王”。\n中山王厝墓出土错金银铜器、“中山三器”等，工艺冠绝一时。\n前296 赵武灵王灭中山。","i":11,"eold":"Zhongshan","emod":"Ji surname (Xianyu of the White Di)","enote":"Capitals: Gu → Lingshou. A \"state of a thousand chariots\", wedged between Yan and Zhao.\nIn 406 BC the Wei general Yue Yang destroyed Zhongshan, which was restored around 380 BC; in 323 BC it joined Wei, Han, Zhao and Yan in \"five states hailing one another as kings\".\nThe tomb of King Cuo of Zhongshan yielded bronzes inlaid with gold and silver, the \"Three Vessels of Zhongshan\" and more, unsurpassed in craftsmanship in their day.\nKing Wuling of Zhao destroyed Zhongshan in 296 BC."},{"c":"state","k":"越","old":"越","mod":"姒姓","note":"都城：会稽 → 琅琊（前468）→ 吴（前379，《竹书纪年》：“于粤子翳三十三年，迁于吴”）。勾践灭吴（前473）后称霸东南。\n战国时内乱频仍，《庄子》称“越人三世弑其君”：前375 太子诸咎弑越王翳，前365 前后寺区之弟思弑越王莽安。\n前312 越王仍遣使向魏献乘舟、舟三百、箭五百万及犀角象齿（《竹书纪年》），可见此时越尚为有实力的王国。\n灭亡年代有两说：① 传统说据《史记·越世家》《资治通鉴》，前334/前333 楚威王大败越，杀越王无疆；② 杨宽等据《史记·甘茂列传》《战国策·楚策》范环语、《楚世家》昭雎语及《韩非子》“邵滑……五年而能亡越”，考定楚怀王遣召滑入越制造内乱，约前306 乘乱灭越，杀无疆，尽取故吴地至浙江，置江东郡。本图采用前306 说，前333 一役视为楚越战争的前段。\n此后越人散居浙江以南沿海，“或为王，或为君，滨于江南海上，服朝于楚”；前222 王翦“降越君，置会稽郡”。东瓯、闽越皆其后裔。","i":12,"eold":"Yue","emod":"Si surname","enote":"Capitals: Kuaiji → Langya (468 BC) → Wu (379 BC; Bamboo Annals: \"in the 33rd year of Yi, viscount of Yue, he moved to Wu\"). After Goujian destroyed Wu (473 BC), Yue was hegemon of the southeast.\nIn the Warring States it was riven by repeated internal strife; the Zhuangzi says \"the people of Yue killed their rulers three generations running\": in 375 BC Crown Prince Zhujiu killed Yi, king of Yue, and around 365 BC Si, younger brother of Si'ou, killed Mang'an, king of Yue.\nIn 312 BC the king of Yue still sent envoys to Wei with a state barge, three hundred boats, five million arrows, rhinoceros horn and ivory (Bamboo Annals), showing that Yue was then still a kingdom of substance.\nThere are two views of when it fell: (1) the traditional view, based on the Yue chapter of the Shiji and the Zizhi Tongjian, that in 334/333 BC King Wei of Chu routed Yue and killed Wujiang, king of Yue; (2) Yang Kuan and others, from the biography of Gan Mao in the Shiji, Fan Huan's words in the Chu section of the Zhanguo ce, Zhao Ju's words in the Chu chapter of the Shiji, and the Hanfeizi's \"Shao Hua … within five years was able to destroy Yue\", conclude that King Huai of Chu sent Shao Hua into Yue to stir up internal strife, destroyed Yue in the turmoil around 306 BC, killed Wujiang, took all the old lands of Wu up to the Zhe River, and set up Jiangdong Commandery. This map follows the 306 BC view and treats the battle of 333 BC as an earlier stage of the Chu–Yue wars.\nAfterwards the Yue people scattered along the coast south of the Zhe River, \"some as kings, some as lords, on the coast south of the Yangtze, paying court to Chu\"; in 222 BC Wang Jian \"received the surrender of the lords of Yue and set up Kuaiji Commandery\". The Dong'ou and Minyue were their descendants."},{"c":"state","k":"巴","old":"巴","mod":"姬姓（一说廪君之后）","note":"都城：江州（今重庆），后期亦都阆中。巴人勇锐善战，以“巴渝舞”著称。\n与蜀世为仇雠。前316 秦司马错、张仪乘巴蜀相攻，灭蜀后又灭巴，置巴郡。","i":13,"eold":"Ba","emod":"Ji surname (one view: descendants of Lord Lin)","enote":"Capital: Jiangzhou (modern Chongqing), later also Langzhong. The Ba were brave and fierce warriors, famous for the Ba–Yu dance.\nHereditary enemies of Shu. In 316 BC Sima Cuo and Zhang Yi of Qin took advantage of the war between Ba and Shu, destroyed Shu and then Ba, and set up Ba Commandery."},{"c":"state","k":"蜀","old":"蜀","mod":"开明氏","note":"都城：成都。沃野千里，秦取之后成为统一战争的粮仓。\n北有汉中盆地：《华阳国志》说周显王时“蜀王有褒、汉之地”，秦灭蜀后“分巴、蜀置汉中郡”。\n前316 秦惠文王从司马错之议，经金牛道（石牛道）伐蜀，灭之，置蜀郡。\n约前256–前251 秦蜀守李冰修都江堰，成都平原“水旱从人，不知饥馑”。","i":14,"eold":"Shu","emod":"Kaiming lineage","enote":"Capital: Chengdu. A thousand li of fertile land, which after the Qin conquest became the granary of the wars of unification.\nTo the north lay the Hanzhong basin: the Huayang guozhi says that in the time of King Xian of Zhou \"the king of Shu held the lands of Bao and Han\", and that after conquering Shu, Qin \"divided off parts of Ba and Shu to set up Hanzhong Commandery\".\nIn 316 BC King Huiwen of Qin followed Sima Cuo's advice, attacked Shu by the Jinniu (Shiniu) Road, destroyed it and set up Shu Commandery.\nAround 256–251 BC Li Bing, the Qin governor of Shu, built Dujiangyan, so that on the Chengdu Plain \"flood and drought obey man, and famine is unknown\"."},{"c":"state","k":"苴","old":"苴","mod":"开明氏（蜀王之弟）","note":"都城：葭萌（今四川广元昭化）。据《华阳国志·蜀志》，蜀王“别封弟葭萌于汉中，号苴侯，命其邑曰葭萌”，扼守蜀北门户、金牛道（石牛道）要冲。\n苴侯与巴王交好，而巴与蜀世为仇雠。蜀王怒而伐苴，苴侯奔巴，巴、苴求救于秦。\n前316 秦惠文王遣司马错、张仪由石牛道伐蜀，灭蜀之后“遂取苴与巴”。苴国是秦灭巴蜀的直接导火索，存续不过数十年。\n“封于汉中”的“汉中”是常璩的泛称，他把葭萌也写进了《汉中志》。苴的地盘在嘉陵江上游的葭萌一带，汉中盆地的南郑仍归蜀王直辖，所以蜀国被苴隔成南北两块。宁强、略阳一带归苴还是归蜀，史书没有记载，图上只是示意。","i":15,"eold":"Ju","emod":"Kaiming lineage (brother of the king of Shu)","enote":"Capital: Jiameng (modern Zhaohua, Guangyuan, Sichuan). According to the Shu treatise of the Huayang guozhi, the king of Shu \"enfeoffed his younger brother Jiameng separately in Hanzhong, with the title Marquis of Ju, and named his town Jiameng\"; it guarded the northern gateway of Shu at a key point on the Jinniu (Shiniu) Road.\nThe Marquis of Ju was on good terms with the king of Ba, while Ba and Shu were hereditary enemies. The king of Shu attacked Ju in anger, the Marquis of Ju fled to Ba, and Ba and Ju appealed to Qin for help.\nIn 316 BC King Huiwen of Qin sent Sima Cuo and Zhang Yi down the Stone Ox Road against Shu; after destroying Shu they \"went on to take Ju and Ba\". Ju was the direct trigger of the Qin conquest of Ba and Shu, and lasted no more than a few decades.\nThe \"Hanzhong\" of \"enfeoffed in Hanzhong\" is Chang Qu's broad usage: he also placed Jiameng in his Hanzhong treatise. Ju's territory lay around Jiameng on the upper Jialing River, while Nanzheng in the Hanzhong basin remained under the direct rule of the king of Shu, so that Ju split Shu into northern and southern parts. Whether the area around Ningqiang and Lüeyang belonged to Ju or to Shu is not recorded; the map shows it only schematically."},{"c":"state","k":"义渠","old":"义渠","mod":"西戎","note":"西戎之一，筑城郭而居，在今甘肃庆阳、宁夏南部一带，与秦长期攻战。\n前272 秦宣太后诱杀义渠王于甘泉宫，秦发兵灭义渠，秦遂有陇西、北地、上郡，并筑长城以拒胡。","i":16,"eold":"Yiqu","emod":"Western Rong","enote":"One of the Western Rong, who lived in walled towns in what is now Qingyang in Gansu and southern Ningxia, and fought Qin for a long time.\nIn 272 BC Queen Dowager Xuan of Qin lured the king of Yiqu to the Ganquan Palace and killed him; Qin sent troops to destroy Yiqu, and so Qin held the Longxi, Beidi and Shang commanderies; it also built a long wall against the Hu."},{"c":"state","k":"晋","old":"晋","mod":"姬姓","note":"都城：新田（新绛，今山西侯马）。春秋霸主，春秋末国政归智、赵、韩、魏四卿。\n前453 三家灭智、分其地；至幽公时晋君仅有绛与曲沃，反朝于三家。前403 周王命赵、魏、韩为诸侯。\n前376 魏武侯、韩哀侯、赵敬侯废晋静公为家人，三分其余地，晋绝祀（一说前349 静公被杀于屯留）。","i":17,"eold":"Jin","emod":"Ji surname","enote":"Capital: Xintian (New Jiang, modern Houma, Shanxi). A hegemon of the Spring and Autumn; at the end of that period power passed to the four ministerial lineages of Zhi, Zhao, Han and Wei.\nIn 453 BC the three lineages destroyed the Zhi and divided its land; by the time of Duke You the ruler of Jin kept only Jiang and Quwo and in turn paid court to the three lineages. In 403 BC the Zhou king recognised Zhao, Wei and Han as feudal lords.\nIn 376 BC Marquis Wu of Wei, Marquis Ai of Han and Marquis Jing of Zhao deposed Duke Jing of Jin, reducing him to a commoner, and divided up what remained of his land; the sacrifices of Jin were cut off (one view: Duke Jing was killed at Tunliu in 349 BC)."},{"c":"state","k":"郑","old":"郑","mod":"姬姓","note":"都城：新郑（春秋时径称郑）。春秋时“朝晋暮楚”的中原要国。\n战国初国势日蹙，屡受韩、魏、楚攻伐：前423 韩伐郑，杀郑幽公；前396 驷子阳之党弑郑繻公，国内大乱。\n前375 韩哀侯灭郑，迁都新郑。","i":18,"eold":"Zheng","emod":"Ji surname","enote":"Capital: Xinzheng (in the Spring and Autumn simply called Zheng). A key state of the Central Plains in the Spring and Autumn, \"siding with Jin in the morning and Chu in the evening\".\nEarly in the Warring States it grew steadily weaker under repeated attacks by Han, Wei and Chu: in 423 BC Han attacked Zheng and killed Duke You of Zheng; in 396 BC the faction of Si Ziyang killed Duke Xu of Zheng, and the state fell into great disorder.\nIn 375 BC Marquis Ai of Han destroyed Zheng and moved his capital to Xinzheng."},{"c":"state","k":"吴","old":"吴","mod":"姬姓","note":"都城：吴（姑苏，今江苏苏州）。春秋末与越世仇，夫差曾败越于夫椒、败齐于艾陵、与晋争长于黄池。\n前475 越军围吴，三年城破；前473 夫差自杀，吴亡于越，其地尽入越。","i":19,"eold":"Wu","emod":"Ji surname","enote":"Capital: Wu (Gusu, modern Suzhou, Jiangsu). At the end of the Spring and Autumn a hereditary enemy of Yue; Fuchai had defeated Yue at Fujiao, defeated Qi at Ailing and contested precedence with Jin at Huangchi.\nIn 475 BC the Yue army besieged Wu, and after three years the city fell; in 473 BC Fuchai killed himself and Wu fell to Yue, all its land passing to Yue."},{"c":"state","k":"蔡","old":"蔡","mod":"姬姓","note":"都城：州来（下蔡，今安徽凤台）。春秋末迁此依吴自保，吴亡后孤立于淮上。前447 楚惠王灭蔡。","i":20,"eold":"Cai","emod":"Ji surname","enote":"Capital: Zhoulai (Xiacai, modern Fengtai, Anhui). At the end of the Spring and Autumn Cai moved here to secure itself by relying on Wu; after Wu fell it stood isolated on the Huai. King Hui of Chu destroyed Cai in 447 BC."},{"c":"state","k":"杞","old":"杞","mod":"姒姓","note":"都城：淳于（今山东安丘东北）。夏禹之后，春秋时自河南杞县东迁山东。前445 楚惠王灭杞。","i":21,"eold":"Qi","emod":"Si surname","enote":"Capital: Chunyu (NE of modern Anqiu, Shandong). Descendants of Yu of Xia, who in the Spring and Autumn moved east from Qi County, Henan, into Shandong. King Hui of Chu destroyed Qi in 445 BC."},{"c":"state","k":"莒","old":"莒","mod":"己姓（一说嬴姓）","note":"都城：莒（今山东莒县）。东方旧国，前431 楚简王灭莒。莒地后入齐（年代不详），战国中期已为齐“五都”之一。","i":22,"eold":"Ju","emod":"Ji surname (one view: Ying surname)","enote":"Capital: Ju (modern Ju County, Shandong). An old state of the east; King Jian of Chu destroyed Ju in 431 BC. Its land later passed to Qi (date unknown), and by the middle Warring States it was one of Qi's \"Five Capitals\"."},{"c":"state","k":"邾","old":"邾","mod":"曹姓","note":"都城：绎（今山东邹城峄山之南）。春秋时称邾，战国称邹；孟子为邹人，邹穆公曾与孟子论政。\n国小而介于鲁、齐、楚之间。原图自前350 起把邹并入鲁画（附庸简化，并非灭国），其国实至前3世纪方为楚所并。","i":23,"eold":"Zhu","emod":"Cao surname","enote":"Capital: Yi (south of Mount Yi, modern Zoucheng, Shandong). Called Zhu in the Spring and Autumn and Zou in the Warring States; Mencius was a man of Zou, and Duke Mu of Zou once discussed government with Mencius.\nA small state wedged between Lu, Qi and Chu. From 350 BC the original map draws Zou as part of Lu (a simplification for a dependency, not a conquest); in fact the state lasted until the 3rd century BC, when it was annexed by Chu."},{"c":"state","k":"滕","old":"滕","mod":"姬姓","note":"都城：滕（今山东滕州西南）。泗上小国。据《竹书纪年》越王朱句曾灭滕（约前415），后复国；滕文公问政于孟子（约前326），终为宋康王所灭。\n原图自前350 起把滕并入宋画（附庸简化）。","i":24,"eold":"Teng","emod":"Ji surname","enote":"Capital: Teng (SW of modern Tengzhou, Shandong). A small state on the Si. According to the Bamboo Annals, Zhugou, king of Yue, once destroyed Teng (c. 415 BC), but it was later restored; Duke Wen of Teng asked Mencius about government (c. 326 BC), and Teng was finally destroyed by King Kang of Song.\nFrom 350 BC the original map draws Teng as part of Song (a simplification for a dependency)."},{"c":"state","k":"薛","old":"薛","mod":"任姓","note":"都城：薛（今山东滕州东南）。奚仲之后，传始造车。战国前期为齐所并（年代不详），前321 齐封靖郭君田婴于薛，其子即孟尝君田文。\n原图自前350 起把薛画入齐。","i":25,"eold":"Xue","emod":"Ren surname","enote":"Capital: Xue (SE of modern Tengzhou, Shandong). Descendants of Xi Zhong, who by tradition first made carts. Annexed by Qi in the early Warring States (date unknown); in 321 BC Qi enfeoffed Tian Ying, Lord Jingguo, at Xue, and his son was Tian Wen, Lord Mengchang.\nFrom 350 BC the original map draws Xue as part of Qi."},{"c":"state","k":"郯","old":"郯","mod":"己姓","note":"都城：郯（今山东郯城北）。少昊之后，东夷古国，孔子曾问官于郯子。约前414 越王朱句灭郯（《竹书纪年》），其地入越，后归楚。","i":26,"eold":"Tan","emod":"Ji surname","enote":"Capital: Tan (N of modern Tancheng, Shandong). Descendants of Shaohao, an ancient state of the Eastern Yi; Confucius once asked the viscount of Tan about offices. Around 414 BC Zhugou, king of Yue, destroyed Tan (Bamboo Annals), and its land passed to Yue and later to Chu."},{"c":"state","k":"随","old":"随","mod":"姬姓","note":"都城：随（今湖北随州），即考古所见的曾国。战国早期国君曾侯乙墓（约前433）出土整套编钟，可见尚有相当国力。\n约前4世纪中叶并入楚，年代不详（图上示意）。","i":27,"eold":"Sui","emod":"Ji surname","enote":"Capital: Sui (modern Suizhou, Hubei); it is the state of Zeng known from archaeology. The tomb of Marquis Yi of Zeng, a ruler of the early Warring States (c. 433 BC), yielded a complete set of chime bells, showing that the state still had considerable strength.\nAbsorbed by Chu around the middle of the 4th century BC, date unknown (shown schematically on the map)."},{"c":"state","k":"许","old":"许","mod":"姜姓","note":"都城：容城（今河南鲁山东南，一说叶县西）。春秋时屡迁，依附于楚。\n战国初灭亡，或说灭于楚，或说灭于魏，年代不详（图上示意）。","i":28,"eold":"Xu","emod":"Jiang surname","enote":"Capital: Rongcheng (SE of modern Lushan, Henan; one view: W of Ye County). In the Spring and Autumn it moved repeatedly and depended on Chu.\nIt fell early in the Warring States, to Chu by one view and to Wei by another, at an unknown date (shown schematically on the map)."},{"c":"state","k":"大荔","old":"大荔","mod":"戎","note":"大荔之戎，居今陕西大荔一带，筑王城，自称王。前461 秦厉共公以兵二万伐大荔，取其王城，后改称临晋。","i":29,"eold":"Dali Rong","emod":"Rong","enote":"The Dali Rong lived around modern Dali, Shaanxi, built a royal city (Wangcheng) and styled their ruler king. In 461 BC Duke Ligong of Qin attacked Dali with twenty thousand troops and took its Wangcheng, later renamed Linjin."},{"c":"state","k":"白狄","old":"白狄","mod":"狄","note":"狄人的一支，春秋时居西河（今陕北）与晋北，其别部鲜虞后建中山国。\n战国初陕北洛水上游一带仍为白狄等狄人所居；约前408 前后魏取其地，与河西同设上郡（年代不详，图上示意）。","i":30,"eold":"White Di","emod":"Di","enote":"A branch of the Di; in the Spring and Autumn they lived in Xihe (modern northern Shaanxi) and northern Jin, and their offshoot Xianyu later founded the state of Zhongshan.\nEarly in the Warring States the upper Luo River valley in northern Shaanxi was still inhabited by the White Di and other Di peoples; around 408 BC Wei took the area and set up Shang Commandery together with Hexi (date unknown; shown schematically on the map)."},{"c":"state","k":"西戎","old":"西戎","mod":"戎","note":"陇右诸戎（獂、狄道之戎、绵诸等）。秦惠公伐绵诸（前395），秦献公初年（约前384）西取狄道、獂道一带，此后陇西归秦（图上示意）。","i":31,"eold":"Western Rong","emod":"Rong","enote":"The Rong of Longyou (Huan, the Rong of Didao, Mianzhu and others). Duke Hui of Qin attacked Mianzhu (395 BC), and early in his reign (c. 384 BC) Duke Xian of Qin took the area around Didao and Huandao in the west; thereafter Longxi belonged to Qin (shown schematically on the map)."},{"c":"capital","old":"雍","mod":"陕西宝鸡凤翔区","lon":107.39,"lat":34.52,"st":"秦","y0":-677,"y1":-383,"note":"秦都近三百年（前677–前383），秦公一号大墓所在；迁都后仍为宗庙与祭祀中心。","tl":"-9999:周;-771:西戎;-750:秦","i":32,"eold":"Yong","emod":"Fengxiang District, Baoji, Shaanxi","enote":"Capital of Qin for nearly three hundred years (677–383 BC) and site of Great Tomb No. 1 of the Qin dukes; after the capital moved it remained the centre of the ancestral temples and sacrifices."},{"c":"capital","old":"栎阳","mod":"陕西西安阎良区","lon":109.23,"lat":34.68,"st":"秦","y0":-383,"y1":-350,"note":"秦献公东迁于此以争河西；商鞅第一次变法在此颁行，“徙木立信”即在栎阳。","tl":"-9999:周;-771:西戎;-687:秦","i":33,"eold":"Yueyang","emod":"Yanliang District, Xi'an, Shaanxi","enote":"Duke Xian of Qin moved east here to contend for Hexi; Shang Yang's first reforms were proclaimed here, and \"moving the log to establish trust\" took place at Yueyang."},{"c":"capital","old":"咸阳","mod":"陕西咸阳市东","lon":108.72,"lat":34.37,"st":"秦","y0":-350,"y1":-207,"note":"商鞅主持营建，前350 孝公迁都；渭水穿城，统一后为天下之都。","tl":"-9999:周;-771:西戎;-713:秦","i":34,"eold":"Xianyang","emod":"E of Xianyang, Shaanxi","enote":"Built under Shang Yang's direction; Duke Xiao of Qin moved the capital here in 350 BC. The Wei River ran through the city, and after unification it was the capital of the whole realm."},{"c":"capital","old":"安邑","mod":"山西夏县禹王城","lon":111.22,"lat":35.1,"st":"魏","y0":-453,"y1":-361,"note":"魏国初都，近解池盐利，李悝变法于此。前361 迁都大梁（一说前364）。","tl":"-9999:晋;-745:曲沃;-678:晋;-453:魏;-286:秦","i":35,"eold":"Anyi","emod":"Yuwangcheng, Xia County, Shanxi","enote":"Wei's first capital, near the salt revenues of Lake Xie; Li Kui's reforms took place here. The capital moved to Daliang in 361 BC (or 364 BC)."},{"c":"capital","old":"大梁","mod":"河南开封","lon":114.35,"lat":34.79,"st":"魏","y0":-361,"y1":-225,"note":"魏惠王迁都，魏因称“梁”；孟子见梁惠王即在此。前225 秦军引水灌城而破。","tl":"-9999:东虢;-767:郑;-375:魏;-225:秦","i":36,"eold":"Daliang","emod":"Kaifeng, Henan","enote":"King Hui of Wei moved the capital here, so Wei came to be called \"Liang\"; Mencius's audience with King Hui of Liang took place here. Taken in 225 BC when the Qin army flooded the city."},{"c":"capital","old":"平阳","mod":"山西临汾西南","lon":111.52,"lat":36.08,"st":"韩","y0":-453,"y1":-424,"note":"韩国初都（韩贞子自韩原徙此）。","tl":"-9999:晋;-453:韩;-290:秦","i":37,"eold":"Pingyang","emod":"SW of Linfen, Shanxi","enote":"First capital of Han (Zhenzi of Han moved here from Hanyuan)."},{"c":"capital","old":"宜阳","mod":"河南宜阳西","lon":112.15,"lat":34.55,"st":"韩","y0":-424,"y1":-403,"note":"韩武子一度都此；韩西境重镇，“名为县，其实郡也”。前307 为秦甘茂攻拔。","tl":"-9999:周;-424:韩;-307:秦","i":38,"eold":"Yiyang","emod":"W of Yiyang, Henan","enote":"For a time the capital of Viscount Wu of Han; a key town on Han's western border, \"a county in name, a commandery in fact\". Taken by the Qin general Gan Mao in 307 BC."},{"c":"capital","old":"阳翟","mod":"河南禹州","lon":113.47,"lat":34.15,"st":"韩","y0":-403,"y1":-375,"note":"韩景侯徙都于此。吕不韦出身“阳翟大贾”。","tl":"-9999:郐;-769:郑;-423:韩;-230:秦","i":39,"eold":"Yangzhai","emod":"Yuzhou, Henan","enote":"Marquis Jing of Han moved the capital here. Lü Buwei began as a \"great merchant of Yangzhai\"."},{"c":"capital","old":"新郑","mod":"河南新郑","lon":113.74,"lat":34.39,"st":"韩","y0":-375,"y1":-230,"note":"本郑国都城，前375 韩哀侯灭郑后迁都于此。申不害、韩非皆在此活动。","tl":"-9999:郐;-769:郑;-375:韩;-230:秦","i":40,"eold":"Xinzheng","emod":"Xinzheng, Henan","enote":"Originally the capital of the state of Zheng; Marquis Ai of Han moved the capital here after destroying Zheng in 375 BC. Shen Buhai and Han Fei both worked here."},{"c":"capital","old":"晋阳","mod":"山西太原晋源区","lon":112.48,"lat":37.7,"st":"赵","y0":-497,"y1":-425,"note":"赵简子所筑；前453 智伯水灌晋阳，三家反攻灭智氏。","tl":"-9999:白狄;-541:晋;-453:赵;-248:秦","i":41,"eold":"Jinyang","emod":"Jinyuan District, Taiyuan, Shanxi","enote":"Built by Viscount Jian of Zhao; in 453 BC the Earl of Zhi flooded Jinyang, and the three lineages counterattacked and destroyed the Zhi lineage."},{"c":"capital","old":"中牟","mod":"河南鹤壁一带","lon":114.18,"lat":35.88,"st":"赵","y0":-425,"y1":-386,"note":"赵献侯徙都于此，前386 赵敬侯迁邯郸。春秋末佛肸据中牟叛赵简子；约前382 卫借魏力“堕中牟之郭”。地处魏邺与朝歌之间，赵、魏疆界犬牙交错，图上分界为示意。前361 魏徙大梁，《水经注》谓“赵以中牟易魏”（同年魏以榆次、阳邑予赵）；《赵策》另载楼缓“以中牟反，入梁”（约前300），与此不合。《汉书·地理志》以为河南中牟县，臣瓒、《索隐》已驳。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-361:魏;-257:秦","i":42,"eold":"Zhongmou","emod":"around Hebi, Henan","enote":"Marquis Xian of Zhao moved the capital here; in 386 BC Marquis Jing of Zhao moved it to Handan. At the end of the Spring and Autumn period Bi Xi held Zhongmou in revolt against Viscount Jian of Zhao; c. 382 BC Wey, with Wei's backing, \"pulled down the outer wall of Zhongmou\". Lying between Wei's Ye and Zhaoge, it sat where the borders of Zhao and Wei interlocked; the boundary on the map is schematic. In 361 BC Wei moved its capital to Daliang, and the Shuijing zhu says \"Zhao exchanged Zhongmou with Wei\" (that same year Wei gave Yuci and Yangyi to Zhao); the Zhao section of the Zhanguo ce instead records that Lou Huan \"rose in revolt with Zhongmou and went over to Liang\" (c. 300 BC), which does not agree. The Hanshu treatise on geography takes it to be Zhongmou County in Henan, a view already refuted by Chen Zan and the Suoyin."},{"c":"capital","old":"邯郸","mod":"河北邯郸","lon":114.47,"lat":36.6,"st":"赵","y0":-386,"y1":-228,"note":"赵敬侯迁都。北方冶铁、商业大都会，“邯郸学步”典出于此。","tl":"-9999:卫;-660:赤狄;-594:晋;-453:赵;-228:秦","i":43,"eold":"Handan","emod":"Handan, Hebei","enote":"Marquis Jing of Zhao moved the capital here. A great northern centre of iron-working and trade; the idiom \"learning to walk in Handan\" comes from here."},{"c":"capital","old":"代","mod":"河北蔚县东北","lon":114.57,"lat":39.84,"st":"赵","y0":-228,"y1":-222,"note":"本代国，赵襄子灭之（前457）。前228 赵公子嘉奔代称王，前222 为王贲所虏。","tl":"-9999:;-457:晋;-453:赵;-222:秦","i":44,"eold":"Dai","emod":"NE of Yu County, Hebei","enote":"Originally the state of Dai, destroyed by Viscount Xiang of Zhao (457 BC). In 228 BC Prince Jia of Zhao fled to Dai and styled himself king; he was captured by Wang Ben in 222 BC."},{"c":"capital","old":"郢","mod":"湖北荆州纪南城","lon":112.18,"lat":30.43,"st":"楚","y0":-689,"y1":-278,"note":"楚都四百余年（纪南城遗址；春秋时的郢是否即纪南城，学界有争议）。前278 白起拔郢，焚楚先王墓于夷陵。","tl":"-9999:楚;-506:吴;-505:楚;-278:秦","i":45,"eold":"Ying","emod":"Jinancheng, Jingzhou, Hubei","enote":"Capital of Chu for more than four hundred years (the Jinancheng ruins; whether the Spring and Autumn Ying was at Jinancheng is disputed). In 278 BC Bai Qi took Ying and burned the tombs of the Chu kings at Yiling."},{"c":"capital","old":"陈","mod":"河南周口淮阳区","lon":114.88,"lat":33.73,"st":"楚","y0":-278,"y1":-253,"note":"本陈国都城；楚顷襄王失郢后东迁于此，称“郢陈”。","tl":"-9999:陈;-534:楚;-529:陈;-478:楚;-224:秦","i":46,"eold":"Chen","emod":"Huaiyang District, Zhoukou, Henan","enote":"Originally the capital of the state of Chen; King Qingxiang of Chu moved east here after losing Ying, and it was called \"Ying-Chen\"."},{"c":"capital","old":"巨阳","mod":"安徽太和东南（一说）","lon":115.72,"lat":33.24,"st":"楚","y0":-253,"y1":-241,"note":"楚考烈王徙都之地，具体地望尚无定论。","tl":"-9999:胡;-495:楚;-223:秦","i":47,"eold":"Juyang","emod":"SE of Taihe, Anhui (one view)","enote":"Where King Kaolie of Chu moved the capital; its exact location is still unsettled."},{"c":"capital","old":"寿春","mod":"安徽寿县","lon":116.78,"lat":32.57,"st":"楚","y0":-241,"y1":-223,"note":"楚最后的都城，亦称“郢”。前223 秦破之，虏楚王负刍。","tl":"-9999:六;-622:楚;-223:秦","i":48,"eold":"Shouchun","emod":"Shou County, Anhui","enote":"The last capital of Chu, also called \"Ying\". Taken by Qin in 223 BC, when Fuchu, king of Chu, was captured."},{"c":"capital","old":"临淄","mod":"山东淄博临淄区","lon":118.35,"lat":36.86,"st":"齐","y0":-859,"y1":-221,"note":"齐国都城，号称七万户，“车毂击，人肩摩，连衽成帷，举袂成幕”（苏秦语）。稷下学宫在其稷门外。通常亦计入齐“五都”（临淄、平陆、高唐、即墨、莒），各驻常备军，称“五都之兵”。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":49,"eold":"Linzi","emod":"Linzi District, Zibo, Shandong","enote":"Capital of Qi, said to have seventy thousand households: \"hubs knock against hubs, shoulders rub against shoulders; joined lapels make a curtain, raised sleeves make an awning\" (Su Qin). The Jixia Academy lay outside its Ji Gate. Usually counted among Qi's \"Five Capitals\" (Linzi, Pinglu, Gaotang, Jimo, Ju), each with a standing army, the \"troops of the Five Capitals\"."},{"c":"capital","old":"蓟","mod":"北京西城区一带","lon":116.35,"lat":39.88,"st":"燕","y0":-1045,"y1":-226,"note":"燕上都。前226 秦将王翦破之。","tl":"-9999:燕;-226:秦","i":50,"eold":"Ji","emod":"around Xicheng District, Beijing","enote":"Upper Capital of Yan. Taken by the Qin general Wang Jian in 226 BC."},{"c":"capital","old":"武阳","mod":"河北易县（燕下都）","lon":115.46,"lat":39.3,"st":"燕","y0":-311,"y1":-226,"note":"燕下都，昭王前后营建，东西约 8 公里，为战国面积最大的都城遗址之一。","tl":"-9999:燕;-226:秦","i":51,"eold":"Wuyang","emod":"Yi County, Hebei (Lower Capital of Yan)","enote":"Lower Capital of Yan, built around the reign of King Zhao; about 8 km from east to west, one of the largest city sites of the Warring States."},{"c":"capital","old":"襄平","mod":"辽宁辽阳","lon":123.17,"lat":41.27,"st":"燕","y0":-226,"y1":-222,"note":"燕辽东郡治。前226 燕王喜弃蓟退守于此，前222 为王贲所虏。","tl":"-9999:;-300:燕;-222:秦","i":52,"eold":"Xiangping","emod":"Liaoyang, Liaoning","enote":"Seat of Yan's Liaodong Commandery. In 226 BC Xi, king of Yan, abandoned Ji and fell back here; he was captured by Wang Ben in 222 BC."},{"c":"capital","old":"王城","mod":"河南洛阳","lon":112.43,"lat":34.67,"st":"周","y0":-770,"y1":-256,"note":"东周王城；周分裂后为西周君所居，周赧王亦寄居于此。前256 为秦所灭。","tl":"-9999:周;-256:秦","i":53,"eold":"Wangcheng","emod":"Luoyang, Henan","enote":"The royal city of Eastern Zhou; after Zhou split it was the seat of the lord of West Zhou, and King Nan of Zhou also lodged here. West Zhou was destroyed by Qin in 256 BC."},{"c":"capital","old":"巩","mod":"河南巩义西南","lon":112.97,"lat":34.75,"st":"周","y0":-367,"y1":-249,"note":"东周君所都。前249 秦相吕不韦灭东周。","tl":"-9999:周;-249:秦","i":54,"eold":"Gong","emod":"SW of Gongyi, Henan","enote":"Capital of the lord of East Zhou. In 249 BC the Qin chancellor Lü Buwei destroyed East Zhou."},{"c":"capital","old":"商丘","mod":"河南商丘睢阳区","lon":115.6,"lat":34.38,"st":"宋","y0":-1046,"y1":-286,"note":"宋国都城，商人后裔所居。前286 齐湣王破之。","tl":"-9999:宋;-286:齐;-284:魏;-225:秦","i":55,"eold":"Shangqiu","emod":"Suiyang District, Shangqiu, Henan","enote":"Capital of Song, home of the descendants of the Shang. Taken by King Min of Qi in 286 BC."},{"c":"capital","old":"濮阳","mod":"河南濮阳西南","lon":115.03,"lat":35.72,"st":"卫","y0":-629,"y1":-241,"note":"卫都帝丘。前241 秦拔之，并入东郡。","tl":"-9999:卫;-242:秦","i":56,"eold":"Puyang","emod":"SW of Puyang, Henan","enote":"Diqiu, capital of Wey. Taken by Qin in 241 BC and added to Dong Commandery."},{"c":"capital","old":"野王","mod":"河南沁阳","lon":112.93,"lat":35.09,"st":"卫","y0":-241,"y1":-209,"note":"秦徙卫君角于此，卫作为秦附庸苟存至前209。","tl":"-9999:周;-635:晋;-453:韩;-262:秦;-241:卫;-209:秦","i":57,"eold":"Yewang","emod":"Qinyang, Henan","enote":"Qin moved Jue, lord of Wey, here, and Wey lingered on as a Qin dependency until 209 BC."},{"c":"capital","old":"曲阜","mod":"山东曲阜","lon":116.98,"lat":35.58,"st":"鲁","y0":-1046,"y1":-256,"note":"鲁国都城，孔子故里。前256 为楚所灭（一说前249）。","tl":"-9999:鲁;-256:楚;-223:秦","i":58,"eold":"Qufu","emod":"Qufu, Shandong","enote":"Capital of Lu and home town of Confucius. Lu was destroyed by Chu in 256 BC (one view 249 BC)."},{"c":"capital","old":"顾","mod":"河北定州","lon":114.99,"lat":38.52,"st":"中山","y0":-414,"y1":-380,"note":"中山武公初都。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":59,"eold":"Gu","emod":"Dingzhou, Hebei","enote":"First capital of Duke Wu of Zhongshan."},{"c":"capital","old":"灵寿","mod":"河北平山三汲乡","lon":114.28,"lat":38.3,"st":"中山","y0":-380,"y1":-296,"note":"中山国复国后的都城，城址与中山王厝墓均已发掘。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":60,"eold":"Lingshou","emod":"Sanji Township, Pingshan, Hebei","enote":"Capital of Zhongshan after its restoration; the city site and the tomb of King Cuo of Zhongshan have both been excavated."},{"c":"capital","old":"会稽","mod":"浙江绍兴","lon":120.58,"lat":30.0,"st":"越","y0":-490,"y1":-468,"note":"越国早期都城，勾践卧薪尝胆之地。楚灭越（约前306）后，越人诸君长退保浙江以南，前222 王翦降越君，以此地置会稽郡。","tl":"-9999:越;-306:;-222:秦","i":61,"eold":"Kuaiji","emod":"Shaoxing, Zhejiang","enote":"Early capital of Yue, where Goujian \"slept on brushwood and tasted gall\". After Chu destroyed Yue (c. 306 BC) the Yue chieftains held out south of the Zhe River; in 222 BC Wang Jian received the surrender of the lords of Yue and set up Kuaiji Commandery here."},{"c":"capital","old":"琅琊","mod":"山东青岛黄岛区","lon":119.93,"lat":35.62,"st":"越","y0":-468,"y1":-379,"note":"勾践灭吴后北迁于此以争霸中原（据《竹书纪年》等），后越复南归于吴。","tl":"-9999:莒;-567:齐;-468:越;-379:齐;-284:燕;-279:齐;-221:秦","i":62,"eold":"Langya","emod":"Huangdao District, Qingdao, Shandong","enote":"After destroying Wu, Goujian moved north here to contend for hegemony in the Central Plains (according to the Bamboo Annals and other sources); Yue later moved back south to Wu."},{"c":"capital","old":"吴","mod":"江苏苏州","lon":120.62,"lat":31.3,"st":"越","y0":-379,"y1":-306,"note":"春秋吴国都城。前379 越王翳自琅琊迁都于此；约前306 楚灭越后入楚，属江东郡；前248 春申君改封江东，居于故吴墟。","tl":"-9999:吴;-473:越;-306:楚;-222:秦","i":63,"eold":"Wu","emod":"Suzhou, Jiangsu","enote":"Capital of the Spring and Autumn state of Wu. In 379 BC Yi, king of Yue, moved his capital here from Langya; after Chu destroyed Yue around 306 BC it passed to Chu as part of Jiangdong Commandery; in 248 BC Lord Chunshen was re-enfeoffed in Jiangdong and lived in the ruins of old Wu."},{"c":"capital","old":"江州","mod":"重庆渝中区一带","lon":106.58,"lat":29.56,"st":"巴","y0":-600,"y1":-316,"note":"巴国都城。","tl":"-9999:巴;-316:秦","i":64,"eold":"Jiangzhou","emod":"around Yuzhong District, Chongqing","enote":"Capital of Ba."},{"c":"capital","old":"阆中","mod":"四川阆中","lon":106.0,"lat":31.58,"st":"巴","y0":-400,"y1":-316,"note":"巴国后期都城之一。","tl":"-9999:巴;-316:秦","i":65,"eold":"Langzhong","emod":"Langzhong, Sichuan","enote":"One of the later capitals of Ba."},{"c":"capital","old":"成都","mod":"四川成都","lon":104.06,"lat":30.66,"st":"蜀","y0":-400,"y1":-316,"note":"开明氏蜀国都城。秦灭蜀后张仪、张若筑成都城。","tl":"-9999:蜀;-316:秦","i":66,"eold":"Chengdu","emod":"Chengdu, Sichuan","enote":"Capital of the Kaiming lineage of Shu. After the Qin conquest Zhang Yi and Zhang Ruo built the walls of Chengdu."},{"c":"capital","old":"葭萌","mod":"四川广元昭化古城","lon":105.85,"lat":32.32,"st":"苴","y0":-400,"y1":-316,"note":"苴国都城，蜀王弟苴侯所封之邑，扼金牛道。秦灭苴后置葭萌县，三国时蜀汉改名汉寿。","tl":"-9999:蜀;-360:苴;-316:秦","i":67,"eold":"Jiameng","emod":"Zhaohua old town, Guangyuan, Sichuan","enote":"Capital of Ju, the town enfeoffed to the Marquis of Ju, younger brother of the king of Shu, commanding the Jinniu Road. After destroying Ju, Qin set up Jiameng County; in the Three Kingdoms Shu-Han renamed it Hanshou."},{"c":"capital","old":"义渠","mod":"甘肃宁县西北","lon":107.93,"lat":35.5,"st":"义渠","y0":-600,"y1":-272,"note":"义渠戎都城。","tl":"-9999:义渠;-272:秦","i":68,"eold":"Yiqu","emod":"NW of Ning County, Gansu","enote":"Capital of the Yiqu Rong."},{"c":"capital","old":"新田","mod":"山西侯马","lon":111.37,"lat":35.62,"st":"晋","y0":-585,"y1":-376,"note":"晋景公自故绛迁都于此，仍称绛（新绛），侯马盟书即出于此。三家灭智后晋君仅有绛与曲沃，前376 绝祀。","tl":"-9999:晋;-745:曲沃;-678:晋;-376:魏;-290:秦","i":69,"eold":"Xintian","emod":"Houma, Shanxi","enote":"Duke Jing of Jin moved the capital here from Old Jiang, still calling it Jiang (New Jiang); the Houma covenant texts come from here. After the three lineages destroyed the Zhi, the ruler of Jin held only Jiang and Quwo; Jin's sacrifices ended in 376 BC."},{"c":"capital","old":"新郑","mod":"河南新郑","lon":113.74,"lat":34.39,"st":"郑","y0":-767,"y1":-375,"note":"郑武公灭郐、东虢后所都，春秋时径称“郑”；前375 韩哀侯灭郑，迁都于此，改称新郑（郑韩故城）。","tl":"-9999:郐;-769:郑;-375:韩;-230:秦","i":70,"eold":"Xinzheng","emod":"Xinzheng, Henan","enote":"Capital founded by Duke Wu of Zheng after he destroyed Kuai and East Guo, called simply \"Zheng\" in the Spring and Autumn. In 375 BC Marquis Ai of Han destroyed Zheng, moved his capital here and renamed it Xinzheng (the Zheng–Han city)."},{"c":"capital","old":"吴","mod":"江苏苏州","lon":120.62,"lat":31.3,"st":"吴","y0":-514,"y1":-473,"note":"吴王阖闾命伍子胥筑大城（阖闾城），即今苏州前身（一说阖闾城在今无锡、常州之间）。前473 越破之。","tl":"-9999:吴;-473:越;-306:楚;-222:秦","i":71,"eold":"Wu","emod":"Suzhou, Jiangsu","enote":"Helü, king of Wu, had Wu Zixu build the great city (Helü's City), the forerunner of modern Suzhou (one view puts Helü's City between modern Wuxi and Changzhou). Taken by Yue in 473 BC."},{"c":"capital","old":"下蔡","mod":"安徽凤台","lon":116.7,"lat":32.75,"st":"蔡","y0":-493,"y1":-447,"note":"即州来。蔡昭侯畏楚，前493 迁都于此以依吴，称下蔡，为蔡国最后的都城。前447 楚灭蔡。","tl":"-9999:淮夷;-620:楚;-519:吴;-493:蔡;-447:楚;-223:秦","i":72,"eold":"Xiacai","emod":"Fengtai, Anhui","enote":"That is, Zhoulai. Fearing Chu, Marquis Zhao of Cai moved the capital here in 493 BC to rely on Wu; called Xiacai, it was Cai's last capital. Chu destroyed Cai in 447 BC."},{"c":"capital","old":"淳于","mod":"山东安丘东北","lon":119.25,"lat":36.45,"st":"杞","y0":-544,"y1":-445,"note":"本州国之都，后为杞所有。前544 晋平公率诸侯城杞，杞自缘陵复迁于此。前445 楚灭杞。","tl":"-9999:纪;-690:齐;-544:杞;-445:齐;-284:燕;-279:齐;-221:秦","i":73,"eold":"Chunyu","emod":"NE of Anqiu, Shandong","enote":"Originally the capital of the state of Zhou, later held by Qi. In 544 BC Duke Ping of Jin led the lords to build walls for Qi, and Qi moved again, from Yuanling to here. Chu destroyed Qi in 445 BC."},{"c":"capital","old":"绎","mod":"山东邹城东南（邾国故城）","lon":117.03,"lat":35.33,"st":"邾","y0":-614,"y1":-256,"note":"邾文公卜迁于此，“苟利于民，孤之利也”。战国时称邹，孟子即邹人；约前3世纪中为楚所并。","tl":"-9999:邾;-351:鲁;-256:楚;-223:秦","i":74,"eold":"Yi","emod":"SE of Zoucheng, Shandong (Zhu state ruins)","enote":"Duke Wen of Zhu divined about moving here: \"if it benefits the people, it benefits me\". In the Warring States it was called Zou, and Mencius was a man of Zou; it was annexed by Chu in c. the mid-3rd century BC."},{"c":"capital","old":"滕","mod":"山东滕州西南（滕国故城）","lon":117.15,"lat":35.08,"st":"滕","y0":-1046,"y1":-296,"note":"滕国都城。滕文公曾问政于孟子，行井田（约前326）；后为宋康王所灭（约前4世纪末）。","tl":"-9999:滕;-351:宋;-286:齐;-284:楚;-223:秦","i":75,"eold":"Teng","emod":"SW of Tengzhou, Shandong (Teng state ruins)","enote":"Capital of Teng. Duke Wen of Teng asked Mencius about government and introduced the well-field system (c. 326 BC); Teng was later destroyed by King Kang of Song (c. the late 4th century BC)."},{"c":"capital","old":"容城","mod":"河南鲁山东南（一说叶县西）","lon":113.05,"lat":33.68,"st":"许","y0":-506,"y1":-390,"note":"许自白羽迁此，依楚以存；战国初许亡，年代不详。","tl":"-9999:申;-688:楚;-301:韩;-272:秦","i":76,"eold":"Rongcheng","emod":"SE of Lushan, Henan (one view: W of Ye County)","enote":"Xu moved here from Baiyu and survived by relying on Chu; Xu fell early in the Warring States, date unknown."},{"c":"capital","old":"大荔王城","mod":"陕西大荔东","lon":109.98,"lat":34.78,"st":"大荔","y0":-600,"y1":-461,"note":"大荔之戎所筑王城。前461 秦厉共公取之，后改称临晋。","tl":"-9999:大荔;-461:秦;-408:魏;-330:秦","i":77,"eold":"Dali Wangcheng","emod":"E of Dali, Shaanxi","enote":"The Wangcheng built by the Dali Rong. Taken by Duke Ligong of Qin in 461 BC; later renamed Linjin."},{"c":"battle","old":"晋阳之战","mod":"山西太原","lon":112.55,"lat":37.63,"y":-453,"yt":"前455–前453","sides":"赵·韩·魏 胜 智氏","cmd":"赵襄子 vs 智伯瑶","note":"智伯引晋水灌晋阳，“城不浸者三版”；赵襄子遣张孟谈说韩、魏，三家反攻灭智氏而分其地。三家分晋由此奠定，史家多以此为战国开端的标志之一。","tl":"-9999:白狄;-541:晋;-453:赵;-248:秦","i":78,"eold":"Battle of Jinyang","emod":"Taiyuan, Shanxi","eyt":"455–453 BC","esides":"Zhao, Han and Wei defeated the Zhi lineage","ecmd":"Viscount Xiang of Zhao vs. Zhi Yao","enote":"Zhi Yao, Earl of Zhi, diverted the Jin River to flood Jinyang until \"only three boards' height of the wall stayed above water\"; Viscount Xiang of Zhao sent Zhang Mengtan to win over Han and Wei, and the three lineages counterattacked, destroyed the Zhi lineage and divided their land. This laid the foundation for the partition of Jin, and historians often take it as one of the markers of the start of the Warring States."},{"c":"battle","old":"阴晋之战","mod":"陕西华阴","lon":110.12,"lat":34.52,"y":-389,"yt":"前389","sides":"魏 胜 秦","cmd":"吴起","note":"据《吴子》，吴起以五万魏卒破秦五十万之众（数字或有夸张）。魏据河西达数十年，秦人“东不得出”。","tl":"-9999:虢;-655:晋;-645:秦;-408:魏;-332:秦","i":79,"eold":"Battle of Yinjin","emod":"Huayin, Shaanxi","eyt":"389 BC","esides":"Wei defeated Qin","ecmd":"Wu Qi","enote":"According to the Wuzi, Wu Qi defeated a Qin host of five hundred thousand with fifty thousand Wei troops (the numbers may be exaggerated). Wei held Hexi for several decades, and Qin \"could not come out to the east\"."},{"c":"battle","old":"石门之战","mod":"山西运城西南（一说）","lon":110.95,"lat":35.0,"y":-364,"yt":"前364","sides":"秦 胜 魏","cmd":"秦献公","note":"秦斩首六万，周显王赐秦献公黼黻以贺。秦由守转攻之始。","tl":"-9999:晋;-745:曲沃;-678:晋;-453:魏;-286:秦","i":80,"eold":"Battle of Shimen","emod":"SW of Yuncheng, Shanxi (one view)","eyt":"364 BC","esides":"Qin defeated Wei","ecmd":"Duke Xian of Qin","enote":"Qin took sixty thousand heads, and King Xian of Zhou sent Duke Xian of Qin embroidered ceremonial robes in congratulation. It marked the point at which Qin turned from defence to attack."},{"c":"battle","old":"桂陵之战","mod":"河南长垣西北（一说山东菏泽）","lon":114.6,"lat":35.3,"y":-353,"yt":"前353","sides":"齐 胜 魏","cmd":"田忌·孙膑 vs 庞涓","note":"魏围赵都邯郸，齐用孙膑“围魏救赵”之计，直趋大梁，在魏军回援途中于桂陵截击大破之。","tl":"-9999:卫;-361:魏;-242:秦","i":81,"eold":"Battle of Guiling","emod":"NW of Changyuan, Henan (one view: Heze, Shandong)","eyt":"353 BC","esides":"Qi defeated Wei","ecmd":"Tian Ji and Sun Bin vs. Pang Juan","enote":"Wei besieged Handan, the Zhao capital; Qi followed Sun Bin's plan to \"besiege Wei to rescue Zhao\", marched straight on Daliang, and crushed the Wei army at Guiling as it hurried back to relieve its capital."},{"c":"battle","old":"马陵之战","mod":"河南范县—山东莘县一带（一说山东郯城）","lon":115.5,"lat":35.95,"y":-341,"yt":"前341","sides":"齐 胜 魏","cmd":"田忌·孙膑 vs 庞涓·太子申","note":"孙膑以“减灶”示弱诱敌，伏万弩于马陵道，庞涓智穷自刭，魏太子申被俘。魏国霸业由此崩坏。","tl":"-9999:卫;-242:秦","i":82,"eold":"Battle of Maling","emod":"around Fan County, Henan – Shen County, Shandong (one view: Tancheng, Shandong)","eyt":"341 BC","esides":"Qi defeated Wei","ecmd":"Tian Ji and Sun Bin vs. Pang Juan and Crown Prince Shen","enote":"Sun Bin feigned weakness by \"reducing the cooking fires\" to lure the enemy on, and hid ten thousand crossbowmen along the Maling road; Pang Juan, outwitted, cut his own throat, and Shen, crown prince of Wei, was captured. Wei's hegemony collapsed as a result."},{"c":"battle","old":"雕阴之战","mod":"陕西甘泉南","lon":109.4,"lat":36.22,"y":-330,"yt":"前330","sides":"秦 胜 魏","cmd":"公孙衍 vs 龙贾","note":"秦斩魏军八万，魏被迫尽献河西之地；前328 又献上郡十五县，秦完全控制黄河以西。","tl":"-9999:白狄;-408:魏;-328:秦","i":83,"eold":"Battle of Diaoyin","emod":"S of Ganquan, Shaanxi","eyt":"330 BC","esides":"Qin defeated Wei","ecmd":"Gongsun Yan vs. Long Jia","enote":"Qin killed eighty thousand Wei troops, and Wei was forced to hand over all of Hexi; in 328 BC it also ceded the fifteen counties of Shang Commandery, giving Qin complete control west of the Yellow River."},{"c":"battle","old":"襄陵之战","mod":"河南睢县","lon":115.12,"lat":34.4,"y":-323,"yt":"前323","sides":"楚 胜 魏","cmd":"昭阳","note":"楚柱国昭阳破魏于襄陵，得八邑。陈轸以“画蛇添足”之喻劝昭阳见好就收、罢兵攻齐。","tl":"-9999:宋;-361:魏;-225:秦","i":84,"eold":"Battle of Xiangling","emod":"Sui County, Henan","eyt":"323 BC","esides":"Chu defeated Wei","ecmd":"Zhao Yang","enote":"Zhao Yang, pillar of state of Chu, defeated Wei at Xiangling and took eight towns. Chen Zhen, with the parable of \"drawing legs on a snake\", persuaded Zhao Yang to quit while he was ahead and call off an attack on Qi."},{"c":"battle","old":"修鱼之战","mod":"河南原阳西南","lon":113.85,"lat":35.05,"y":-317,"yt":"前317","sides":"秦 胜 韩·赵·魏","cmd":"樗里疾","note":"前318 公孙衍发起五国合纵攻秦，败于函谷；次年秦军追击，于修鱼斩首八万二千。","tl":"-9999:卫;-660:赤狄;-635:晋;-453:魏;-242:秦","i":85,"eold":"Battle of Xiuyu","emod":"SW of Yuanyang, Henan","eyt":"317 BC","esides":"Qin defeated Han, Zhao and Wei","ecmd":"Chuli Ji","enote":"In 318 BC Gongsun Yan organised a vertical alliance of five states against Qin; the alliance was defeated at Hangu Pass; the next year the Qin army pursued and took eighty-two thousand heads at Xiuyu."},{"c":"battle","old":"秦灭巴蜀","mod":"四川广元（葭萌）","lon":105.84,"lat":32.44,"y":-316,"yt":"前316","sides":"秦 胜 蜀·苴·巴","cmd":"司马错·张仪 vs 蜀王","note":"蜀伐苴，苴侯奔巴，巴、苴求救于秦。秦惠文王从司马错之议，经金牛道（石牛道）伐蜀，蜀王战败于葭萌、死于武阳，秦灭蜀，“遂取苴与巴”。正如司马错战前所言：“得其地足以广国，取其财足以富民缮兵。”","tl":"-9999:蜀;-360:苴;-316:秦","i":86,"eold":"Qin conquest of Ba and Shu","emod":"Guangyuan, Sichuan (Jiameng)","eyt":"316 BC","esides":"Qin defeated Shu, Ju and Ba","ecmd":"Sima Cuo and Zhang Yi vs. the king of Shu","enote":"Shu attacked Ju; the Marquis of Ju fled to Ba, and Ba and Ju appealed to Qin for help. King Huiwen of Qin followed Sima Cuo's advice and attacked Shu by the Jinniu (Shiniu) Road; the king of Shu was defeated at Jiameng and died at Wuyang, and Qin destroyed Shu and \"went on to take Ju and Ba\". As Sima Cuo had argued before the war: \"Its land is enough to enlarge the state, its wealth enough to enrich the people and equip the army.\""},{"c":"battle","old":"丹阳之战","mod":"河南淅川—陕西商南间丹水流域","lon":111.3,"lat":33.1,"y":-312,"yt":"前312","sides":"秦 胜 楚","cmd":"魏章·樗里疾 vs 屈匄","note":"楚怀王受张仪“商於六百里”之欺，怒而攻秦，大败于丹阳，斩首八万，屈匄被俘，秦取楚汉中六百里，置汉中郡。","tl":"-9999:楚;-312:秦","i":87,"eold":"Battle of Danyang","emod":"Dan River valley between Xichuan, Henan and Shangnan, Shaanxi","eyt":"312 BC","esides":"Qin defeated Chu","ecmd":"Wei Zhang and Chuli Ji vs. Qu Gai","enote":"Deceived by Zhang Yi's promise of \"six hundred li of Shang and Wu\", King Huai of Chu attacked Qin in anger and was routed at Danyang; eighty thousand were beheaded and Qu Gai captured, and Qin took six hundred li of Chu's Hanzhong and set up Hanzhong Commandery."},{"c":"battle","old":"蓝田之战","mod":"陕西蓝田","lon":109.28,"lat":34.2,"y":-312,"yt":"前312","sides":"秦 胜 楚","cmd":"—","note":"楚怀王悉发国兵深入至蓝田，再败；韩、魏趁机南袭楚至邓，楚被迫撤军，元气大伤。","tl":"-9999:周;-771:西戎;-687:秦","i":88,"eold":"Battle of Lantian","emod":"Lantian, Shaanxi","eyt":"312 BC","esides":"Qin defeated Chu","enote":"King Huai of Chu threw the state's entire army deep into Qin as far as Lantian and was defeated again; Han and Wei seized the chance to raid Chu as far south as Deng, forcing Chu to withdraw, gravely weakened."},{"c":"battle","old":"楚围雍氏（一）","mod":"河南禹州东北","lon":113.61,"lat":34.26,"y":-312,"yt":"前312","sides":"韩·秦 胜 楚","cmd":"景翠","note":"丹阳之战同年，楚将景翠北上围韩雍氏，适逢韩宣惠王去世。秦一面在丹阳大败楚军，一面遣樗里疾助韩，楚解围而去。《竹书纪年》：“楚景翠围雍氏，韩宣王卒，秦助韩共败楚屈丐。”","tl":"-9999:郐;-769:郑;-423:韩;-230:秦","i":89,"eold":"Chu siege of Yongshi (I)","emod":"NE of Yuzhou, Henan","eyt":"312 BC","esides":"Han and Qin defeated Chu","ecmd":"Jing Cui","enote":"In the same year as the Battle of Danyang, the Chu general Jing Cui marched north and besieged Yongshi in Han, just as King Xuanhui of Han died. Qin, while routing Chu at Danyang, sent Chuli Ji to help Han, and Chu lifted the siege and withdrew. Bamboo Annals: \"Jing Cui of Chu besieged Yongshi; King Xuan of Han died; Qin helped Han and together they defeated Qu Gai of Chu.\""},{"c":"battle","old":"楚围雍氏（二）","mod":"河南禹州东北","lon":113.61,"lat":34.26,"y":-307,"yt":"前307（一说前306）","sides":"韩·秦 胜 楚","cmd":"楚怀王 vs 公仲侈","note":"楚怀王怨丹阳之战时韩不救，发兵围雍氏五月。韩使公仲侈、尚靳先后向秦告急，宣太后是楚人，起初不肯出兵；甘茂以“楚、韩为一，伐秦之形成矣”说秦昭王，秦师出殽，楚兵乃去。","tl":"-9999:郐;-769:郑;-423:韩;-230:秦","i":90,"eold":"Chu siege of Yongshi (II)","emod":"NE of Yuzhou, Henan","eyt":"307 BC (or 306 BC)","esides":"Han and Qin defeated Chu","ecmd":"King Huai of Chu vs. Gongzhong Chi","enote":"Resenting Han's failure to help at Danyang, King Huai of Chu besieged Yongshi for five months. Han sent Gongzhong Chi and then Shang Jin to Qin for help; Queen Dowager Xuan, a native of Chu, at first would not send troops, but Gan Mao persuaded King Zhao of Qin that \"if Chu and Han become one, an attack on Qin will take shape\"; the Qin army came out through the Xiao Mountains, and the Chu troops left."},{"c":"battle","old":"宜阳之战","mod":"河南宜阳","lon":112.25,"lat":34.47,"y":-308,"yt":"前308–前307","sides":"秦 胜 韩","cmd":"甘茂","note":"秦武王欲“车通三川，以窥周室”，甘茂攻宜阳五月而拔，斩首六万。秦由此打开东出中原之门。","tl":"-9999:周;-424:韩;-307:秦","i":91,"eold":"Battle of Yiyang","emod":"Yiyang, Henan","eyt":"308–307 BC","esides":"Qin defeated Han","ecmd":"Gan Mao","enote":"King Wu of Qin wanted \"a road for chariots through Sanchuan, to peer at the house of Zhou\"; Gan Mao besieged Yiyang for five months, took it and beheaded sixty thousand. This opened Qin's gateway east into the Central Plains."},{"c":"battle","old":"楚围雍氏（三）","mod":"河南禹州东北","lon":113.61,"lat":34.26,"y":-300,"yt":"前300","sides":"韩 胜 楚","cmd":"—","note":"韩太子婴死，公子咎与质于楚的公子虮虱争立。楚欲纳虮虱，以兵围雍氏；韩求救于秦，楚终解围而去，公子咎立为太子，即后来的韩釐王（《韩世家》）。《竹书纪年》（《韩世家》集解引）：“楚入雍氏，楚人败。”","tl":"-9999:郐;-769:郑;-423:韩;-230:秦","i":92,"eold":"Chu siege of Yongshi (III)","emod":"NE of Yuzhou, Henan","eyt":"300 BC","esides":"Han defeated Chu","enote":"After the death of Ying, crown prince of Han, Prince Jiu contended for the succession with Prince Jishi, a hostage in Chu. Chu, wanting to install Jishi, besieged Yongshi with its army; Han appealed to Qin, Chu finally lifted the siege and withdrew, and Prince Jiu became crown prince: the later King Xi of Han (the Han chapter of the Shiji). Bamboo Annals (quoted in the Jijie commentary to the Han chapter): \"Chu entered Yongshi; the men of Chu were defeated.\""},{"c":"battle","old":"垂沙之战","mod":"河南唐河—泌阳一带","lon":112.95,"lat":32.75,"y":-301,"yt":"前301","sides":"齐·韩·魏 胜 楚","cmd":"匡章 vs 唐眛","note":"三国联军夜渡泚水破楚，唐眛战死，楚失宛、叶以北之地；庄蹻乘乱起事，“楚分而为三四”。","tl":"-9999:申;-688:楚;-272:秦","i":93,"eold":"Battle of Chuisha","emod":"around Tanghe and Biyang, Henan","eyt":"301 BC","esides":"Qi, Han and Wei defeated Chu","ecmd":"Kuang Zhang vs. Tang Mei","enote":"The three allied armies crossed the Ci River by night and crushed Chu; Tang Mei was killed, and Chu lost its land north of Wan and She. Zhuang Qiao rose in revolt amid the turmoil, and \"Chu split into three or four\"."},{"c":"battle","old":"赵灭中山","mod":"河北平山","lon":114.45,"lat":38.4,"y":-296,"yt":"前305–前296","sides":"赵 胜 中山","cmd":"赵武灵王","note":"赵武灵王以胡服骑射训练之兵，连年攻中山，前296 灭之，迁其王于肤施。赵国代地与邯郸从此连成一片。","tl":"-9999:中山;-406:魏;-380:中山;-296:赵;-228:秦","i":94,"eold":"Zhao conquest of Zhongshan","emod":"Pingshan, Hebei","eyt":"305–296 BC","esides":"Zhao defeated Zhongshan","ecmd":"King Wuling of Zhao","enote":"King Wuling of Zhao attacked Zhongshan year after year with troops trained in nomad dress and mounted archery, destroyed it in 296 BC and moved its king to Fushi. Zhao's Dai region and Handan were now joined into one."},{"c":"battle","old":"伊阙之战","mod":"河南洛阳龙门","lon":112.52,"lat":34.5,"y":-293,"yt":"前293","sides":"秦 胜 韩·魏","cmd":"白起 vs 公孙喜","note":"白起以少胜多，斩首二十四万，虏魏将公孙喜，拔五城。白起一战成名。","tl":"-9999:伊洛戎;-525:晋;-453:韩;-293:秦","i":95,"eold":"Battle of Yique","emod":"Longmen, Luoyang, Henan","eyt":"293 BC","esides":"Qin defeated Han and Wei","ecmd":"Bai Qi vs. Gongsun Xi","enote":"Bai Qi defeated a larger army, beheading two hundred and forty thousand, capturing the Wei general Gongsun Xi and taking five towns. This battle made Bai Qi's name."},{"c":"battle","old":"齐灭宋","mod":"河南商丘","lon":115.72,"lat":34.48,"y":-286,"yt":"前286","sides":"齐 胜 宋","cmd":"齐湣王","note":"宋君偃暴虐，号“桀宋”；齐湣王灭宋，诸侯恐惧，成为五国伐齐的直接导火索。","tl":"-9999:宋;-286:齐;-284:魏;-225:秦","i":96,"eold":"Qi conquest of Song","emod":"Shangqiu, Henan","eyt":"286 BC","esides":"Qi defeated Song","ecmd":"King Min of Qi","enote":"Yan, ruler of Song, was a tyrant known as \"the Jie of Song\"; King Min of Qi destroyed Song, alarming the other lords, and this became the direct trigger of the five-state attack on Qi."},{"c":"battle","old":"济西之战","mod":"山东聊城—高唐间济水以西","lon":116.1,"lat":36.42,"y":-284,"yt":"前284","sides":"燕·秦·韩·赵·魏 胜 齐","cmd":"乐毅 vs 触子","note":"五国联军大破齐军于济水之西，乐毅率燕军长驱直入，连下齐七十余城（《通鉴》作“六月之间”，《乐毅列传》作“留徇齐五岁”），齐湣王出奔至莒，为楚将淖齿所杀。","tl":"-9999:齐;-284:燕;-279:齐;-221:秦","i":97,"eold":"Battle of Jixi","emod":"W of the Ji River, between Liaocheng and Gaotang, Shandong","eyt":"284 BC","esides":"Yan, Qin, Han, Zhao and Wei defeated Qi","ecmd":"Yue Yi vs. Chu Zi","enote":"The five allied armies crushed the Qi army west of the Ji River, and Yue Yi drove deep into Qi with the Yan army, taking seventy-odd Qi towns in succession (the Zizhi Tongjian says \"within six months\", the biography of Yue Yi in the Shiji \"he stayed five years subduing Qi\"); King Min of Qi fled to Ju and was killed by the Chu general Nao Chi."},{"c":"battle","old":"即墨之战","mod":"山东平度东南","lon":120.25,"lat":36.5,"y":-279,"yt":"前279","sides":"齐 胜 燕","cmd":"田单 vs 骑劫","note":"燕惠王中反间，以骑劫代乐毅。田单以“火牛阵”夜袭燕营，燕军大溃，齐尽复七十余城。","tl":"-9999:莱;-567:齐;-221:秦","i":98,"eold":"Battle of Jimo","emod":"SE of Pingdu, Shandong","eyt":"279 BC","esides":"Qi defeated Yan","ecmd":"Tian Dan vs. Qi Jie","enote":"King Hui of Yan fell for a ruse to sow discord and replaced Yue Yi with Qi Jie. Tian Dan raided the Yan camp at night with his \"fire-ox formation\", the Yan army collapsed, and Qi recovered all of its seventy-odd towns."},{"c":"battle","old":"鄢郢之战","mod":"湖北宜城—荆州","lon":112.33,"lat":31.65,"y":-279,"yt":"前279–前278","sides":"秦 胜 楚","cmd":"白起","note":"白起引西山长谷水灌鄢城，楚军民溺死数十万；次年拔郢，焚夷陵（楚先王陵墓），楚迁都于陈，秦置南郡。","tl":"-9999:楚;-279:秦","i":99,"eold":"Battle of Yan and Ying","emod":"between Yicheng and Jingzhou, Hubei","eyt":"279–278 BC","esides":"Qin defeated Chu","ecmd":"Bai Qi","enote":"Bai Qi diverted the waters of a long valley in the western hills to flood the city of Yan, drowning hundreds of thousands of Chu soldiers and civilians; the next year he took Ying and burned Yiling (the tombs of the Chu kings); Chu moved its capital to Chen, and Qin set up Nan Commandery."},{"c":"battle","old":"华阳之战","mod":"河南新郑北","lon":113.72,"lat":34.55,"y":-273
